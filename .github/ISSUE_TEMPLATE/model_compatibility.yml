name: Model compatibility report
description: Report behavior of a repository-reviewed Harnex model/profile on a concrete Android configuration.
title: "model: "
body:
  - type: markdown
    attributes:
      value: |
        Harnex has a curated model surface. This form is for reviewed catalog artifacts/profiles, not arbitrary GGUF support requests. Never attach GGUF bytes, prompts, generated output, private model paths or signed download URLs.
  - type: input
    id: version
    attributes:
      label: Harnex version / commit
      placeholder: 0.5.0-rc.1 or exact commit SHA
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Harnex catalog model ID / size tier
      placeholder: Qwen3.5 4B
    validations:
      required: true
  - type: input
    id: quantization
    attributes:
      label: Quantization
      placeholder: UD-Q4_K_XL
    validations:
      required: true
  - type: input
    id: digest
    attributes:
      label: Artifact SHA-256 digest
      description: Public artifact identity only.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / Android / ABI
      placeholder: Pixel 8 / Android 16 / arm64-v8a
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Harnex runtime/profile identity
      description: Include the Harnex preset/profile or relevant non-sensitive configuration identity when known.
  - type: textarea
    id: result
    attributes:
      label: Observed compatibility result
      description: Describe load, generation, cancellation, memory or thermal behavior without reproducing prompt/output content.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Privacy-safe measurements
      description: Optional TTFT/throughput/PSS/thermal observations when measured under a reproducible configuration.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and claim scope
      options:
        - label: I did not attach GGUF bytes, prompt/output content, private paths, signed URLs, credentials or signing material.
          required: true
        - label: I understand that this report does not by itself certify the model/profile for all supported Android devices.
          required: true
