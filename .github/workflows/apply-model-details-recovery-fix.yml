name: Validate model details recovery

on:
  push:
    branches: [agent/model-details-recovery]
    paths:
      - .github/workflows/apply-model-details-recovery-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/model-details-recovery
          fetch-depth: 1

      - name: Initialize native sources
        run: git submodule update --init --recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Reapply implementation and focused corrections
        run: |
          python3 - <<'PY'
          import base64
          import re
          import subprocess
          import zlib
          from pathlib import Path

          workflow = Path('.github/workflows/apply-model-details-recovery.yml').read_text()
          encoded = re.search(r'^\s*PATCH_B64:\s*(\S+)\s*$', workflow, re.MULTILINE)
          if encoded is None:
              raise RuntimeError('Unable to locate deterministic patch')
          patch = Path('/tmp/model_details_patch.py')
          patch.write_bytes(zlib.decompress(base64.b64decode(encoded.group(1))))
          subprocess.run(['python3', str(patch)], check=True)

          details_path = Path('apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelDetailsTest.kt')
          details = details_path.read_text()
          marker = '    private fun item(\n'
          if details.count(marker) != 1:
              raise RuntimeError(f'Expected one detail fixture helper, found {details.count(marker)}')
          details = details.replace(marker, '    @Suppress("LongParameterList")\n    private fun item(\n', 1)
          details = details.replace(
              'selectedModel = null,\n                loadedDigest = metadata.digest.sha256,',
              'selectedModel = testModel("8"),\n                loadedDigest = metadata.digest.sha256,',
              1,
          )
          details_path.write_text(details)

          effects_path = Path('apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelEffectsViewModelTest.kt')
          effects = effects_path.read_text()
          old_fixture = 'current = ModelEffectsSnapshot(distribution, null, metadata.digest.sha256),'
          new_fixture = 'current = ModelEffectsSnapshot(distribution, testModel("8"), metadata.digest.sha256),'
          if effects.count(old_fixture) != 1:
              raise RuntimeError(f'Expected one mismatch fixture, found {effects.count(old_fixture)}')
          effects = effects.replace(old_fixture, new_fixture, 1)
          old_identity = 'viewModel.uiState.value.modelInventory.items.single(),'
          new_identity = 'viewModel.uiState.value.modelInventory.items.single { it.loaded },'
          if effects.count(old_identity) != 1:
              raise RuntimeError(f'Expected one loaded identity fixture, found {effects.count(old_identity)}')
          effects_path.write_text(effects.replace(old_identity, new_identity, 1))

          activity_path = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/MainActivity.kt')
          activity = activity_path.read_text()
          activity = activity.replace(
              'onRequestRecovery = harnessViewModel.models.recovery::request,',
              'onRequestRecovery = { identity, action ->\n                                harnessViewModel.models.recovery.request(identity, action)\n                            },',
          )
          activity = activity.replace(
              'onConfirmRecovery = harnessViewModel.models.recovery::confirm,',
              'onConfirmRecovery = { harnessViewModel.models.recovery.confirm() },',
          )
          activity_path.write_text(activity)
          PY

      - name: Format implementation
        run: ./gradlew spotlessApply

      - name: Validate static contracts
        run: ./gradlew --no-configuration-cache detekt verifyNoModelArtifacts

      - name: Validate phone application
        run: >-
          ./gradlew
          :apps:local-llm-phone-test:compileDebugKotlin
          :apps:local-llm-phone-test:compileDebugUnitTestKotlin
          :apps:local-llm-phone-test:testDebugUnitTest
          :apps:local-llm-phone-test:lintDebug
          :apps:local-llm-phone-test:assembleDebug

      - name: Verify model detail integration
        run: |
          test -f apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelDetails.kt
          test -f apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelDetailScreen.kt
          grep -q 'MODEL_DETAIL_PATTERN' apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessNavigation.kt
          grep -q 'executeRecovery' apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/ModelEffects.kt

      - name: Remove temporary workflows and commit implementation
        run: |
          rm .github/workflows/apply-model-details-recovery.yml
          rm .github/workflows/apply-model-details-recovery-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(phone-test): add model details and recovery'
          git push origin HEAD:agent/model-details-recovery
