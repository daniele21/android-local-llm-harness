name: Inspect model details recovery failure

on:
  push:
    branches: [agent/model-details-recovery]
    paths:
      - .github/workflows/apply-model-details-recovery-fix.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/model-details-recovery
          fetch-depth: 1

      - name: Reapply implementation and focused corrections
        run: |
          python3 - <<'PY'
          import base64
          import re
          import subprocess
          import zlib
          from pathlib import Path

          workflow = Path('.github/workflows/apply-model-details-recovery.yml').read_text()
          encoded = re.search(r'^\s*PATCH_B64:\s*(\S+)\s*$', workflow, re.MULTILINE)
          if encoded is None:
              raise RuntimeError('Unable to locate original deterministic patch')
          patch = Path('/tmp/model_details_patch.py')
          patch.write_bytes(zlib.decompress(base64.b64decode(encoded.group(1))))
          subprocess.run(['python3', str(patch)], check=True)

          test_path = Path('apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelDetailsTest.kt')
          text = test_path.read_text()
          marker = '    private fun item(\n'
          text = text.replace(marker, '    @Suppress("LongParameterList")\n    private fun item(\n', 1)
          text = text.replace(
              'selectedModel = null,\n                loadedDigest = metadata.digest.sha256,',
              'selectedModel = testModel("8"),\n                loadedDigest = metadata.digest.sha256,',
              1,
          )
          test_path.write_text(text)

          activity_path = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/MainActivity.kt')
          activity = activity_path.read_text()
          activity = activity.replace(
              'onRequestRecovery = harnessViewModel.models.recovery::request,',
              'onRequestRecovery = { identity, action ->\n                                harnessViewModel.models.recovery.request(identity, action)\n                            },',
          )
          activity = activity.replace(
              'onConfirmRecovery = harnessViewModel.models.recovery::confirm,',
              'onConfirmRecovery = { harnessViewModel.models.recovery.confirm() },',
          )
          activity_path.write_text(activity)
          PY

      - name: Print failing test and recovery implementation
        run: |
          echo '--- HarnessModelEffectsViewModelTest ---'
          nl -ba apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelEffectsViewModelTest.kt | sed -n '90,190p'
          echo '--- Recovery implementation ---'
          grep -R -n -A35 -B15 'executeRecovery\|class ModelRecovery\|fun request(identity' apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest || true
