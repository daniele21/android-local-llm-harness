name: Inspect generated recovery test

on:
  push:
    branches: [agent/model-details-recovery]
    paths:
      - .github/workflows/apply-model-details-recovery-fix.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/model-details-recovery
          fetch-depth: 1

      - name: Generate feature source
        run: |
          python3 - <<'PY'
          import base64
          import re
          import subprocess
          import zlib
          from pathlib import Path

          workflow = Path('.github/workflows/apply-model-details-recovery.yml').read_text()
          encoded = re.search(r'^\s*PATCH_B64:\s*(\S+)\s*$', workflow, re.MULTILINE)
          if encoded is None:
              raise RuntimeError('Unable to locate deterministic patch')
          patch = Path('/tmp/model_details_patch.py')
          patch.write_bytes(zlib.decompress(base64.b64decode(encoded.group(1))))
          subprocess.run(['python3', str(patch)], check=True)
          PY

      - name: Print recovery test method
        run: |
          TEST=apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelEffectsViewModelTest.kt
          nl -ba "$TEST" | sed -n '95,175p'
          echo '--- request candidates ---'
          grep -n -A10 -B10 'ADOPT_LOADED' "$TEST" || true
