name: Q35 playground unit diagnostic once

on:
  push:
    paths:
      - ".github/workflows/q35-playground-unit-diagnostic-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Reproduce playground patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap
          source = Path('.github/workflows/q35-playground-once.yml').read_text()
          def run_step(name):
              marker = f'      - name: {name}\n'
              start = source.index(marker) + len(marker)
              run = source.index('        run: |\n', start) + len('        run: |\n')
              tail = source[run:]
              end = tail.find('\n      - name: ')
              subprocess.run(['bash', '-lc', textwrap.dedent(tail if end < 0 else tail[:end])], check=True)
          run_step('Integrate Qwen3.5 presets into playground')
          run_step('Add Qwen3.5 playground assertions')
          PY
      - name: Diagnose Kotlin/unit failure
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-configuration-cache :apps:local-llm-phone-test:testDebugUnitTest > /tmp/gradle.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/gradle.log').read_text(errors='replace').splitlines()
          needles = (' e: ', 'e: file:', 'FAILED', 'FAILURE:', 'Compilation error', 'Unresolved reference', 'No value passed', 'Type mismatch', 'Cannot find', 'expected:<', 'but was:<')
          hits = [line for line in lines if any(n in line for n in needles)]
          print('\n'.join(hits[-120:]))
          PY
            exit $status
          fi
