name: Documentation validation

on:
  pull_request:
    paths:
      - "README.md"
      - "BRANCHING.md"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".rgignore"
      - ".github/CODEOWNERS"
      - "docs/**"
      - "scripts/verify-docs.py"
      - "scripts/verify-agent-navigation.py"
      - "scripts/test_verify_docs.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main, dev]
    paths:
      - "README.md"
      - "BRANCHING.md"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".rgignore"
      - ".github/CODEOWNERS"
      - "docs/**"
      - "scripts/verify-docs.py"
      - "scripts/verify-agent-navigation.py"
      - "scripts/test_verify_docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify documentation
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m py_compile scripts/verify-docs.py scripts/verify-agent-navigation.py scripts/test_verify_docs.py
          python3 scripts/test_verify_docs.py
          python3 scripts/verify-docs.py --base "$DOCS_BASE_SHA"
          python3 scripts/verify-agent-navigation.py
          git diff --check
