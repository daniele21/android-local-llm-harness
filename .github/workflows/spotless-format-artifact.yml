name: Spotless format artifact

on:
  push:
    branches: [codex/shared-runtime-plan]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Format Kotlin sources
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply

          mkdir -p build/spotless-formatted
          git diff --name-only -- '*.kt' > build/spotless-formatted-files.txt
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            mkdir -p "build/spotless-formatted/$(dirname "$file")"
            cp "$file" "build/spotless-formatted/$file"
          done < build/spotless-formatted-files.txt

      - name: Upload formatted sources
        uses: actions/upload-artifact@v7
        with:
          name: spotless-formatted-sources
          path: |
            build/spotless-formatted/**
            build/spotless-formatted-files.txt
          if-no-files-found: error
          retention-days: 1
