name: Agent CA1 detekt pass

on:
  push:
    branches:
      - agent/consumer-api-ca0-ca1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final CA-1 refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-ca1-detekt-final.yml').read_text()
          body = workflow.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(body, {})

          path = Path('core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt')
          source = path.read_text()
          source = source.replace(
              'is ContextResult.Rejected -> rejected(context.code, context.detail)',
              'is ContextResult.Rejected -> ConsumerPolicyDecision.Rejected(context.code, context.detail)',
          )
          start_marker = '    private fun rejected(code: ConsumerCapabilityErrorCode, detail: String): ConsumerPolicyDecision.Rejected =\n'
          if start_marker in source:
              start = source.index(start_marker)
              end = source.index('\n\n', start)
              source = source[:start] + source[end + 2:]
          path.write_text(source)
          PY
      - name: Format and validate CA-1
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply detekt :core:runtime-core:testDebugUnitTest
      - name: Commit clean CA-1 source
        run: |
          git add core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt
          git rm .github/workflows/agent-ca1-detekt-refactor.yml \
            .github/workflows/agent-ca1-detekt-finish.yml \
            .github/workflows/agent-ca1-detekt-final.yml \
            .github/workflows/agent-ca1-detekt-pass.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor(consumer-api): isolate selection checks'
          git push origin HEAD:${{ github.ref_name }}
