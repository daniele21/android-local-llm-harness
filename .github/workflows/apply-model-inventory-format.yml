name: Apply model inventory formatting

on:
  push:
    branches: [agent/models-udf-foundation]
    paths:
      - .github/workflows/apply-model-inventory-format.yml
      - apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelInventory.kt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/models-udf-foundation
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Format model inventory foundation
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-configuration-cache --stacktrace

      - name: Validate static contracts
        run: |
          ./gradlew spotlessCheck detekt --no-configuration-cache --stacktrace

      - name: Validate phone application
        run: |
          ./gradlew \
            :apps:local-llm-phone-test:testDebugUnitTest \
            :apps:local-llm-phone-test:lintDebug \
            :apps:local-llm-phone-test:compileDebugKotlin \
            --no-configuration-cache \
            --stacktrace

      - name: Remove temporary validation workflows
        run: |
          rm .github/workflows/validate-model-inventory-foundation.yml
          rm .github/workflows/apply-model-inventory-format.yml

      - name: Commit formatted validated foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(phone-test): format model inventory foundation"
          git push origin HEAD:agent/models-udf-foundation
