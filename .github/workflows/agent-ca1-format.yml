name: Agent CA1 formatter

on:
  push:
    branches:
      - agent/consumer-api-ca0-ca1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply repository formatter
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Commit formatted CA-1 sources
        run: |
          git add \
            core/contracts/src/main/kotlin/io/github/daniele21/localllm/contracts/ConsumerCapabilities.kt \
            core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt \
            core/runtime-core/src/test/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicyServiceTest.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(consumer-api): apply repository formatting'
          git push origin HEAD:${{ github.ref_name }}
