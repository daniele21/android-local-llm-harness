name: Documentation screenshots fast capture

on:
  push:
    branches:
      - agent/docs-screenshots-fast-20260907
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_REVISION: e63deb9cdcd9b5a35774c1ecbeb01e4e35cc3065
      PACKAGE_RUN_ID: "34088650601"

    steps:
      - name: Check out capture workflow
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure emulator directories
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd" "$RUNNER_TEMP/android-user" "$RUNNER_TEMP/harnex-doc-screenshots/screenshots"

      - name: Install emulator and signing tools
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Download exact product APK artifact
        uses: actions/download-artifact@v7
        with:
          name: local-llm-phone-test-artifacts
          path: ${{ runner.temp }}/product-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: daniele21/harnex
          run-id: 34088650601

      - name: Prepare x86_64 UI canary from exact product APK
        id: canary
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/harnex-doc-screenshots"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          original_apk="$RUNNER_TEMP/product-artifact/apps/local-llm-phone-test/build/outputs/apk/debug/local-llm-phone-test-debug.apk"
          canary_unaligned="$RUNNER_TEMP/harnex-docs-no-native-unaligned.apk"
          canary_apk="$RUNNER_TEMP/harnex-docs-no-native.apk"
          canary_keystore="$RUNNER_TEMP/harnex-docs-canary.p12"

          [[ -s "$original_apk" ]] || { echo "Exact product APK missing" >&2; find "$RUNNER_TEMP/product-artifact" -type f >&2; exit 1; }
          cp "$original_apk" "$canary_unaligned"
          sha256sum "$original_apk" > "$evidence/product-apk.sha256"

          mapfile -t native_entries < <(zipinfo -1 "$canary_unaligned" | grep '^lib/' || true)
          [[ "${#native_entries[@]}" -gt 0 ]] || { echo "Expected native entries before stripping" >&2; exit 1; }
          printf '%s\n' "${native_entries[@]}" > "$evidence/original-native-entries.txt"
          zip -dq "$canary_unaligned" "${native_entries[@]}"

          keytool -genkeypair \
            -keystore "$canary_keystore" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias docs \
            -dname "CN=Harnex Docs CI, OU=CI, O=Harnex, C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -noprompt

          "$build_tools/zipalign" -f -p 4 "$canary_unaligned" "$canary_apk"
          "$build_tools/apksigner" sign \
            --ks "$canary_keystore" \
            --ks-key-alias docs \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$canary_apk"
          "$build_tools/apksigner" verify --verbose "$canary_apk" > "$evidence/apksigner-verify.txt"

          package_name=$("$build_tools/aapt" dump badging "$canary_apk" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)
          activity_name=$("$build_tools/aapt" dump badging "$canary_apk" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p" | head -n 1)
          [[ -n "$package_name" && -n "$activity_name" ]] || exit 1
          echo "apk=$canary_apk" >> "$GITHUB_OUTPUT"
          echo "package=$package_name" >> "$GITHUB_OUTPUT"
          echo "activity=$activity_name" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Start Pixel 6 API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/harnex-doc-screenshots"
          echo "no" | avdmanager create avd \
            --force \
            --name harnex-docs-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd harnex-docs-api35 \
            -port 5554 \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot \
            > "$evidence/emulator.log" 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb -s emulator-5554 shell settings put global window_animation_scale 0
              adb -s emulator-5554 shell settings put global transition_animation_scale 0
              adb -s emulator-5554 shell settings put global animator_duration_scale 0
              adb -s emulator-5554 shell settings put system font_scale 1.0
              adb -s emulator-5554 shell cmd uimode night no || true
              adb -s emulator-5554 shell wm dismiss-keyguard || true
              exit 0
            fi
            sleep 2
          done
          cat "$evidence/emulator.log" >&2 || true
          exit 1

      - name: Capture eight primary screens
        env:
          ANDROID_SERIAL: emulator-5554
          CANARY_APK: ${{ steps.canary.outputs.apk }}
          PACKAGE_NAME: ${{ steps.canary.outputs.package }}
          ACTIVITY_NAME: ${{ steps.canary.outputs.activity }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/harnex-doc-screenshots"
          screenshots="$evidence/screenshots"
          component="$PACKAGE_NAME/$ACTIVITY_NAME"

          dump_ui() {
            adb shell uiautomator dump /sdcard/harnex-docs-window.xml >/dev/null
            adb pull /sdcard/harnex-docs-window.xml "$evidence/window.xml" >/dev/null
          }
          find_center() {
            local attr="$1" value="$2"
            python3 - "$evidence/window.xml" "$attr" "$value" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          path, attr, value = sys.argv[1:]
          for node in ET.parse(path).getroot().iter('node'):
              if node.attrib.get(attr, '') == value:
                  nums = [int(x) for x in re.findall(r'\d+', node.attrib.get('bounds', ''))]
                  if len(nums) == 4:
                      x1, y1, x2, y2 = nums
                      print(f"{(x1+x2)//2} {(y1+y2)//2}")
                      raise SystemExit(0)
          raise SystemExit(1)
          PY
          }
          tap_exact() {
            local attr="$1" value="$2" allow_scroll="${3:-0}"
            for attempt in $(seq 1 4); do
              dump_ui
              if coords="$(find_center "$attr" "$value")"; then
                read -r x y <<< "$coords"
                adb shell input tap "$x" "$y"
                sleep 1
                return 0
              fi
              if [[ "$allow_scroll" == "1" ]]; then
                adb shell input swipe 540 1650 540 850 300
                sleep 0.5
              fi
            done
            echo "Could not find $attr=$value" >&2
            cat "$evidence/window.xml" >&2 || true
            return 1
          }
          capture() {
            local name="$1"
            sleep 1
            adb exec-out screencap -p > "$screenshots/$name.png"
            [[ -s "$screenshots/$name.png" ]]
          }

          adb install --no-streaming -r -t "$CANARY_APK"
          adb shell pm clear "$PACKAGE_NAME"
          adb shell am start -W -n "$component" > "$evidence/am-start.txt"
          sleep 3
          dump_ui
          grep -F 'text="Harnex"' "$evidence/window.xml" >/dev/null
          grep -F 'text="Local AI Console"' "$evidence/window.xml" >/dev/null

          capture 01-overview
          tap_exact content-desc Playground; capture 02-playground
          tap_exact content-desc Apps; capture 03-apps
          tap_exact content-desc Activity; capture 04-activity
          tap_exact content-desc Performance; capture 05-performance
          tap_exact content-desc Models; capture 06-models
          tap_exact content-desc Overview
          tap_exact text "Runtime health" 1
          capture 07-diagnostics
          adb shell input keyevent KEYCODE_BACK
          sleep 1
          tap_exact content-desc "Open settings"
          capture 08-settings

          cat > "$evidence/manifest.txt" <<EOF
          product=Harnex
          product_revision=$PRODUCT_REVISION
          product_artifact_run=$PACKAGE_RUN_ID
          capture_workflow_revision=$(git rev-parse HEAD)
          execution_environment=Android API 35 Google APIs x86_64 emulator (Pixel 6 profile)
          fidelity_class=simulated_or_emulated
          system_theme=light
          observed_app_theme=dark
          font_scale=1.0
          native_backend=not_executed; ARM64 native libraries stripped only to enable x86_64 UI capture
          screens=Overview,Playground,Apps,Activity,Performance,Models,Diagnostics,Settings
          EOF
          (cd "$screenshots" && sha256sum *.png) > "$evidence/screenshots.sha256"
          test "$(find "$screenshots" -maxdepth 1 -name '*.png' | wc -l)" -eq 8

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harnex-documentation-screenshots-final
          path: ${{ runner.temp }}/harnex-doc-screenshots/**
          if-no-files-found: error
          retention-days: 14
