name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Generate wrapper when absent
        shell: bash
        run: |
          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "Gradle wrapper already present."
            exit 0
          fi

          bootstrap_directory="$(mktemp -d)"
          pushd "$bootstrap_directory"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > settings.gradle.kts
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          popd

          cp "$bootstrap_directory/gradlew" ./gradlew
          cp "$bootstrap_directory/gradlew.bat" ./gradlew.bat
          mkdir -p gradle/wrapper
          cp "$bootstrap_directory/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          cp "$bootstrap_directory/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/

          if ! grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties; then
            echo 'distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' \
              >> gradle/wrapper/gradle-wrapper.properties
          fi

          chmod +x gradlew

      - name: Commit generated wrapper
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- gradlew gradlew.bat gradle/wrapper)" ]]; then
            echo "No wrapper changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "Add Gradle wrapper"
          git push
