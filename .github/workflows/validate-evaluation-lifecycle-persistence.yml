name: Validate evaluation lifecycle persistence

on:
  pull_request:
    paths:
      - "evaluation/persistence/**"
      - "evaluation/engine/**"
      - "evaluation/contracts/**"
      - "evaluation/in-memory-store/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-evaluation-lifecycle-persistence.yml"
  push:
    branches: [dev]
    paths:
      - "evaluation/persistence/**"
      - "evaluation/engine/**"
      - "evaluation/contracts/**"
      - "evaluation/in-memory-store/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-evaluation-lifecycle-persistence.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Repository quality gate
        run: ./gradlew --no-configuration-cache spotlessCheck detekt verifyNoModelArtifacts
      - name: Lifecycle persistence compile
        run: ./gradlew --no-configuration-cache :evaluation:persistence:compileDebugKotlin
      - name: Lifecycle persistence tests
        run: ./gradlew --no-configuration-cache :evaluation:persistence:testDebugUnitTest
      - name: Lifecycle persistence lint
        run: ./gradlew --no-configuration-cache :evaluation:persistence:lintDebug
