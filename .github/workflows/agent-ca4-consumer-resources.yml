name: Agent CA-4 consumer resources
on:
  push:
    branches: [agent/ca4-binder-integration]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ca4-binder-integration
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConsumerHostOperations.kt')
          s=p.read_text()
          s=s.replace('    private val resources: HostRuntimeResources,\n    private val controlExecutor:', '    private val resources: HostRuntimeResources,\n    private val consumerResources: ConsumerHostResources,\n    private val controlExecutor:')
          for a,b in [
              ('resources.consumerClient(', 'consumerResources.client('),
              ('resources.markConsumerSession(', 'consumerResources.markSession('),
              ('resources.isConsumerSession(', 'consumerResources.ownsSession('),
              ('resources.removeConsumerSession(', 'consumerResources.removeSession('),
              ('resources.attachConsumerHandle(start.handle)', 'resources.attachHandle(start.handle.requestId, ConsumerGenerationHandleBridge(start.handle))'),
          ]:
              s=s.replace(a,b)
          p.write_text(s)
          PY
          rm -f .github/workflows/agent-ca4-consumer-resources.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: wire CA-4 consumer resources' || true
          git push
