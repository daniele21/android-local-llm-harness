name: Validate model download

on:
  pull_request:
    paths:
      - "models/model-download/**"
      - "models/model-catalog/**"
      - "models/model-profile/**"
      - "models/model-store/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-model-download.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-model-download-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Validate formatting, static analysis and repository guard
        run: |
          ./gradlew --no-configuration-cache --stacktrace \
            spotlessCheck \
            detekt \
            verifyNoModelArtifacts
      - name: Test secure downloader
        run: |
          ./gradlew --no-configuration-cache --stacktrace \
            :models:model-download:testDebugUnitTest
      - name: Lint secure downloader
        run: |
          ./gradlew --no-configuration-cache --stacktrace \
            :models:model-download:lintDebug
