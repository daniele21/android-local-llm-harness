name: Validate model distribution

on:
  pull_request:
    paths:
      - "models/model-download/**"
      - "models/model-install/**"
      - "models/model-catalog/**"
      - "models/model-profile/**"
      - "models/model-store/**"
      - "backends/llama-cpp/build.gradle.kts"
      - "backends/llama-cpp/src/main/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppGgufArtifactInspector.kt"
      - "backends/llama-cpp/src/test/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppGgufArtifactInspectorTest.kt"
      - "settings.gradle.kts"
      - ".github/workflows/validate-model-download.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-model-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Apply canonical formatting
        run: ./gradlew --no-configuration-cache --stacktrace spotlessApply
      - name: Verify formatter convergence
        run: ./gradlew --no-configuration-cache --stacktrace spotlessCheck
      - name: Publish canonical formatting to feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo "No formatter changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessApplicationsGateway.kt \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessApplicationsReadUi.kt \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessApplicationsReadViewModel.kt \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessCustomPresetGateway.kt
          git commit -m "style: apply canonical Kotlin formatting"
          git push origin HEAD:${{ github.head_ref }}
      - name: Run static analysis
        run: ./gradlew --no-configuration-cache --stacktrace detekt
      - name: Verify repository contains no model artifacts
        run: ./gradlew --no-configuration-cache --stacktrace verifyNoModelArtifacts
      - name: Test model distribution boundaries
        run: |
          ./gradlew --no-configuration-cache --stacktrace \
            :models:model-download:testDebugUnitTest \
            :models:model-install:testDebugUnitTest \
            :backends:llama-cpp:testDebugUnitTest
      - name: Lint model distribution boundaries
        run: |
          ./gradlew --no-configuration-cache --stacktrace \
            :models:model-download:lintDebug \
            :models:model-install:lintDebug \
            :backends:llama-cpp:lintDebug
