name: Apply model installation formatting

on:
  pull_request:
    paths:
      - "models/model-install/**"
      - ".github/workflows/validate-model-download.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-model-installation-formatting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Apply canonical formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace spotlessApply
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            models/model-install/src/main/kotlin/io/github/daniele21/localllm/install/ModelInstallation.kt \
            models/model-install/src/test/kotlin/io/github/daniele21/localllm/install/VerifiedModelInstallerTest.kt
          git commit -m "Apply canonical Kotlin formatting"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
