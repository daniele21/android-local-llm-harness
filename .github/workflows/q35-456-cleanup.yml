name: Q35 4 5 6 cleanup

on:
  push:
    paths:
      - ".github/workflows/q35-456-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Align Qwen3.5 phone context default
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneTestModels.kt')
          text = path.read_text()
          old = '    contextSize: Int = 512,\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy 512 context default, found {text.count(old)}')
          path.write_text(text.replace(old, '    contextSize: Int = 2_048,\n', 1))
          PY
          chmod +x scripts/run-qwen35-tuning-matrix.sh scripts/summarize-qwen35-tuning.py
      - name: Format
        run: ./gradlew spotlessApply
      - name: Validate Q35 core and device harness
        shell: bash
        run: |
          ./gradlew --no-configuration-cache detekt verifyNoModelArtifacts
          ./gradlew \
            :models:model-profile:testDebugUnitTest \
            :core:runtime-core:testDebugUnitTest \
            :backends:llama-cpp:testDebugUnitTest \
            :apps:local-llm-phone-test:testDebugUnitTest \
            :apps:device-test-runner:compileDebugAndroidTestKotlin
          bash -n scripts/run-qwen35-tuning-matrix.sh scripts/run-device-e2e.sh
          python3 -m py_compile scripts/summarize-qwen35-tuning.py
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/q35-456-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneTestModels.kt \
            apps/device-test-runner/src/androidTest/kotlin/io/github/daniele21/localllm/devicetest/Qwen35TuningInstrumentedTest.kt \
            scripts/run-qwen35-tuning-matrix.sh \
            scripts/summarize-qwen35-tuning.py
          git add -u .github/workflows/q35-456-cleanup.yml
          git commit -m "fix: align qwen35 context and tuning harness"
          git push origin HEAD:dev
