name: Validate evaluation datasets

on:
  pull_request:
    paths:
      - "evaluation/datasets/**"
      - "evaluation/contracts/**"
      - "evaluation/evaluators/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-evaluation-datasets.yml"
  push:
    branches: [dev]
    paths:
      - "evaluation/datasets/**"
      - "evaluation/contracts/**"
      - "evaluation/evaluators/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-evaluation-datasets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Spotless
        run: ./gradlew --no-configuration-cache spotlessCheck
      - name: Detekt
        run: ./gradlew --no-configuration-cache detekt
      - name: Model artifact guard
        run: ./gradlew --no-configuration-cache verifyNoModelArtifacts
      - name: Dataset compile
        run: ./gradlew --no-configuration-cache :evaluation:datasets:compileDebugKotlin
      - name: Dataset tests
        run: ./gradlew --no-configuration-cache :evaluation:datasets:testDebugUnitTest
      - name: Dataset lint
        run: ./gradlew --no-configuration-cache :evaluation:datasets:lintDebug
