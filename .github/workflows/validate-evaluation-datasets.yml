name: Validate evaluation datasets

on:
  pull_request:
    paths:
      - "evaluation/datasets/**"
      - ".github/workflows/validate-evaluation-datasets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Apply repository formatter
        run: ./gradlew --no-configuration-cache spotlessApply
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-d10
          path: |
            evaluation/datasets/src/main/kotlin/io/github/daniele21/localllm/evaluation/datasets/AndroidDatasetDocumentImporter.kt
            evaluation/datasets/src/test/kotlin/io/github/daniele21/localllm/evaluation/datasets/AndroidDatasetDocumentImporterTest.kt
