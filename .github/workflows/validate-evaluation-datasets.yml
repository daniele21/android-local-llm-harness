name: Validate evaluation datasets

on:
  pull_request:
    paths:
      - "evaluation/datasets/**"
      - "evaluation/contracts/**"
      - "evaluation/evaluators/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-evaluation-datasets.yml"
  push:
    branches: [dev]
    paths:
      - "evaluation/datasets/**"
      - "evaluation/contracts/**"
      - "evaluation/evaluators/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-evaluation-datasets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Apply repository formatter
        continue-on-error: true
        run: ./gradlew --no-configuration-cache spotlessApply
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formatted-evaluation-datasets
          path: evaluation/datasets/**/*.kt
          if-no-files-found: error
          retention-days: 1
