name: Apply Detekt Fixes Once

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-detekt-fixes-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'agent/phase-1-consolidation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply focused Detekt fixes
        run: python3 scripts/apply-detekt-consolidation-fixes.py

      - name: Apply repository formatting
        run: ./gradlew --no-configuration-cache spotlessApply

      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            models/model-store/src/main/kotlin/io/github/daniele21/localllm/store/FileSystemModelStore.kt \
            backends/llama-cpp/src/main/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppBridge.kt \
            backends/llama-cpp/src/main/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppStreaming.kt \
            core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/MemoryPressure.kt \
            core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/RuntimeOrchestrator.kt \
            core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/SingleDecodeScheduler.kt
          git commit -m "Resolve Phase 1 static analysis findings"
          git push origin HEAD:${{ github.head_ref }}
