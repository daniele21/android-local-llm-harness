name: Agent CA2 clean generated

on:
  push:
    branches:
      - agent/consumer-api-ca2

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/consumer-api-ca2
          fetch-depth: 1
      - name: Remove generated artifacts and helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f models/model-install/build/intermediates/incremental/debug/packageDebugResources/compile-file-map.properties
          git rm -f models/model-install/build/kotlin/compileDebugKotlin/cacheable/last-build.bin
          git rm .github/workflows/agent-ca2-clean-generated.yml
          git commit -m "chore(consumer-api): remove generated Gradle artifacts"
          git push origin HEAD:agent/consumer-api-ca2
