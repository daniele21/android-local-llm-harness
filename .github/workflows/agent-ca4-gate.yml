name: Agent CA-4 focused gate

on:
  push:
    branches:
      - agent/ca4-binder-integration

permissions:
  contents: write

jobs:
  ca4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ca4-binder-integration
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Run focused gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew spotlessApply 2>&1 | tee ca4-gate.log
          ./gradlew --no-configuration-cache detekt 2>&1 | tee -a ca4-gate.log
          ./gradlew :transports:android-binder-contract:testDebugUnitTest :transports:android-binder-contract:compileDebugAidl :transports:android-binder-contract:compileDebugKotlin :integrations:android-service-host:testDebugUnitTest :transports:android-binder-client:testDebugUnitTest :apps:local-llm-phone-test:testDebugUnitTest :apps:shared-runtime-client-consumer-fixture:assembleDebug 2>&1 | tee -a ca4-gate.log
      - name: Publish gate state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.gate.outcome }}' = 'failure' ]; then
            git add ca4-gate.log
            git commit -m 'chore: capture CA-4 focused gate failure' || true
            git push
            exit 1
          fi
          rm -f ca4-gate.log .github/workflows/agent-ca4-gate.yml
          git add -A
          git commit -m 'chore: format and validate CA-4 Binder integration' || true
          git push
