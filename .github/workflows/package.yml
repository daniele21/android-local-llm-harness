name: Package Android Artifacts

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/**"
      - "backends/**"
      - "core/**"
      - "models/**"
      - "observability/**"
      - "transports/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".gitmodules"
      - ".engineering/commands.json"
      - "third_party/llama.cpp"
      - "scripts/build-console-release.sh"
      - "scripts/package_artifact_metadata.py"
      - "scripts/test_package_artifact_metadata.py"
      - "scripts/verify-android-packaging.py"
      - ".github/workflows/package.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/**"
      - "backends/**"
      - "core/**"
      - "models/**"
      - "observability/**"
      - "transports/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".gitmodules"
      - ".engineering/commands.json"
      - "third_party/llama.cpp"
      - "scripts/build-console-release.sh"
      - "scripts/package_artifact_metadata.py"
      - "scripts/test_package_artifact_metadata.py"
      - "scripts/verify-android-packaging.py"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or commit to package
        type: string
        default: dev
      profile:
        description: Generate a Gradle performance report
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: package-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build distributable Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}

      - name: Verify llama.cpp pin
        run: ./scripts/verify-llama-cpp-pin.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Determine Android native cache key
        id: android-native-cache-key
        shell: bash
        run: |
          echo "llama-sha=$(git -C third_party/llama.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Android native compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: android-ccache-${{ runner.os }}-${{ steps.android-native-cache-key.outputs.llama-sha }}-${{ hashFiles('backends/llama-cpp/src/main/cpp/**') }}
          restore-keys: |
            android-ccache-${{ runner.os }}-${{ steps.android-native-cache-key.outputs.llama-sha }}-
            android-ccache-${{ runner.os }}-

      - name: Configure Android native compiler cache
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/ccache"
          ccache --set-config=cache_dir="$HOME/.cache/ccache"
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Test package metadata tooling
        run: python3 scripts/test_package_artifact_metadata.py

      - name: Build and validate Android packages
        env:
          ENABLE_GRADLE_PROFILE: ${{ inputs.profile }}
          LOCAL_LLM_CONSOLE_ALLOW_UNSIGNED_RELEASE: "true"
          LOCAL_LLM_PHONE_TEST_ALLOW_UNSIGNED_RELEASE: "true"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          gradle_args=(--stacktrace)
          if [[ "$ENABLE_GRADLE_PROFILE" == "true" ]]; then
            gradle_args+=(--profile)
          fi

          ./gradlew "${gradle_args[@]}" \
            assembleDebug \
            :transports:android-binder-contract:assembleRelease \
            :transports:android-binder-client:assembleRelease \
            :apps:local-llm-console:assembleInternal \
            :apps:local-llm-console:bundleRelease \
            :apps:shared-runtime-client-consumer-fixture:assembleRelease \
            :apps:shared-runtime-client-consumer-fixture:assembleReleaseAndroidTest \
            :apps:device-test-runner:assembleDebugAndroidTest \
            :apps:local-llm-phone-test:lintRelease \
            :apps:local-llm-phone-test:bundleRelease \
            :observability:room-store:assembleDebugAndroidTest \
            2>&1 | tee build/android-packaging.log

      - name: Verify Android native packaging
        run: python3 scripts/verify-android-packaging.py

      - name: Resolve package build identity
        id: package-identity
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.candidate_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_ref="${DISPATCH_REF:-${HEAD_REF:-$REF_NAME}}"
          case "$EVENT_NAME" in
            push)
              channel="$REF_NAME"
              ;;
            pull_request)
              channel="pr-${BASE_REF}"
              ;;
            workflow_dispatch)
              channel="manual"
              ;;
            *)
              channel="$EVENT_NAME"
              ;;
          esac
          echo "build-id=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "source-revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source-ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Fetch previous successful comparable package metadata
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package_artifact_metadata.py fetch-previous \
            --repository "${GITHUB_REPOSITORY}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --channel "${{ steps.package-identity.outputs.channel }}" \
            --source-ref "${{ steps.package-identity.outputs.source-ref }}" \
            --output build/package-metadata/previous-build-manifest.json

      - name: Generate package manifest and build delta
        run: |
          python3 scripts/package_artifact_metadata.py manifest \
            --output build/package-metadata/build-manifest.json \
            --build-id "${{ steps.package-identity.outputs.build-id }}" \
            --source-revision "${{ steps.package-identity.outputs.source-revision }}" \
            --source-ref "${{ steps.package-identity.outputs.source-ref }}" \
            --channel "${{ steps.package-identity.outputs.channel }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
          previous_args=()
          if [[ -f build/package-metadata/previous-build-manifest.json ]]; then
            previous_args=(--previous build/package-metadata/previous-build-manifest.json)
          fi
          python3 scripts/package_artifact_metadata.py delta \
            --current build/package-metadata/build-manifest.json \
            "${previous_args[@]}" \
            --output build/package-metadata/BUILD_CHANGELOG.md

      - name: Report Android native compiler cache
        if: always()
        run: ccache --show-stats

      - name: Upload package identity metadata
        uses: actions/upload-artifact@v7
        with:
          name: package-build-metadata
          path: |
            build/package-metadata/build-manifest.json
            build/package-metadata/BUILD_CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload console APKs
        uses: actions/upload-artifact@v7
        with:
          name: local-llm-console-apks
          path: |
            apps/local-llm-console/build/outputs/apk/**/*.apk
            build/package-metadata/build-manifest.json
            build/package-metadata/BUILD_CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload console release bundle
        uses: actions/upload-artifact@v7
        with:
          name: local-llm-console-release-bundle
          path: |
            apps/local-llm-console/build/outputs/bundle/**/*.aab
            build/package-metadata/build-manifest.json
            build/package-metadata/BUILD_CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload shared-runtime consumer fixture
        uses: actions/upload-artifact@v7
        with:
          name: shared-runtime-consumer-fixture
          path: |
            apps/shared-runtime-client-consumer-fixture/build/outputs/apk/**/*.apk
            build/package-metadata/build-manifest.json
            build/package-metadata/BUILD_CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload device test APKs
        uses: actions/upload-artifact@v7
        with:
          name: local-llm-device-test-apks
          path: |
            apps/device-test-runner/build/outputs/apk/**/*.apk
            build/package-metadata/build-manifest.json
            build/package-metadata/BUILD_CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload phone test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: local-llm-phone-test-artifacts
          path: |
            apps/local-llm-phone-test/build/outputs/apk/**/*.apk
            apps/local-llm-phone-test/build/outputs/bundle/**/*.aab
            build/package-metadata/build-manifest.json
            build/package-metadata/BUILD_CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Android libraries
        uses: actions/upload-artifact@v7
        with:
          name: local-llm-harness-aars
          path: |
            **/build/outputs/aar/*.aar
            build/package-metadata/build-manifest.json
            build/package-metadata/BUILD_CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload Gradle profile
        if: always() && inputs.profile == true
        uses: actions/upload-artifact@v7
        with:
          name: gradle-packaging-profile
          path: build/reports/profile/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure reports
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: packaging-reports
          path: |
            **/build/reports/**
            build/android-packaging.log
          if-no-files-found: warn
          retention-days: 7
