name: Agent CA1 detekt final

on:
  push:
    branches:
      - agent/consumer-api-ca0-ca1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply CA-1 validation refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-ca1-detekt-finish.yml').read_text()
          body = workflow.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(body, {})

          p = Path('core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt')
          s = p.read_text()
          replacements = {
              'rejectedDecision(ConsumerCapabilityErrorCode.STALE_CAPABILITY, "Capability revision is stale; discover capabilities again before preparation")':
                  'rejectedDecision(\n                    ConsumerCapabilityErrorCode.STALE_CAPABILITY,\n                    "Capability revision is stale; discover capabilities again before preparation",\n                )',
              'rejectedDecision(ConsumerCapabilityErrorCode.MODEL_UNAVAILABLE, "The model bound to this use case is unavailable")':
                  'rejectedDecision(\n                    ConsumerCapabilityErrorCode.MODEL_UNAVAILABLE,\n                    "The model bound to this use case is unavailable",\n                )',
              'rejectedDecision(ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE, "The host cannot currently evaluate model readiness")':
                  'rejectedDecision(\n                    ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE,\n                    "The host cannot currently evaluate model readiness",\n                )',
              'rejectedDecision(ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE, "Consumer policy is incompatible with the resolved use-case profile")':
                  'rejectedDecision(\n                    ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE,\n                    "Consumer policy is incompatible with the resolved use-case profile",\n                )',
              'rejectedDecision(ConsumerCapabilityErrorCode.PRESET_NOT_ALLOWED, "Requested preset is not exposed for this use case")':
                  'rejectedDecision(\n                    ConsumerCapabilityErrorCode.PRESET_NOT_ALLOWED,\n                    "Requested preset is not exposed for this use case",\n                )',
              'rejectedDecision(ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE, "Requested preset is not present in the resolved use-case profile")':
                  'rejectedDecision(\n                    ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE,\n                    "Requested preset is not present in the resolved use-case profile",\n                )',
              'rejectedDecision(ConsumerCapabilityErrorCode.SESSION_KIND_NOT_ALLOWED, "Requested session kind is not allowed for this use case")':
                  'rejectedDecision(\n                    ConsumerCapabilityErrorCode.SESSION_KIND_NOT_ALLOWED,\n                    "Requested session kind is not allowed for this use case",\n                )',
              'rejectedDecision(ConsumerCapabilityErrorCode.OUTPUT_NOT_ALLOWED, "Requested output constraint is not allowed by the effective preset/use-case policy")':
                  'rejectedDecision(\n                    ConsumerCapabilityErrorCode.OUTPUT_NOT_ALLOWED,\n                    "Requested output constraint is not allowed by the effective preset/use-case policy",\n                )',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Format and validate CA-1
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply detekt :core:runtime-core:testDebugUnitTest
      - name: Commit and remove temporary workflows
        run: |
          git add core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt
          git rm .github/workflows/agent-ca1-detekt-refactor.yml \
            .github/workflows/agent-ca1-detekt-finish.yml \
            .github/workflows/agent-ca1-detekt-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor(consumer-api): isolate selection checks'
          git push origin HEAD:${{ github.ref_name }}
