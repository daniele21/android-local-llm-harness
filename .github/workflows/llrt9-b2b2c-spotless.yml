name: LLRT-9 B2B2c Spotless fix

on:
  push:
    branches:
      - agent/llrt9-evaluation-batch-llama-bridge-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/llrt9-evaluation-batch-llama-bridge-v1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply canonical Kotlin formatting
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-configuration-cache
          rm .github/workflows/llrt9-b2b2c-spotless.yml
      - name: Commit formatted exact tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "style(llrt9): apply canonical Kotlin formatting"
          git push origin HEAD:agent/llrt9-evaluation-batch-llama-bridge-v1
