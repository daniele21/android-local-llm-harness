name: Validate evaluation persistence

on:
  pull_request:
    paths:
      - "evaluation/comparison/**"
      - "evaluation/room-store/**"
      - "evaluation/contracts/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-evaluation-persistence.yml"
  push:
    branches: [dev]
    paths:
      - "evaluation/comparison/**"
      - "evaluation/room-store/**"
      - "evaluation/contracts/**"
      - "settings.gradle.kts"
      - ".github/workflows/validate-evaluation-persistence.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Repository quality gate
        run: ./gradlew --no-configuration-cache spotlessCheck detekt verifyNoModelArtifacts
      - name: Comparison compile and tests
        run: ./gradlew --no-configuration-cache :evaluation:comparison:compileDebugKotlin :evaluation:comparison:testDebugUnitTest
      - name: Comparison lint
        run: ./gradlew --no-configuration-cache :evaluation:comparison:lintDebug
      - name: Room schema compile and tests
        run: ./gradlew --no-configuration-cache :evaluation:room-store:compileDebugKotlin :evaluation:room-store:testDebugUnitTest
      - name: Room schema lint
        run: ./gradlew --no-configuration-cache :evaluation:room-store:lintDebug
