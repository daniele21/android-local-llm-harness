name: Q35 playground finalize once

on:
  push:
    paths:
      - ".github/workflows/q35-playground-finalize-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply Qwen3.5 playground integration and unit fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess, textwrap

          source = Path('.github/workflows/q35-playground-once.yml').read_text()
          marker = '      - name: Integrate Qwen3.5 presets into playground\n'
          start = source.index(marker) + len(marker)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          tail = source[run:]
          end = tail.find('\n      - name: ')
          subprocess.run(['bash', '-lc', textwrap.dedent(tail if end < 0 else tail[:end])], check=True)

          p = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessUiState.kt')
          text = p.read_text()
          coupled = '''        is HarnessUiEvent.ModelChanged -> state.copy(\n            importedModel = event.model,\n            modelInventory = HarnessModelInventoryReconciler.reconcile(\n                distribution = state.modelDistribution,\n                selectedModel = event.model,\n                loadedDigest = state.modelInventory.loadedDigest,\n            ),\n            removalConfirmationPending = false,\n            modelRecoveryConfirmation = null,\n        ).let { updated ->\n            if (event.model != null && updated.playgroundPreset.isNotBlank()) {\n                updated.applyPreset(updated.playgroundPreset)\n            } else {\n                updated\n            }\n        }'''
          neutral = '''        is HarnessUiEvent.ModelChanged -> state.copy(\n            importedModel = event.model,\n            modelInventory = HarnessModelInventoryReconciler.reconcile(\n                distribution = state.modelDistribution,\n                selectedModel = event.model,\n                loadedDigest = state.modelInventory.loadedDigest,\n            ),\n            removalConfirmationPending = false,\n            modelRecoveryConfirmation = null,\n        )'''
          if coupled not in text:
              raise SystemExit('ModelChanged Qwen3.5 coupling not found')
          p.write_text(text.replace(coupled, neutral, 1))

          p = Path('apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/HarnessViewModelTest.kt')
          text = p.read_text()
          replacements = {
              'assertEquals(1.05f, effects.startedOptions?.repeatPenalty)': 'assertEquals(1f, effects.startedOptions?.repeatPenalty)',
              'viewModel.updatePlaygroundPreset("short-form")': 'viewModel.updatePlaygroundPreset("qwen35-text-fast")',
              'assertEquals("short-form", viewModel.uiState.value.playgroundBasePreset)': 'assertEquals("qwen35-text-fast", viewModel.uiState.value.playgroundBasePreset)',
              'viewModel.updatePlaygroundPreset("balanced-conversation")': 'viewModel.updatePlaygroundPreset("qwen35-text-quality")',
              'assertEquals("balanced-conversation", viewModel.uiState.value.playgroundBasePreset)': 'assertEquals("qwen35-text-quality", viewModel.uiState.value.playgroundBasePreset)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'HarnessViewModelTest pattern missing: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/PhoneTestModelsTest.kt')
          text = p.read_text()
          old = '''        assertEquals(listOf("<|user|>", "<|system|>"), resolved.model.chatTemplatePolicy.stopSequences)\n        val precise = resolved.useCase.presets.first { it.ref.id.value == "precise-structured" }\n        assertEquals(2_048, precise.contextPreference.preferredTokens)\n        assertEquals(4_096, precise.contextPreference.recommendedMaximumTokens)\n        assertEquals(null, precise.contextPreference.maximumTokens)\n        val balanced = resolved.useCase.presets.first { it.ref.id.value == "balanced-conversation" }\n        assertEquals(PHONE_INFERENCE_PRESET_VERSION, balanced.ref.version)\n        assertEquals(1.05f, balanced.generation.repeatPenalty)\n        assertEquals(64, balanced.generation.repeatLastN)\n        assertEquals(4_096, balanced.contextPreference.preferredTokens)\n        assertEquals(8_192, balanced.contextPreference.recommendedMaximumTokens)'''
          new = '''        assertTrue(resolved.model.chatTemplatePolicy.stopSequences.isEmpty())\n        val precise = resolved.useCase.presets.first { it.ref.id.value == "qwen35-precise" }\n        assertEquals(4_096, precise.contextPreference.preferredTokens)\n        assertEquals(8_192, precise.contextPreference.recommendedMaximumTokens)\n        assertEquals(null, precise.contextPreference.maximumTokens)\n        val quality = resolved.useCase.presets.first { it.ref.id.value == "qwen35-text-quality" }\n        assertEquals(PHONE_INFERENCE_PRESET_VERSION, quality.ref.version)\n        assertEquals(1f, quality.generation.repeatPenalty)\n        assertEquals(64, quality.generation.repeatLastN)\n        assertEquals(4_096, quality.contextPreference.preferredTokens)\n        assertEquals(8_192, quality.contextPreference.recommendedMaximumTokens)'''
          if old not in text:
              raise SystemExit('PhoneTestModelsTest preset assertions not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate phone unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply :apps:local-llm-phone-test:testDebugUnitTest
      - name: Commit integration and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/q35-playground-once.yml \
            .github/workflows/q35-playground-diagnostic-once.yml \
            .github/workflows/q35-playground-unit-diagnostic-once.yml \
            .github/workflows/q35-playground-rescue-once.yml \
            .github/workflows/q35-playground-finalize-once.yml
          git add apps/local-llm-phone-test
          git commit -m "feat: expose qwen35 generation profiles in playground"
          git push origin HEAD:dev
