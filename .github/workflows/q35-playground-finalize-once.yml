name: Q35 playground finalize once

on:
  push:
    paths:
      - ".github/workflows/q35-playground-finalize-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply corrected playground integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          source = Path('.github/workflows/q35-playground-rescue-once.yml').read_text()
          marker = '      - name: Apply product integration and corrected assertions\n'
          start = source.index(marker) + len(marker)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          tail = source[run:]
          end = tail.find('\n      - name: ')
          subprocess.run(['bash','-lc',textwrap.dedent(tail if end < 0 else tail[:end])], check=True)
          PY
      - name: Validate phone integration
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache \
            :apps:local-llm-phone-test:testDebugUnitTest \
            :apps:local-llm-phone-test:compileDebugAndroidTestKotlin
      - name: Commit and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/q35-playground-once.yml \
            .github/workflows/q35-playground-diagnostic-once.yml \
            .github/workflows/q35-playground-unit-diagnostic-once.yml \
            .github/workflows/q35-playground-rescue-once.yml \
            .github/workflows/q35-playground-finalize-once.yml
          git add -u
          git add -f apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/Qwen35PlaygroundIntegrationTest.kt
          git commit -m "feat: expose qwen35 generation profiles in playground"
          git push origin HEAD:dev
