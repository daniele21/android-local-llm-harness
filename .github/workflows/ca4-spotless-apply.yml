name: CA4 Spotless Apply

on:
  push:
    branches: [agent/ca4-binder-integration]

permissions:
  contents: write

concurrency:
  group: ca4-spotless-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: agent/ca4-binder-integration

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Apply repository formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Spotless produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Spotless to CA-4"
          git push origin HEAD:agent/ca4-binder-integration
