name: HCP structural refactor v3

on:
  pull_request:
    branches:
      - dev
    types:
      - reopened

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hcp-n-consumer-control-plane-protocol
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run corrected v2 transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/hcp-structural-refactor-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == 'run: |') + 1
          body = []
          for line in workflow[start:]:
              body.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(body).replace(
              './gradlew --no-configuration-cache detektAll',
              './gradlew --no-configuration-cache detekt',
          )
          Path('/tmp/hcp-refactor.sh').write_text(script + '\n')
          PY
          bash /tmp/hcp-refactor.sh
