name: Publish Play Internal

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or commit to publish
        type: string
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: play-internal-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.candidate_ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish phone test to Play Internal Testing
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: play-internal
    env:
      PLAY_PACKAGE_NAME: io.github.daniele21.localllm.phonetest
      PLAY_TRACK: internal

    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.candidate_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate release helper syntax
        run: |
          python3 -m py_compile scripts/google-play-internal.py
          bash -n scripts/build-android-aab.sh
          bash -n scripts/build-phone-test-release.sh

      - name: Authenticate to Google Play for version resolution
        id: play-auth-version
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Resolve next Play versionCode
        id: play-version
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play-auth-version.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          version_code="$(python3 scripts/google-play-internal.py next-version-code --package "$PLAY_PACKAGE_NAME")"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Restore protected upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_B64"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/play-upload.p12"
          chmod 600 "$RUNNER_TEMP/play-upload.p12"

      - name: Build signed release AAB
        env:
          PLAY_VERSION_CODE: ${{ steps.play-version.outputs.version_code }}
          LOCAL_LLM_PHONE_TEST_ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/play-upload.p12
          LOCAL_LLM_PHONE_TEST_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          LOCAL_LLM_PHONE_TEST_ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS || 'local-llm-phone-test-upload' }}
          LOCAL_LLM_PHONE_TEST_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD || secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: bash scripts/build-android-aab.sh build

      - name: Verify signed AAB
        run: jarsigner -verify apps/local-llm-phone-test/build/outputs/bundle/release/local-llm-phone-test-release.aab

      - name: Refresh Google Play authentication
        id: play-auth-publish
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Publish to Internal Testing
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play-auth-publish.outputs.access_token }}
          PLAY_VERSION_CODE: ${{ steps.play-version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          python3 scripts/google-play-internal.py publish \
            --package "$PLAY_PACKAGE_NAME" \
            --aab apps/local-llm-phone-test/build/outputs/bundle/release/local-llm-phone-test-release.aab \
            --track "$PLAY_TRACK" \
            --release-name "dev-${short_sha}-vc${PLAY_VERSION_CODE}" \
            --expected-version-code "$PLAY_VERSION_CODE"

      - name: Upload released AAB as bounded CI evidence
        uses: actions/upload-artifact@v7
        with:
          name: play-internal-phone-test-v${{ steps.play-version.outputs.version_code }}
          path: apps/local-llm-phone-test/build/outputs/bundle/release/local-llm-phone-test-release.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
