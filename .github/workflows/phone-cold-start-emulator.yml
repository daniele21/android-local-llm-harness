name: Phone cold-start emulator evidence

on:
  pull_request:
    branches: [dev]
    paths:
      - "apps/local-llm-phone-test/**"
      - "backends/llama-cpp/**"
      - "models/control-plane-room-store/**"
      - "integrations/android-service-host/**"
      - "ui/design-system/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".engineering/e2e.json"
      - ".github/workflows/phone-cold-start-emulator.yml"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or commit to validate
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  group: phone-cold-start-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.candidate_ref || github.ref }}
  cancel-in-progress: true

jobs:
  phone-cold-start:
    name: Clean phone cold start on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha) }}

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phone-cold-start"
          git rev-parse HEAD | tee "$RUNNER_TEMP/phone-cold-start/source-revision.txt"

      - name: Verify llama.cpp pin
        run: ./scripts/verify-llama-cpp-pin.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Android AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd" "$RUNNER_TEMP/android-user"

      - name: Install Android build and emulator components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build production-shaped debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            --no-configuration-cache \
            --stacktrace \
            :apps:local-llm-phone-test:assembleDebug

      - name: Prepare no-native cold-start canary APK
        id: canary
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/phone-cold-start"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mapfile -t candidates < <(find apps/local-llm-phone-test/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          [[ "${#candidates[@]}" -eq 1 ]] || {
            printf 'Expected exactly one phone debug APK, found %s\n' "${#candidates[@]}" >&2
            printf '%s\n' "${candidates[@]}" >&2
            exit 1
          }

          original_apk="${candidates[0]}"
          canary_unaligned="$RUNNER_TEMP/harness-no-native-unaligned.apk"
          canary_apk="$evidence/harness-no-native.apk"
          canary_keystore="$RUNNER_TEMP/phone-cold-start-canary.p12"
          cp "$original_apk" "$canary_unaligned"

          mapfile -t native_entries < <(zipinfo -1 "$canary_unaligned" | grep '^lib/' || true)
          [[ "${#native_entries[@]}" -gt 0 ]] || {
            echo "Expected the production-shaped APK to contain native libraries before stripping." >&2
            exit 1
          }
          printf '%s\n' "${native_entries[@]}" > "$evidence/original-native-entries.txt"
          zip -dq "$canary_unaligned" "${native_entries[@]}"
          if zipinfo -1 "$canary_unaligned" | grep -q '^lib/'; then
            echo "No-native canary still contains native library entries before signing." >&2
            exit 1
          fi

          rm -f "$canary_keystore"
          keytool -genkeypair \
            -keystore "$canary_keystore" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias coldstart \
            -dname "CN=Harness Cold Start CI, OU=CI, O=Local LLM Harness, C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -noprompt

          "$build_tools/zipalign" -f -p 4 "$canary_unaligned" "$canary_apk"
          "$build_tools/apksigner" sign \
            --ks "$canary_keystore" \
            --ks-key-alias coldstart \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$canary_apk"
          rm -f "$canary_keystore" "$canary_unaligned"

          "$build_tools/apksigner" verify --verbose "$canary_apk" | tee "$evidence/apksigner-verify.txt"
          if zipinfo -1 "$canary_apk" | grep -q '^lib/'; then
            echo "Signed no-native canary unexpectedly contains native library entries." >&2
            exit 1
          fi

          package_name=$("$build_tools/aapt" dump badging "$canary_apk" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)
          activity_name=$("$build_tools/aapt" dump badging "$canary_apk" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p" | head -n 1)
          [[ -n "$package_name" && -n "$activity_name" ]] || {
            echo "Unable to resolve package or launchable activity from canary APK." >&2
            exit 1
          }

          sha256sum "$original_apk" > "$evidence/original-apk.sha256"
          sha256sum "$canary_apk" > "$evidence/canary-apk.sha256"
          printf '%s\n' "$package_name" | tee "$evidence/package-name.txt"
          printf '%s\n' "$activity_name" | tee "$evidence/activity-name.txt"
          printf 'package=%s\n' "$package_name" >> "$GITHUB_OUTPUT"
          printf 'activity=%s\n' "$activity_name" >> "$GITHUB_OUTPUT"
          printf 'apk=%s\n' "$canary_apk" >> "$GITHUB_OUTPUT"

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Create and start emulator
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/phone-cold-start"
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          test -x "$emulator_bin"

          echo "no" | avdmanager create avd \
            --force \
            --name phone-cold-start-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

          nohup "$emulator_bin" \
            -avd phone-cold-start-api35 \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            > "$evidence/emulator.log" 2>&1 &

          timeout 180 adb -s emulator-5554 wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb -s emulator-5554 shell settings put global window_animation_scale 0
              adb -s emulator-5554 shell settings put global transition_animation_scale 0
              adb -s emulator-5554 shell settings put global animator_duration_scale 0
              adb -s emulator-5554 shell wm dismiss-keyguard || true
              exit 0
            fi
            sleep 2
          done

          adb devices -l >&2 || true
          cat "$evidence/emulator.log" >&2 || true
          echo "Error: phone cold-start emulator did not finish booting." >&2
          exit 1

      - name: Install canary and prove clean cold start with UI media evidence
        env:
          ANDROID_SERIAL: emulator-5554
          CANARY_APK: ${{ steps.canary.outputs.apk }}
          PACKAGE_NAME: ${{ steps.canary.outputs.package }}
          ACTIVITY_NAME: ${{ steps.canary.outputs.activity }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/phone-cold-start"
          media="$evidence/ui-media/phone-cold-start"
          screenshots="$media/screenshots"
          video_dir="$media/video"
          remote_video="/sdcard/phone-cold-start.mp4"
          component="$PACKAGE_NAME/$ACTIVITY_NAME"
          mkdir -p "$screenshots" "$video_dir"
          media_started=0
          media_finalized=0

          finalize_media() {
            if [[ "$media_finalized" == "1" ]]; then return; fi
            media_finalized=1
            set +e
            if [[ "$media_started" == "1" ]]; then
              adb exec-out screencap -p > "$screenshots/final-shell.png" || rm -f "$screenshots/final-shell.png"
              record_pid="$(adb shell pidof screenrecord 2>/dev/null | tr -d '\r')"
              if [[ -n "$record_pid" ]]; then adb shell kill -2 "$record_pid" || true; fi
              sleep 2
              adb pull "$remote_video" "$video_dir/journey.mp4" >/dev/null 2>&1 || true
              adb shell rm -f "$remote_video" || true
            fi
            cat > "$media/manifest.txt" <<EOF
          journey_id=phone-cold-start
          source_revision=$(git rev-parse HEAD)
          workflow_run=${GITHUB_RUN_ID:-local}
          execution_environment=phone-cold-start-api35-emulator
          fidelity_class=simulated_or_emulated
          screenshot=screenshots/final-shell.png
          video=video/journey.mp4
          EOF
          }
          trap finalize_media EXIT

          adb install --no-streaming -r -t "$CANARY_APK" | tee "$evidence/install.txt"
          adb shell pm clear "$PACKAGE_NAME" | tee "$evidence/pm-clear.txt"
          adb shell am force-stop "$PACKAGE_NAME"
          adb logcat -c
          adb shell rm -f "$remote_video"
          adb shell "screenrecord --bit-rate 4000000 --time-limit 20 $remote_video >/dev/null 2>&1 &"
          for attempt in $(seq 1 20); do
            [[ -n "$(adb shell pidof screenrecord 2>/dev/null | tr -d '\r')" ]] && break
            sleep 0.25
          done
          [[ -n "$(adb shell pidof screenrecord 2>/dev/null | tr -d '\r')" ]] || { echo "screenrecord did not start" >&2; exit 1; }
          media_started=1

          adb shell am start -W -n "$component" | tee "$evidence/am-start.txt"
          sleep 3
          adb logcat -d -v threadtime > "$evidence/logcat.txt"

          pid=$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')
          [[ -n "$pid" ]] || { echo "Harness process is not alive after cold start." >&2; exit 1; }
          printf '%s\n' "$pid" | tee "$evidence/pid.txt"

          adb shell dumpsys activity activities > "$evidence/activity-state.txt"
          grep -F "$PACKAGE_NAME" "$evidence/activity-state.txt" >/dev/null || { echo "Harness package is absent from activity state after launch." >&2; exit 1; }

          adb shell uiautomator dump /sdcard/harness-cold-start.xml >/dev/null
          adb pull /sdcard/harness-cold-start.xml "$evidence/window.xml" >/dev/null
          if ! grep -F 'text="Harness"' "$evidence/window.xml" >/dev/null && ! grep -F 'text="Local AI Console"' "$evidence/window.xml" >/dev/null; then
            echo "Harness startup shell was not rendered in the accessibility tree." >&2
            exit 1
          fi

          if grep -A 12 -F "FATAL EXCEPTION" "$evidence/logcat.txt" | grep -F "Process: $PACKAGE_NAME" >/dev/null; then
            echo "Fatal exception detected for Harness during cold start." >&2
            exit 1
          fi

          finalize_media
          trap - EXIT
          [[ -s "$screenshots/final-shell.png" ]] || { echo "E2E_EVIDENCE_INCOMPLETE: missing phone-cold-start screenshot" >&2; exit 1; }
          [[ -s "$video_dir/journey.mp4" ]] || { echo "E2E_EVIDENCE_INCOMPLETE: missing phone-cold-start video" >&2; exit 1; }

      - name: Clean emulator resources
        if: always()
        shell: bash
        run: |
          adb -s emulator-5554 uninstall io.github.daniele21.localllm.phonetest.debug || true
          adb -s emulator-5554 emu kill || true
          rm -f "$RUNNER_TEMP/phone-cold-start-canary.p12" "$RUNNER_TEMP/harness-no-native-unaligned.apk"

      - name: Upload cold-start evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-cold-start-emulator-evidence
          path: ${{ runner.temp }}/phone-cold-start/**
          if-no-files-found: error
          retention-days: 14
