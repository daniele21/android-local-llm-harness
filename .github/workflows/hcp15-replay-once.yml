name: HCP15 replay once

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hcp-h-session-history-current-dev
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Replay HCP-15 on current dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dev agent/hcp-h-session-history-current-dev
          git reset --hard origin/agent/hcp-h-session-history-current-dev
          commits=(
            985f308f4a818cca5ac41f69a6a7597a202b5c21
            f220698d2a1fb80718a346b00b51ac292a8d9aae
            73ec59b6b98d25ffecdf639c40c25df595edbd09
            8d109b04f6bc05c8b989e08ed689f16c64f8c06a
            e7049cee985788f3b303c71d00cd985f4c3f4a1a
            d88ed22ad9b6faa7555f1aa8f73275fa789bd4e2
            9d3c80d4d6925bf6a2898107b85c200c2b9e6746
            cf9e85f90b4b9b93ea0c7238353d57424fb31664
            2271cb1c64d6164ee99bf2ef7b5ebe962b082806
            2a55a82723bd3bf78ccb09ccbb2dac00a4eafe71
          )
          for commit in "${commits[@]}"; do
            if git merge-base --is-ancestor "$commit" HEAD; then
              continue
            fi
            git cherry-pick "$commit"
          done
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          if ! git diff --quiet; then
            git add -A
            git commit -m 'style(hcp): format HCP-15 replay'
          fi
          git push origin HEAD:agent/hcp-h-session-history-current-dev
