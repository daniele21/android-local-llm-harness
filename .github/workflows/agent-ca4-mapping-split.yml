name: Agent CA-4 mapping split
on:
  push:
    branches: [agent/ca4-binder-integration]
permissions:
  contents: write
jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ca4-binder-integration
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('transports/android-binder-contract/src/main/kotlin/io/github/daniele21/localllm/transport/binder/contract/ConsumerCoreWireMapping.kt')
          s=p.read_text()
          start=s.index('fun ConsumerCapabilityResult.toConsumerWire')
          end=s.index('private fun InferencePresetRef.toConsumerWire')
          imports='''package io.github.daniele21.localllm.transport.binder.contract\n\nimport io.github.daniele21.localllm.contracts.ConsumerCapabilityErrorCode\nimport io.github.daniele21.localllm.contracts.ConsumerCapabilityResult\nimport io.github.daniele21.localllm.contracts.ConsumerErrorCode\nimport io.github.daniele21.localllm.contracts.ConsumerFailure\nimport io.github.daniele21.localllm.contracts.ConsumerPrepareResult\nimport io.github.daniele21.localllm.contracts.ConsumerSessionResult\nimport io.github.daniele21.localllm.contracts.SessionId\n\n'''
          p.write_text(imports+s[start:end])
          Path('transports/android-binder-contract/src/main/kotlin/io/github/daniele21/localllm/transport/binder/contract/ConsumerResultMapping.kt').unlink(missing_ok=True)
          PY
          rm -f .github/workflows/agent-ca4-mapping-split.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: split CA-4 wire mappings' || true
          git push
