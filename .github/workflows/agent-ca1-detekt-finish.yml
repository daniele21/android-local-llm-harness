name: Agent CA1 detekt finish

on:
  push:
    branches:
      - agent/consumer-api-ca0-ca1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply and split CA-1 validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-ca1-detekt-refactor.yml').read_text()
          body = workflow.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(body, {})

          p = Path('core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt')
          s = p.read_text()
          s = s.replace('val capabilityError = capabilityError(', 'val capabilityError = SelectionChecks.capabilityError(')
          s = s.replace('val presetError = presetError(', 'val presetError = SelectionChecks.presetError(')
          s = s.replace(
              'val constraintError = constraintError(context, preset, outputConstraint, sessionKind)',
              'val constraintError = SelectionChecks.constraintError(\n            context,\n            outputConstraint,\n            sessionKind,\n            effectiveOutputConstraints(context.resolved, preset),\n        )',
          )
          old = 'return resolveAcceptedDecision(context, request, preset, outputConstraint, sessionKind)'
          new = (
              'val reasoning = resolveReasoningMode(\n'
              '            capability = context.policy.reasoning,\n'
              '            preference = request.reasoning,\n'
              '            preset = preset,\n'
              '            resolved = context.resolved,\n'
              '        )\n'
              '        return SelectionChecks.acceptedDecision(context, preset, outputConstraint, sessionKind, reasoning)'
          )
          s = s.replace(old, new)

          for start_marker, end_marker in [
              ('    private fun capabilityError(', '    private fun presetError('),
              ('    private fun presetError(', '    private fun constraintError('),
              ('    private fun constraintError(', '    private fun resolveAcceptedDecision('),
              ('    private fun resolveAcceptedDecision(', '    private fun resolveContext'),
          ]:
              start = s.index(start_marker)
              end = s.index(end_marker, start)
              s = s[:start] + s[end:]

          marker = '    private sealed interface ContextResult {'
          checks = (
              '    private object SelectionChecks {\n'
              '        fun capabilityError(\n'
              '            capabilities: UseCaseCapabilities,\n'
              '            request: ConsumerSelectionRequest,\n'
              '        ): ConsumerPolicyDecision.Rejected? = when {\n'
              '            request.capabilityRevision != null && request.capabilityRevision != capabilities.capabilityRevision ->\n'
              '                rejectedDecision(ConsumerCapabilityErrorCode.STALE_CAPABILITY, "Capability revision is stale; discover capabilities again before preparation")\n'
              '            capabilities.readiness == UseCaseReadiness.UNAVAILABLE_MODEL ->\n'
              '                rejectedDecision(ConsumerCapabilityErrorCode.MODEL_UNAVAILABLE, "The model bound to this use case is unavailable")\n'
              '            capabilities.readiness == UseCaseReadiness.UNAVAILABLE_HOST_POLICY ->\n'
              '                rejectedDecision(ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE, "The host cannot currently evaluate model readiness")\n'
              '            capabilities.readiness == UseCaseReadiness.INCOMPATIBLE ->\n'
              '                rejectedDecision(ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE, "Consumer policy is incompatible with the resolved use-case profile")\n'
              '            else -> null\n'
              '        }\n\n'
              '        fun presetError(\n'
              '            context: ContextResult.Resolved,\n'
              '            presetRef: InferencePresetRef?,\n'
              '            preset: InferencePreset?,\n'
              '        ): ConsumerPolicyDecision.Rejected? = when {\n'
              '            presetRef == null -> null\n'
              '            presetRef !in context.policy.exposedPresets ->\n'
              '                rejectedDecision(ConsumerCapabilityErrorCode.PRESET_NOT_ALLOWED, "Requested preset is not exposed for this use case")\n'
              '            preset == null ->\n'
              '                rejectedDecision(ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE, "Requested preset is not present in the resolved use-case profile")\n'
              '            else -> null\n'
              '        }\n\n'
              '        fun constraintError(\n'
              '            context: ContextResult.Resolved,\n'
              '            outputConstraint: ConsumerOutputConstraintKind,\n'
              '            sessionKind: SessionKind,\n'
              '            effectiveOutputConstraints: Set<ConsumerOutputConstraintKind>,\n'
              '        ): ConsumerPolicyDecision.Rejected? = when {\n'
              '            sessionKind !in context.policy.sessionKinds ->\n'
              '                rejectedDecision(ConsumerCapabilityErrorCode.SESSION_KIND_NOT_ALLOWED, "Requested session kind is not allowed for this use case")\n'
              '            outputConstraint !in context.policy.outputConstraints || outputConstraint !in effectiveOutputConstraints ->\n'
              '                rejectedDecision(ConsumerCapabilityErrorCode.OUTPUT_NOT_ALLOWED, "Requested output constraint is not allowed by the effective preset/use-case policy")\n'
              '            else -> null\n'
              '        }\n\n'
              '        fun acceptedDecision(\n'
              '            context: ContextResult.Resolved,\n'
              '            preset: InferencePreset?,\n'
              '            outputConstraint: ConsumerOutputConstraintKind,\n'
              '            sessionKind: SessionKind,\n'
              '            reasoning: ReasoningResolution,\n'
              '        ): ConsumerPolicyDecision = when (reasoning) {\n'
              '            is ReasoningResolution.Accepted -> ConsumerPolicyDecision.Accepted(\n'
              '                resolvedUseCase = context.resolved,\n'
              '                preset = preset,\n'
              '                reasoningMode = reasoning.mode,\n'
              '                outputConstraint = outputConstraint,\n'
              '                sessionKind = sessionKind,\n'
              '                capabilityRevision = context.capabilities.capabilityRevision,\n'
              '            )\n'
              '            is ReasoningResolution.Rejected -> rejectedDecision(reasoning.code, reasoning.detail)\n'
              '        }\n\n'
              '        private fun rejectedDecision(\n'
              '            code: ConsumerCapabilityErrorCode,\n'
              '            detail: String,\n'
              '        ) = ConsumerPolicyDecision.Rejected(code, detail)\n'
              '    }\n\n'
          )
          s = s.replace(marker, checks + marker)
          p.write_text(s)
          PY
      - name: Format and validate CA-1
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply detekt :core:runtime-core:testDebugUnitTest
      - name: Commit and remove temporary workflows
        run: |
          git add core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt
          git rm .github/workflows/agent-ca1-detekt-refactor.yml .github/workflows/agent-ca1-detekt-finish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor(consumer-api): isolate selection checks'
          git push origin HEAD:${{ github.ref_name }}
