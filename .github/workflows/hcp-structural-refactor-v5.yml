name: HCP structural refactor v5

on:
  pull_request:
    branches:
      - dev
    types:
      - reopened

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hcp-n-consumer-control-plane-protocol
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final split and validate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/hcp-n-consumer-control-plane-protocol
          git reset --hard origin/agent/hcp-n-consumer-control-plane-protocol
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/hcp-structural-refactor-v4.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |') + 1
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:]]
          script = '\n'.join(body)
          cut = script.find('chmod +x gradlew')
          if cut < 0:
              raise SystemExit('v4 transformation boundary not found')
          Path('/tmp/hcp-transform-v4.sh').write_text(script[:cut] + '\n')
          PY
          bash /tmp/hcp-transform-v4.sh

          python3 - <<'PY'
          from pathlib import Path

          host = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessConsumerControlPlaneHost.kt')
          text = host.read_text()
          start = text.find('private data class ActivationResolutionCheck(')
          end = text.find('\nprivate fun AssignedUseCaseDiscoveryFailure', start)
          if start < 0 or end < 0:
              raise SystemExit('activation support region not found')
          support_body = text[start:end].strip() + '\n'
          text = text[:start] + text[end:]
          text = text.replace('private fun importedPhoneModel(', 'internal fun importedPhoneModel(', 1)
          text = text.replace(
              'private fun HostExecutionFailureCode.toConsumerFailure()',
              'internal fun HostExecutionFailureCode.toConsumerFailure()',
              1,
          )
          text = text.replace(
              'private fun failure(code: ConsumerControlPlaneErrorCode, message: String)',
              'internal fun failure(code: ConsumerControlPlaneErrorCode, message: String)',
              1,
          )
          host.write_text(text)

          support = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessConsumerActivationSupport.kt')
          support.write_text('''package io.github.daniele21.localllm.phonetest

import io.github.daniele21.localllm.contracts.ApplicationId
import io.github.daniele21.localllm.contracts.ConsumerActivationRequest
import io.github.daniele21.localllm.contracts.ConsumerActivationResult
import io.github.daniele21.localllm.contracts.ConsumerControlPlaneErrorCode
import io.github.daniele21.localllm.models.HostExecutionResolution
import io.github.daniele21.localllm.models.ResolvedHostExecution
import io.github.daniele21.localllm.models.ResolvedUseCase
import io.github.daniele21.localllm.store.ModelStore

''' + support_body)
          PY

          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          ./gradlew --no-configuration-cache detekt
          ./gradlew --no-configuration-cache test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(hcp): split consumer activation support'
          git push origin HEAD:agent/hcp-n-consumer-control-plane-protocol
