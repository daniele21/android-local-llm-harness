name: LLUP exact-source package evidence dispatch

on:
  push:
    branches:
      - ci/llup-package-evidence
    paths:
      - .github/workflows/llup-package-evidence-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch paired LLUP-50 evidence packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch LLUP-50 control evidence package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 1e3061f10e091d63d7772e2d23903d46cc239b36
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"dev\",\"inputs\":{\"candidate_ref\":\"%s\",\"profile\":\"false\"}}' "$TARGET_SHA")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/package.yml/dispatches" \
            --data "$payload"

      - name: Dispatch LLUP-50 candidate evidence package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: b1f661edc303089dd0ee5d3565bca43450838ab3
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"dev\",\"inputs\":{\"candidate_ref\":\"%s\",\"profile\":\"false\"}}' "$TARGET_SHA")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/package.yml/dispatches" \
            --data "$payload"
