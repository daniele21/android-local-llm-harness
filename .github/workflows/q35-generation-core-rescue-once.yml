name: Q35 generation core rescue once

on:
  push:
    paths:
      - ".github/workflows/q35-generation-core-rescue-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply corrected core slice
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = Path('.github/workflows/q35-generation-core-once.yml').read_text()

          def step_script(name):
              marker = f'      - name: {name}\n'
              start = source.index(marker) + len(marker)
              run = source.index('        run: |\n', start) + len('        run: |\n')
              tail = source[run:]
              end = tail.find('\n      - name: ')
              block = tail if end < 0 else tail[:end]
              return textwrap.dedent(block)

          apply_script = step_script('Apply Qwen3.5 generation semantics')
          system_old = "                thinkingMode = resolved.thinkingMode,\\n                minP = resolved.minP,\\n                presencePenalty = resolved.presencePenalty,\\n            )''')"
          system_new = "                thinkingMode = resolved.thinkingMode,\\n            )''')"
          if system_old not in apply_script:
              raise SystemExit('effective metadata patch block not found')
          apply_script = apply_script.replace(system_old, system_new, 1)

          resolved_old = "                topK = resolved.topK,\\n                minP = resolved.minP,\\n                presencePenalty = resolved.presencePenalty,\\n                repeatPenalty = resolved.repeatPenalty,''')"
          resolved_new = "                topK = resolved.topK,\\n                minP = resolved.minP,\\n                presencePenalty = resolved.presencePenalty,\\n                repeatPenalty = resolved.repeatPenalty,''', count=2)"
          if resolved_old not in apply_script:
              raise SystemExit('resolved topK patch block not found')
          apply_script = apply_script.replace(resolved_old, resolved_new, 1)
          subprocess.run(['bash', '-lc', apply_script], check=True)

          p = Path('backends/llama-cpp/src/test/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppStreamingTest.kt')
          text = p.read_text()
          text = text.replace(
              'listOf(11L, "request-1", "Prompt", 16, 0.1f, 0.95f, 40, 1.05f, 64, 77L, "TEXT")',
              'listOf(11L, "request-1", "Prompt", 16, 0.1f, 0.95f, 40, 0f, 0f, 1.05f, 64, 77L, "TEXT")',
              1,
          )
          text = text.replace(
              '        topK: Int,\n        repeatPenalty: Float,',
              '        topK: Int,\n        minP: Float,\n        presencePenalty: Float,\n        repeatPenalty: Float,',
              1,
          )
          text = text.replace(
              '            topK,\n            repeatPenalty,',
              '            topK,\n            minP,\n            presencePenalty,\n            repeatPenalty,',
              1,
          )
          p.write_text(text)

          subprocess.run(['bash', '-lc', step_script('Add Q35 generation tests')], check=True)
          PY
      - name: Format and validate corrected core generation slice
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply \
            :core:contracts:testDebugUnitTest \
            :models:model-profile:testDebugUnitTest \
            :core:runtime-core:testDebugUnitTest \
            :backends:llama-cpp:testDebugUnitTest \
            :observability:room-store:testDebugUnitTest \
            :backends:llama-cpp:assembleDebug
      - name: Commit corrected core and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/q35-generation-core-once.yml .github/workflows/q35-generation-core-rescue-once.yml
          git add -u
          git add -f \
            models/model-profile/src/main/kotlin/io/github/daniele21/localllm/models/Qwen35GenerationProfiles.kt \
            models/model-profile/src/test/kotlin/io/github/daniele21/localllm/models/Qwen35GenerationProfilesTest.kt \
            core/runtime-core/src/test/kotlin/io/github/daniele21/localllm/runtime/Qwen35GenerationConfigurationTest.kt
          git commit -m "feat: add qwen35 thinking and sampling core"
          git push origin HEAD:dev
