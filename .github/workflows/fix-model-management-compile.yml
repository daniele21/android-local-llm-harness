name: Fix model management compile

on:
  push:
    branches:
      - agent/recover-model-management

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Repair temporary model management compile fixer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/recover-model-management
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Apply compile fixes and validate
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply :apps:local-llm-phone-test:compileDebugKotlin :apps:local-llm-phone-test:testDebugUnitTest
          rm .github/workflows/fix-model-management-compile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix model management integration compile errors"
          git push origin HEAD:agent/recover-model-management
