name: Fix model management compile

on:
  push:
    branches:
      - agent/recover-model-management

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add temporary model management compile fixer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/recover-model-management
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Apply compile fixes and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest')

          ui = root / 'PhoneModelDistributionUi.kt'
          text = ui.read_text()
          old = '''                onInstall = onInstall,
                onSelectInstalled = onSelectInstalled,
'''
          new = '''                onInstall = onInstall,
                onVerifyInstalled = onVerifyInstalled,
                onRequestRemove = onRequestRemove,
                onCancelRemove = onCancelRemove,
                onConfirmRemove = onConfirmRemove,
                onSelectInstalled = onSelectInstalled,
'''
          if old not in text:
              raise SystemExit('PhoneModelDistributionUi callback anchor not found')
          ui.write_text(text.replace(old, new, 1))

          main = root / 'MainActivity.kt'
          text = main.read_text()
          old = '''                    onInstall = modelDistributionController::install,
                    onSelectInstalled = ::selectInstalledCatalogModel,
'''
          new = '''                    onInstall = modelDistributionController::install,
                    onVerifyInstalled = modelDistributionController::verifyInstalled,
                    onRequestRemove = modelDistributionController::requestRemove,
                    onCancelRemove = modelDistributionController::cancelRemove,
                    onConfirmRemove = modelDistributionController::confirmRemove,
                    onSelectInstalled = ::selectInstalledCatalogModel,
'''
          if old not in text:
              raise SystemExit('MainActivity catalog callback anchor not found')
          main.write_text(text.replace(old, new, 1))

          controller = root / 'PhoneModelDistributionController.kt'
          text = controller.read_text()
          text = text.replace(
              'protectedModelDigest = protectedModelDigest,',
              'protectedModelDigest = runtimeGraph::loadedModelDigest,',
              1,
          )
          old = '''                    modelExists = { digest -> runtimeGraph.modelStore.find(digest)?.verified == true },
                    clock = System::currentTimeMillis,
'''
          new = '''                    modelExists = { digest -> runtimeGraph.modelStore.find(digest)?.verified == true },
                    management = management,
                    clock = System::currentTimeMillis,
'''
          if old not in text:
              raise SystemExit('Controller services anchor not found')
          controller.write_text(text.replace(old, new, 1))
          PY
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply :apps:local-llm-phone-test:compileDebugKotlin :apps:local-llm-phone-test:testDebugUnitTest
          rm .github/workflows/fix-model-management-compile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix model management integration compile errors"
          git push origin HEAD:agent/recover-model-management
