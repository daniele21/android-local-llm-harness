name: Apply phone model distribution wiring

on:
  push:
    branches: [agent/connected-model-distribution-ui]
    paths:
      - ".github/workflows/apply-phone-model-distribution-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phone-model-distribution-ui
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/connected-model-distribution-ui
          fetch-depth: 1
      - name: Apply deterministic migration
        run: python3 scripts/apply-phone-model-distribution-ui.py
      - name: Commit generated wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/MainActivity.kt \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneTestController.kt
          git commit -m "Connect catalog download and installation UI"
          git push origin HEAD:agent/connected-model-distribution-ui
