name: Temporary Hello Harnex formatter

on:
  push:
    branches:
      - feat/hello-harnex-onboarding

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Format sample
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - uses: actions/upload-artifact@v7
        with:
          name: hello-harnex-formatted
          path: |
            samples/hello-harnex/app/src/main/java/io/github/daniele21/harnex/hello/HelloHarnexClient.kt
            samples/hello-harnex/app/src/main/java/io/github/daniele21/harnex/hello/MainActivity.kt
          retention-days: 1
