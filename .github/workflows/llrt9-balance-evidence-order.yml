name: LLRT-9 balance evidence order

on:
  push:
    branches:
      - agent/llrt9-native-batch-evidence-v1

permissions:
  contents: write

jobs:
  balance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/llrt9-native-batch-evidence-v1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Alternate serial/native measurement order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          test = Path('apps/device-test-runner/src/androidTest/kotlin/io/github/daniele21/localllm/devicetest/Llrt9EvaluationBatchInstrumentedTest.kt')
          text = test.read_text()
          old = '''            val before = deviceSnapshot()
            val serial = runSerial(runtime, harness)
            val afterSerial = deviceSnapshot()
            val batch = runNativeBatch(runtime, harness)
            val afterBatch = deviceSnapshot()

            assertEquals("Native batch attribution drifted", serial.prompts, batch.prompts)'''
          new = '''            val before = deviceSnapshot()
            val serialFirst = config.sampleIndex % 2 == 0
            val first = if (serialFirst) runSerial(runtime, harness) else runNativeBatch(runtime, harness)
            val afterFirst = deviceSnapshot()
            val second = if (serialFirst) runNativeBatch(runtime, harness) else runSerial(runtime, harness)
            val afterSecond = deviceSnapshot()
            val serial = if (serialFirst) first else second
            val batch = if (serialFirst) second else first
            val afterSerial = if (serialFirst) afterFirst else afterSecond
            val afterBatch = if (serialFirst) afterSecond else afterFirst
            val measurementOrder = if (serialFirst) "SERIAL_FIRST" else "BATCH_FIRST"

            assertEquals("Native batch attribution drifted", serial.prompts, batch.prompts)'''
          if old not in text:
              raise SystemExit('LLRT-9 measurement-order anchor not found')
          text = text.replace(old, new, 1)
          old = '''            emitEvidence(serial, batch, serialDigests, before, afterSerial, afterBatch)'''
          new = '''            emitEvidence(serial, batch, serialDigests, before, afterSerial, afterBatch, measurementOrder)'''
          if old not in text:
              raise SystemExit('LLRT-9 emitEvidence call anchor not found')
          text = text.replace(old, new, 1)
          old = '''        afterBatch: DeviceSnapshot,
    ) {'''
          new = '''        afterBatch: DeviceSnapshot,
        measurementOrder: String,
    ) {'''
          if old not in text:
              raise SystemExit('LLRT-9 emitEvidence signature anchor not found')
          text = text.replace(old, new, 1)
          old = '''            .put("batchWidth", config.width)
            .put("batchSize", config.batchSize)'''
          new = '''            .put("batchWidth", config.width)
            .put("measurementOrder", measurementOrder)
            .put("batchSize", config.batchSize)'''
          if old not in text:
              raise SystemExit('LLRT-9 schema field anchor not found')
          text = text.replace(old, new, 1)
          test.write_text(text)

          plan = Path('docs/llama-cpp-runtime-optimization-plan.md')
          text = plan.read_text()
          old = '| LLRT-9C | READY | Schema-v7 tooling compares the normal serial runtime path with evaluation-only native batching at widths 2..4 using fixed-seed digest equality, elapsed time, observed PSS/memory and thermal snapshots; curated 0.8B/2B physical evidence remains required. |'
          new = '| LLRT-9C | READY | Schema-v7 tooling compares the normal serial runtime path with evaluation-only native batching at widths 2..4 using fixed-seed digest equality, alternating execution order, elapsed time, observed PSS/memory and thermal snapshots; curated 0.8B/2B physical evidence remains required. |'
          if old not in text:
              raise SystemExit('LLRT-9C ledger anchor not found')
          text = text.replace(old, new, 1)
          old = 'LLRT-9C uses schema **v7** for fixed-seed serial-versus-native-batch comparison: width, per-sequence/aggregate context, exact ordered prompt/output digests, elapsed time, output-token counts, observed process PSS/available-memory snapshots and thermal status.'
          new = 'LLRT-9C uses schema **v7** for fixed-seed serial-versus-native-batch comparison: width, alternating measurement order, per-sequence/aggregate context, exact ordered prompt/output digests, elapsed time, output-token counts, observed process PSS/available-memory snapshots and thermal status.'
          if old not in text:
              raise SystemExit('LLRT-9C schema narrative anchor not found')
          plan.write_text(text.replace(old, new, 1))
          PY
      - name: Format and validate
        run: |
          chmod +x gradlew scripts/run-llama-cpp-evaluation-batch-evidence.sh
          bash -n scripts/run-llama-cpp-evaluation-batch-evidence.sh
          ./gradlew --no-configuration-cache spotlessApply
      - name: Commit balanced evidence lane and remove workflow
        run: |
          rm .github/workflows/llrt9-balance-evidence-order.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/device-test-runner/src/androidTest/kotlin/io/github/daniele21/localllm/devicetest/Llrt9EvaluationBatchInstrumentedTest.kt
          git add docs/llama-cpp-runtime-optimization-plan.md
          git add .github/workflows/llrt9-balance-evidence-order.yml
          git diff --cached --check
          git commit -m "test(llrt9): balance serial and native batch evidence order"
          git push origin HEAD:agent/llrt9-native-batch-evidence-v1
