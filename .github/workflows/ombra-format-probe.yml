name: OMBRA Format Probe

on:
  push:
    branches:
      - agent/ca5-ombra-4b-v2

permissions:
  contents: read

concurrency:
  group: ombra-format-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Apply repository Kotlin formatter
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply

      - name: Capture formatter patch
        run: git diff --binary -- '*.kt' > spotless.patch

      - name: Upload formatter patch
        uses: actions/upload-artifact@v7
        with:
          name: ombra-spotless-patch
          path: spotless.patch
          if-no-files-found: error
          retention-days: 1
