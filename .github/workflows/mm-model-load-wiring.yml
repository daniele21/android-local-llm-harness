name: Apply model-load admission wiring

on:
  push:
    branches:
      - agent/mm-model-load-admission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mm-model-load-admission
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact runtime wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/RuntimeOrchestrator.kt')
          text = path.read_text()

          constructor_anchor = '    private val memoryAwareContextPlanner: MemoryAwareContextPlanner? = null,\n'
          assert text.count(constructor_anchor) == 1, 'constructor admission insertion point changed'
          text = text.replace(
              constructor_anchor,
              constructor_anchor + '    private val memoryAwareModelLoadPlanner: MemoryAwareModelLoadPlanner? = null,\n',
          )

          initialize_block = (
              '        if (!backendInitialized) {\n'
              '            backend.initialize()\n'
              '            backendInitialized = true\n'
              '        }\n'
          )
          assert text.count(initialize_block) == 1, 'backend initialization block changed'
          text = text.replace(initialize_block, '')

          load_anchor = (
              '        current?.let { backend.unloadModel(it.handle) }\n'
              '        loadedModel = null\n\n'
              '        val loaded = LoadedModelDescriptor(\n'
          )
          assert text.count(load_anchor) == 1, 'model load admission insertion point changed'
          replacement = (
              '        current?.let { backend.unloadModel(it.handle) }\n'
              '        loadedModel = null\n'
              '        admitModelLoad(resolved, schedulerSnapshot)\n\n'
              '        if (!backendInitialized) {\n'
              '            backend.initialize()\n'
              '            backendInitialized = true\n'
              '        }\n'
              '        val loaded = LoadedModelDescriptor(\n'
          )
          text = text.replace(load_anchor, replacement)

          helper_anchor = '    private fun validateRuntimeCapabilities(resolved: ResolvedUseCase) {'
          assert text.count(helper_anchor) == 1, 'model load helper insertion point changed'
          helper = (
              '    private fun admitModelLoad(resolved: ResolvedUseCase, schedulerSnapshot: DecodeSchedulerSnapshot) {\n'
              '        val planner = memoryAwareModelLoadPlanner ?: return\n'
              '        val decision = planner.plan(\n'
              '            MemoryAwareModelLoadRequest(\n'
              '                modelProfileId = resolved.model.id,\n'
              '                residency = RuntimeResidencySnapshot(\n'
              '                    modelLoaded = false,\n'
              '                    residentContexts = 0,\n'
              '                    activeGeneration = schedulerSnapshot.activeRequest != null,\n'
              '                    queuedGenerations = schedulerSnapshot.queuedRequests,\n'
              '                ),\n'
              '            ),\n'
              '        )\n'
              '        if (decision is MemoryAwareModelLoadDecision.Reject) {\n'
              '            throw ModelLoadMemoryAdmissionException(resolved.model.id, decision)\n'
              '        }\n'
              '    }\n\n'
          )
          text = text.replace(helper_anchor, helper + helper_anchor)
          path.write_text(text)
          PY
      - name: Apply canonical Kotlin formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Remove branch-scoped patch workflow
        run: git rm .github/workflows/mm-model-load-wiring.yml
      - name: Commit runtime wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- core/runtime-core .github/workflows
          git commit -m 'feat(runtime): gate native model load on memory admission'
          git push origin HEAD:agent/mm-model-load-admission
