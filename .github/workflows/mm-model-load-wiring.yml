name: Apply model-load admission wiring

on:
  push:
    branches:
      - agent/mm-model-load-admission

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mm-model-load-admission
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact runtime wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/RuntimeOrchestrator.kt')
          text = path.read_text()

          constructor_anchor = '    private val memoryAwareContextPlanner: MemoryAwareContextPlanner? = null,\n'
          assert text.count(constructor_anchor) == 1, 'constructor admission insertion point changed'
          text = text.replace(
              constructor_anchor,
              constructor_anchor + '    private val memoryAwareModelLoadPlanner: MemoryAwareModelLoadPlanner? = null,\n',
          )

          load_anchor = '        loadedModel = null\n\n        val loaded = LoadedModelDescriptor(\n'
          assert text.count(load_anchor) == 1, 'model load admission insertion point changed'
          text = text.replace(
              load_anchor,
              '        loadedModel = null\n        admitModelLoad(resolved, schedulerSnapshot)\n\n        val loaded = LoadedModelDescriptor(\n',
          )

          helper_anchor = '    private fun validateRuntimeCapabilities(resolved: ResolvedUseCase) {'
          assert text.count(helper_anchor) == 1, 'model load helper insertion point changed'
          helper = '''    private fun admitModelLoad(resolved: ResolvedUseCase, schedulerSnapshot: DecodeSchedulerSnapshot) {
              val planner = memoryAwareModelLoadPlanner ?: return
              val decision = planner.plan(
                  MemoryAwareModelLoadRequest(
                      modelProfileId = resolved.model.id,
                      residency = RuntimeResidencySnapshot(
                          modelLoaded = false,
                          residentContexts = 0,
                          activeGeneration = schedulerSnapshot.activeRequest != null,
                          queuedGenerations = schedulerSnapshot.queuedRequests,
                      ),
                  ),
              )
              if (decision is MemoryAwareModelLoadDecision.Reject) {
                  throw ModelLoadMemoryAdmissionException(resolved.model.id, decision)
              }
          }

          '''.replace('              ', '        ')
          text = text.replace(helper_anchor, helper + helper_anchor)
          path.write_text(text)
          PY
      - name: Apply canonical Kotlin formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Remove branch-scoped patch workflow
        run: git rm .github/workflows/mm-model-load-wiring.yml
      - name: Commit runtime wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/RuntimeOrchestrator.kt \
            core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/MemoryAwareModelLoadPlanner.kt \
            core/runtime-core/src/test/kotlin/io/github/daniele21/localllm/runtime/MemoryAwareModelLoadPlannerTest.kt \
            .github/workflows/mm-model-load-wiring.yml
          git commit -m 'feat(runtime): gate native model load on memory admission'
          git push origin HEAD:agent/mm-model-load-admission
