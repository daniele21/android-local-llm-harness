name: Apply phone model distribution Detekt refactor

on:
  push:
    branches: [agent/connected-model-distribution-ui]
    paths:
      - ".github/workflows/apply-phone-model-distribution-detekt-refactor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phone-model-distribution-detekt-refactor
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/connected-model-distribution-ui
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Apply dependency grouping refactor
        run: python3 scripts/refactor-phone-model-distribution-detekt.py
      - name: Apply canonical formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace spotlessApply
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionController.kt \
            apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/InstalledCatalogModelMetadata.kt \
            apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionControllerTest.kt
          git commit -m "Group distribution dependencies and simplify metadata store"
          git push origin HEAD:agent/connected-model-distribution-ui
