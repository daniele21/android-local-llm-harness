          Path("scripts/summarize-qwen35-tuning.py").write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\n\nimport argparse\nimport csv\nimport json\nimport statistics\nfrom collections import defaultdict\nfrom pathlib import Path\n\nNUMERIC_FIELDS = [\n    "ttftMs",\n    "prefillMs",\n    "decodeMs",\n    "totalMs",\n    "decodeTokensPerSecond",\n    "processPssKb",\n    "availableMemoryBytes",\n    "thermalStatus",\n]\nIDENTITY_FIELDS = [\n    "tuningCaseId",\n    "modelDigest",\n    "architecture",\n    "quantization",\n    "backendRevision",\n    "runtimeProfileVersion",\n    "generationProfileVersion",\n    "contextTokens",\n    "cpuThreads",\n    "batchThreads",\n    "batchSize",\n    "microBatchSize",\n    "thinkingMode",\n    "deviceModel",\n    "androidRelease",\n    "sdkInt",\n    "abi",\n]\n\ndef median(values):\n    filtered = [float(v) for v in values if v is not None]\n    return statistics.median(filtered) if filtered else None\n\ndef main() -> int:\n    parser = argparse.ArgumentParser(description="Summarize privacy-safe Qwen3.5 device tuning JSONL")\n    parser.add_argument("input", type=Path)\n    parser.add_argument("output", type=Path)\n    args = parser.parse_args()\n\n    groups = defaultdict(list)\n    for line in args.input.read_text().splitlines():\n        if line.strip():\n            record = json.loads(line)\n            groups[record["tuningCaseId"]].append(record)\n\n    rows = []\n    for case_id, records in sorted(groups.items()):\n        first = records[0]\n        for field in IDENTITY_FIELDS:\n            if any(record.get(field) != first.get(field) for record in records):\n                raise SystemExit(f"identity drift for {case_id}: {field}")\n        row = {field: first.get(field) for field in IDENTITY_FIELDS}\n        row["samples"] = len(records)\n        for field in NUMERIC_FIELDS:\n            row[f"median_{field}"] = median(record.get(field) for record in records)\n        rows.append(row)\n\n    args.output.parent.mkdir(parents=True, exist_ok=True)\n    fieldnames = IDENTITY_FIELDS + ["samples"] + [f"median_{field}" for field in NUMERIC_FIELDS]\n    with args.output.open("w", newline="") as handle:\n        writer = csv.DictWriter(handle, fieldnames=fieldnames)\n        writer.writeheader()\n        writer.writerows(rows)\n    print(f"Wrote {len(rows)} tuning case summaries to {args.output}")\n    return 0\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''')

          Path("scripts/run-qwen35-tuning-matrix.sh").write_text(r'''#!/usr/bin/env bash
set -euo pipefail

ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
APP_ID="io.github.daniele21.localllm.devicetest.debug"
ADB="${ADB:-adb}"
MODEL_PATH=""
TIER=""
REPEATS=3
OUTPUT_DIR="$ROOT_DIR/build/qwen35-tuning"
THINKING_MODE="DISABLED"

usage() {
  cat <<'EOF'
Usage: bash scripts/run-qwen35-tuning-matrix.sh --model /absolute/model.gguf --tier 0.8b|2b [options]

Options:
  --repeats N                 Samples per tuning case (default 3).
  --thinking-mode MODE        DISABLED or ENABLED (default DISABLED).
  --output-dir PATH           Evidence output directory.
  --help                      Show this help.

Only the exact curated Qwen3.5 Q4_K_M certification candidates are accepted.
The script records privacy-safe JSONL and CSV evidence; it never promotes a tuning profile automatically.
EOF
}

while [[ $# -gt 0 ]]; do
  case "$1" in
    --model) MODEL_PATH="${2:-}"; shift 2 ;;
    --tier) TIER="${2:-}"; shift 2 ;;
    --repeats) REPEATS="${2:-}"; shift 2 ;;
    --thinking-mode) THINKING_MODE="${2:-}"; shift 2 ;;
    --output-dir) OUTPUT_DIR="${2:-}"; shift 2 ;;
    --help|-h) usage; exit 0 ;;
    *) echo "Unknown argument: $1" >&2; usage >&2; exit 2 ;;
  esac
done

[[ -f "$MODEL_PATH" ]] || { echo "--model must be a readable file" >&2; exit 2; }
[[ "$REPEATS" =~ ^[1-9][0-9]*$ ]] || { echo "--repeats must be positive" >&2; exit 2; }
[[ "$THINKING_MODE" == "DISABLED" || "$THINKING_MODE" == "ENABLED" ]] || { echo "Invalid --thinking-mode" >&2; exit 2; }
command -v "$ADB" >/dev/null || { echo "adb is required" >&2; exit 2; }

sha256_file() {
  if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | awk '{print $1}'
  else shasum -a 256 "$1" | awk '{print $1}'; fi
}

case "$TIER" in
  0.8b)
    EXPECTED_SHA="bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517"
    ;;
  2b)
    EXPECTED_SHA="aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223"
    ;;
  *) echo "--tier must be 0.8b or 2b" >&2; exit 2 ;;
esac

ACTUAL_SHA="$(sha256_file "$MODEL_PATH" | tr '[:upper:]' '[:lower:]')"
[[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "Model SHA does not match the curated $TIER Q4_K_M candidate" >&2; exit 2; }
"$ADB" get-state >/dev/null
ABI="$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"
[[ "$ABI" == arm64-v8a* ]] || { echo "Physical tuning requires arm64-v8a" >&2; exit 2; }

cd "$ROOT_DIR"
./gradlew :apps:device-test-runner:assembleDebug :apps:device-test-runner:assembleDebugAndroidTest
APP_APK="$(find apps/device-test-runner/build/outputs/apk/debug -type f -name '*.apk' | sort | tail -n 1)"
TEST_APK="$(find apps/device-test-runner/build/outputs/apk/androidTest/debug -type f -name '*.apk' | sort | tail -n 1)"
"$ADB" install -r -t "$APP_APK"
"$ADB" install -r -t "$TEST_APK"
"$ADB" shell run-as "$APP_ID" mkdir -p files/e2e
"$ADB" shell -T run-as "$APP_ID" dd of=files/e2e/model.gguf bs=1048576 < "$MODEL_PATH" >/dev/null

RUNNER="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep -F "(target=$APP_ID)" | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
mkdir -p "$OUTPUT_DIR"
JSONL="$OUTPUT_DIR/qwen35-${TIER}-${THINKING_MODE,,}.jsonl"
CSV="$OUTPUT_DIR/qwen35-${TIER}-${THINKING_MODE,,}-summary.csv"
: > "$JSONL"

for context in 1024 2048 4096; do
  for threads in 2 4; do
    for pair in "64 32" "128 64"; do
      read -r batch ubatch <<< "$pair"
      case_id="${TIER}-ctx${context}-t${threads}-bt${threads}-b${batch}-ub${ubatch}-${THINKING_MODE,,}"
      for ((sample=1; sample<=REPEATS; sample++)); do
        echo "Running $case_id sample $sample/$REPEATS"
        set +e
        output="$("$ADB" shell am instrument -w -r \
          -e class io.github.daniele21.localllm.devicetest.LocalLlmDeviceE2eTest#fullLifecycleGeneratesAndReleasesResources \
          -e modelRelativePath files/e2e/model.gguf \
          -e modelSha256 "$EXPECTED_SHA" \
          -e modelArchitecture qwen35 \
          -e modelQuantization Q4_K_M \
          -e contextSize "$context" \
          -e batchSize "$batch" \
          -e microBatchSize "$ubatch" \
          -e cpuThreads "$threads" \
          -e batchThreads "$threads" \
          -e maxOutputTokens 64 \
          -e thinkingMode "$THINKING_MODE" \
          -e tuningCaseId "$case_id" \
          -e cancellationEnabled false \
          -e memoryRepeatCount 0 \
          "$RUNNER" 2>&1)"
        status=$?
        set -e
        output="${output//$'\r'/}"
        printf '%s\n' "$output"
        (( status == 0 )) || { echo "Tuning case failed: $case_id" >&2; exit 1; }
        evidence="$(printf '%s\n' "$output" | sed -n 's/^.*LOCAL_LLM_TUNING_JSON //p' | tail -n1)"
        [[ -n "$evidence" ]] || { echo "Missing tuning evidence for $case_id" >&2; exit 1; }
        printf '%s\n' "$evidence" >> "$JSONL"
      done
    done
  done
done

python3 scripts/summarize-qwen35-tuning.py "$JSONL" "$CSV"
echo "Qwen3.5 tuning evidence written to:"
echo "  $JSONL"
echo "  $CSV"
''')
          PY
          chmod +x scripts/run-qwen35-tuning-matrix.sh scripts/summarize-qwen35-tuning.py
      - name: Format
        run: ./gradlew spotlessApply
      - name: Static analysis
        run: ./gradlew --no-configuration-cache detekt verifyNoModelArtifacts
      - name: Targeted validation
        run: |
          ./gradlew \
            :models:model-profile:testDebugUnitTest \
            :core:runtime-core:testDebugUnitTest \
            :backends:llama-cpp:testDebugUnitTest \
            :apps:local-llm-phone-test:testDebugUnitTest \
            :apps:device-test-runner:compileDebugAndroidTestKotlin
          python3 -m py_compile scripts/summarize-qwen35-tuning.py
          bash -n scripts/run-qwen35-tuning-matrix.sh scripts/run-device-e2e.sh
      - name: Commit validated implementation and remove staging workflow
        shell: bash
        run: |
          rm .github/workflows/q35-456-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add qwen35 guard runtime capabilities and tuning harness"
          git push origin HEAD:dev
