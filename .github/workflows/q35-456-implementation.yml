name: Q35 4 5 6 implementation

on:
  push:
    paths:
      - ".github/workflows/q35-456-implementation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Apply Q35-4 Q35-5 Q35-6 implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"pattern not unique in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          profiles = "models/model-profile/src/main/kotlin/io/github/daniele21/localllm/models/Profiles.kt"
          replace_one(
              profiles,
              "data class GgufModelProfile(\n",
              '''data class RuntimeCapabilityProfile(\n    val requiredBackendId: String? = null,\n    val requiredBackendRevision: String? = null,\n    val approvedContextTiers: List<Int> = emptyList(),\n    val contextSafetyReserveTokens: Int = 256,\n    val supportsStatelessContextReuse: Boolean = true,\n    val supportsPrefixSnapshot: Boolean = false,\n    val supportsSessionRestore: Boolean = false,\n    val supportsPrefixReuse: Boolean = false,\n) {\n    init {\n        require(requiredBackendId == null || requiredBackendId.isNotBlank()) { "Required backend ID must not be blank" }\n        require(requiredBackendRevision == null || requiredBackendRevision.isNotBlank()) {\n            "Required backend revision must not be blank"\n        }\n        require(contextSafetyReserveTokens >= 0) { "Context safety reserve must not be negative" }\n        require(approvedContextTiers.all { it > 0 }) { "Approved context tiers must be positive" }\n        require(approvedContextTiers == approvedContextTiers.distinct().sorted()) {\n            "Approved context tiers must be unique and sorted"\n        }\n    }\n}\n\ndata class GenerationGuardPolicy(\n    val version: Int = 1,\n    val enabled: Boolean = false,\n    val thinkingTokenBudget: Int = 0,\n    val repetitionActivationTokens: Int = 0,\n    val observationWindowChars: Int = 0,\n    val minPatternChars: Int = 0,\n    val maxPatternChars: Int = 0,\n    val repetitionOccurrences: Int = 0,\n) {\n    init {\n        require(version > 0) { "Generation guard version must be positive" }\n        if (enabled) {\n            require(thinkingTokenBudget > 0) { "Thinking token budget must be positive" }\n            require(repetitionActivationTokens > 0) { "Repetition activation threshold must be positive" }\n            require(observationWindowChars > 0) { "Observation window must be positive" }\n            require(minPatternChars > 0) { "Minimum repetition pattern must be positive" }\n            require(maxPatternChars >= minPatternChars) { "Maximum repetition pattern must not be smaller than minimum" }\n            require(observationWindowChars >= maxPatternChars * repetitionOccurrences) {\n                "Observation window must contain the configured repetition evidence"\n            }\n            require(repetitionOccurrences >= 2) { "Repetition occurrences must be at least two" }\n        }\n    }\n\n    companion object {\n        fun disabled(): GenerationGuardPolicy = GenerationGuardPolicy()\n    }\n}\n\ndata class GgufModelProfile(\n''',
          )
          replace_one(
              profiles,
              "    val chatTemplatePolicy: ChatTemplatePolicy = ChatTemplatePolicy(),\n)\n",
              "    val chatTemplatePolicy: ChatTemplatePolicy = ChatTemplatePolicy(),\n    val runtimeCapabilities: RuntimeCapabilityProfile = RuntimeCapabilityProfile(),\n)\n",
          )
          replace_one(
              profiles,
              "    val repeatLastN: Int = DEFAULT_REPEAT_LAST_N,\n) {\n",
              "    val repeatLastN: Int = DEFAULT_REPEAT_LAST_N,\n    val guardPolicy: GenerationGuardPolicy = GenerationGuardPolicy.disabled(),\n) {\n",
          )

          qwen_generation = Path("models/model-profile/src/main/kotlin/io/github/daniele21/localllm/models/Qwen35GenerationProfiles.kt")
          qwen_generation.write_text('''package io.github.daniele21.localllm.models\n\nimport io.github.daniele21.localllm.contracts.ThinkingMode\n\nenum class Qwen35ModelTier {\n    B0_8,\n    B2,\n}\n\nenum class Qwen35GenerationProfileId {\n    QWEN35_TEXT_FAST,\n    QWEN35_TEXT_QUALITY,\n    QWEN35_THINKING,\n    QWEN35_PRECISE,\n    QWEN35_JSON,\n}\n\ndata class Qwen35GenerationProfile(val id: Qwen35GenerationProfileId, val version: Int, val defaults: GenerationDefaults)\n\nobject Qwen35GenerationGuardPolicies {\n    const val VERSION = 1\n\n    fun forTier(tier: Qwen35ModelTier): GenerationGuardPolicy = when (tier) {\n        Qwen35ModelTier.B0_8 -> policy(thinkingBudget = 768, activationTokens = 64)\n        Qwen35ModelTier.B2 -> policy(thinkingBudget = 1_536, activationTokens = 96)\n    }\n\n    private fun policy(thinkingBudget: Int, activationTokens: Int) = GenerationGuardPolicy(\n        version = VERSION,\n        enabled = true,\n        thinkingTokenBudget = thinkingBudget,\n        repetitionActivationTokens = activationTokens,\n        observationWindowChars = 4_096,\n        minPatternChars = 24,\n        maxPatternChars = 256,\n        repetitionOccurrences = 4,\n    )\n}\n\nobject Qwen35GenerationProfiles {\n    const val VERSION = 2\n\n    fun forTier(tier: Qwen35ModelTier): List<Qwen35GenerationProfile> {\n        val qualityTokens = if (tier == Qwen35ModelTier.B0_8) 512 else 768\n        val thinkingTokens = if (tier == Qwen35ModelTier.B0_8) 512 else 1_024\n        return listOf(\n            profile(tier, Qwen35GenerationProfileId.QWEN35_TEXT_FAST, 256, ThinkingMode.DISABLED, 1f, 1f, 2f),\n            profile(tier, Qwen35GenerationProfileId.QWEN35_TEXT_QUALITY, qualityTokens, ThinkingMode.DISABLED, 1f, 1f, 2f),\n            profile(tier, Qwen35GenerationProfileId.QWEN35_THINKING, thinkingTokens, ThinkingMode.ENABLED, 1f, 0.95f, 1.5f),\n            profile(tier, Qwen35GenerationProfileId.QWEN35_PRECISE, thinkingTokens, ThinkingMode.ENABLED, 0.6f, 0.95f, 0f),\n            profile(tier, Qwen35GenerationProfileId.QWEN35_JSON, 512, ThinkingMode.DISABLED, 1f, 1f, 2f),\n        )\n    }\n\n    fun defaultForTier(tier: Qwen35ModelTier): GenerationDefaults =\n        forTier(tier).single { it.id == Qwen35GenerationProfileId.QWEN35_TEXT_QUALITY }.defaults\n\n    private fun profile(\n        tier: Qwen35ModelTier,\n        id: Qwen35GenerationProfileId,\n        maxOutputTokens: Int,\n        thinkingMode: ThinkingMode,\n        temperature: Float,\n        topP: Float,\n        presencePenalty: Float,\n    ) = Qwen35GenerationProfile(\n        id = id,\n        version = VERSION,\n        defaults = GenerationDefaults(\n            maxOutputTokens = maxOutputTokens,\n            temperature = temperature,\n            topP = topP,\n            topK = 20,\n            minP = 0f,\n            presencePenalty = presencePenalty,\n            thinkingMode = thinkingMode,\n            repeatPenalty = 1f,\n            repeatLastN = 64,\n            guardPolicy = Qwen35GenerationGuardPolicies.forTier(tier),\n        ),\n    )\n}\n''')

          Path("models/model-profile/src/main/kotlin/io/github/daniele21/localllm/models/Qwen35RuntimeTuning.kt").write_text('''package io.github.daniele21.localllm.models\n\nenum class Qwen35RuntimeEvidenceStatus {\n    CANDIDATE,\n    MEASURED,\n}\n\ndata class Qwen35RuntimeTuningProfile(\n    val id: String,\n    val version: Int,\n    val tier: Qwen35ModelTier,\n    val approvedContextTiers: List<Int>,\n    val defaultContextTokens: Int,\n    val batchSize: Int,\n    val microBatchSize: Int,\n    val maxCpuThreads: Int,\n    val maxBatchThreads: Int,\n    val useMmap: Boolean,\n    val useMlock: Boolean,\n    val flashAttention: Boolean,\n    val evidenceStatus: Qwen35RuntimeEvidenceStatus,\n) {\n    init {\n        require(id.isNotBlank()) { "Runtime tuning profile ID must not be blank" }\n        require(version > 0) { "Runtime tuning profile version must be positive" }\n        require(approvedContextTiers.isNotEmpty()) { "Qwen3.5 context tiers must not be empty" }\n        require(defaultContextTokens in approvedContextTiers) { "Default context must be an approved tier" }\n        require(batchSize > 0 && microBatchSize > 0 && microBatchSize <= batchSize) { "Invalid batch configuration" }\n        require(maxCpuThreads > 0 && maxBatchThreads > 0) { "Thread caps must be positive" }\n    }\n\n    fun resolve(availableProcessors: Int): Qwen35ResolvedRuntimeTuning {\n        val processors = availableProcessors.coerceAtLeast(1)\n        return Qwen35ResolvedRuntimeTuning(\n            profileId = id,\n            profileVersion = version,\n            tier = tier,\n            contextTokens = defaultContextTokens,\n            batchSize = batchSize,\n            microBatchSize = microBatchSize,\n            cpuThreads = processors.coerceAtMost(maxCpuThreads),\n            batchThreads = processors.coerceAtMost(maxBatchThreads),\n            useMmap = useMmap,\n            useMlock = useMlock,\n            flashAttention = flashAttention,\n            evidenceStatus = evidenceStatus,\n        )\n    }\n\n    fun runtimeCapabilities(): RuntimeCapabilityProfile = RuntimeCapabilityProfile(\n        requiredBackendId = "llama.cpp",\n        requiredBackendRevision = Qwen35RuntimeTuningProfiles.LLAMA_CPP_REVISION,\n        approvedContextTiers = approvedContextTiers,\n        contextSafetyReserveTokens = 256,\n        supportsStatelessContextReuse = false,\n        supportsPrefixSnapshot = false,\n        supportsSessionRestore = false,\n        supportsPrefixReuse = false,\n    )\n}\n\ndata class Qwen35ResolvedRuntimeTuning(\n    val profileId: String,\n    val profileVersion: Int,\n    val tier: Qwen35ModelTier,\n    val contextTokens: Int,\n    val batchSize: Int,\n    val microBatchSize: Int,\n    val cpuThreads: Int,\n    val batchThreads: Int,\n    val useMmap: Boolean,\n    val useMlock: Boolean,\n    val flashAttention: Boolean,\n    val evidenceStatus: Qwen35RuntimeEvidenceStatus,\n)\n\ndata class Qwen35TuningCandidate(\n    val tier: Qwen35ModelTier,\n    val contextTokens: Int,\n    val cpuThreads: Int,\n    val batchThreads: Int,\n    val batchSize: Int,\n    val microBatchSize: Int,\n) {\n    val stableId: String\n        get() = listOf(\n            tier.name.lowercase(),\n            "ctx$contextTokens",\n            "t$cpuThreads",\n            "bt$batchThreads",\n            "b$batchSize",\n            "ub$microBatchSize",\n        ).joinToString("-")\n}\n\nobject Qwen35RuntimeTuningProfiles {\n    const val VERSION = 1\n    const val LLAMA_CPP_REVISION = "aedb2a5e9ca3d4064148bbb919e0ddc0c1b70ab3"\n    val APPROVED_CONTEXT_TIERS: List<Int> = listOf(1_024, 2_048, 4_096, 8_192)\n\n    fun candidateForTier(tier: Qwen35ModelTier): Qwen35RuntimeTuningProfile = Qwen35RuntimeTuningProfile(\n        id = when (tier) {\n            Qwen35ModelTier.B0_8 -> "qwen35-08b-android-candidate"\n            Qwen35ModelTier.B2 -> "qwen35-2b-android-candidate"\n        },\n        version = VERSION,\n        tier = tier,\n        approvedContextTiers = APPROVED_CONTEXT_TIERS,\n        defaultContextTokens = 2_048,\n        batchSize = 128,\n        microBatchSize = 64,\n        maxCpuThreads = 4,\n        maxBatchThreads = 4,\n        useMmap = true,\n        useMlock = false,\n        flashAttention = false,\n        evidenceStatus = Qwen35RuntimeEvidenceStatus.CANDIDATE,\n    )\n\n    fun tuningMatrixForTier(tier: Qwen35ModelTier): List<Qwen35TuningCandidate> =\n        listOf(1_024, 2_048, 4_096).flatMap { context ->\n            listOf(2, 4).flatMap { threads ->\n                listOf(64 to 32, 128 to 64).map { (batch, microBatch) ->\n                    Qwen35TuningCandidate(\n                        tier = tier,\n                        contextTokens = context,\n                        cpuThreads = threads,\n                        batchThreads = threads,\n                        batchSize = batch,\n                        microBatchSize = microBatch,\n                    )\n                }\n            }\n        }\n}\n''')

          generation_config = "core/contracts/src/main/kotlin/io/github/daniele21/localllm/contracts/GenerationConfiguration.kt"
          replace_one(
              generation_config,
              "    GRAMMAR_COMPLETE,\n    UNKNOWN,\n",
              "    GRAMMAR_COMPLETE,\n    GENERATION_GUARD_REPETITION,\n    GENERATION_GUARD_THINKING_BUDGET,\n    UNKNOWN,\n",
          )

          backend_contract = "core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/InferenceBackend.kt"
          replace_one(
              backend_contract,
              "interface InferenceBackend {\n    val id: String\n",
              "interface InferenceBackend {\n    val id: String\n    val revision: String?\n        get() = null\n",
          )

          llama_backend = "core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/LlamaCppInferenceBackend.kt"
          replace_one(
              llama_backend,
              '    override val id: String = "llama.cpp"\n',
              '    override val id: String = "llama.cpp"\n    override val revision: String = "aedb2a5e9ca3d4064148bbb919e0ddc0c1b70ab3"\n',
          )

          Path("core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/GenerationGuard.kt").write_text('''package io.github.daniele21.localllm.runtime\n\nimport io.github.daniele21.localllm.contracts.StopReason\nimport io.github.daniele21.localllm.contracts.ThinkingMode\nimport io.github.daniele21.localllm.models.GenerationGuardPolicy\n\ninternal class GenerationGuard(\n    private val thinkingMode: ThinkingMode,\n    private val policy: GenerationGuardPolicy,\n) {\n    private val observation = StringBuilder()\n    private var thinkingClosed = false\n\n    fun observe(text: String, generatedTokens: Int): StopReason? {\n        if (!policy.enabled || thinkingMode != ThinkingMode.ENABLED || thinkingClosed) return null\n        appendBounded(text)\n        if (THINKING_CLOSE in observation) {\n            thinkingClosed = true\n            return null\n        }\n        if (generatedTokens >= policy.thinkingTokenBudget) {\n            return StopReason.GENERATION_GUARD_THINKING_BUDGET\n        }\n        if (generatedTokens >= policy.repetitionActivationTokens && repeatedSuffix()) {\n            return StopReason.GENERATION_GUARD_REPETITION\n        }\n        return null\n    }\n\n    internal fun retainedCharacters(): Int = observation.length\n\n    private fun appendBounded(text: String) {\n        observation.append(text)\n        val overflow = observation.length - policy.observationWindowChars\n        if (overflow > 0) observation.delete(0, overflow)\n    }\n\n    private fun repeatedSuffix(): Boolean {\n        val normalized = observation.toString()\n            .lowercase()\n            .replace(WHITESPACE, " ")\n            .trim()\n        val maximumPattern = minOf(policy.maxPatternChars, normalized.length / policy.repetitionOccurrences)\n        if (maximumPattern < policy.minPatternChars) return false\n        for (length in policy.minPatternChars..maximumPattern) {\n            val evidenceLength = length * policy.repetitionOccurrences\n            val evidence = normalized.takeLast(evidenceLength)\n            val pattern = evidence.take(length)\n            if (!pattern.any(Char::isLetterOrDigit) || pattern.toSet().size < MIN_PATTERN_DIVERSITY) continue\n            if (evidence == pattern.repeat(policy.repetitionOccurrences)) return true\n        }\n        return false\n    }\n\n    private companion object {\n        const val THINKING_CLOSE = "</think>"\n        const val MIN_PATTERN_DIVERSITY = 4\n        val WHITESPACE = Regex("\\\\s+")\n    }\n}\n''')

          context_selector = Path("core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ContextSizeSelector.kt")
          context_selector.write_text('''package io.github.daniele21.localllm.runtime\n\ninternal object ContextSizeSelector {\n    val supportedSizes: List<Int> = listOf(1_024, 2_048, 4_096, 8_192, 16_384, 32_768, 65_536)\n\n    fun selectAuto(\n        required: Int,\n        maximum: Int,\n        preferredMinimum: Int?,\n        candidateSizes: List<Int> = supportedSizes,\n    ): Int? {\n        if (required <= 0 || maximum <= 0 || required > maximum) return null\n        val sizes = candidateSizes.distinct().sorted().filter { it > 0 }\n        val target = maxOf(required, preferredMinimum?.coerceAtMost(maximum) ?: required)\n        return sizes.firstOrNull { it >= target && it <= maximum }\n    }\n\n    fun supportsManual(\n        tokens: Int,\n        required: Int,\n        maximum: Int,\n        candidateSizes: List<Int> = supportedSizes,\n    ): Boolean = tokens in candidateSizes && tokens >= required && tokens <= maximum\n}\n''')

          orchestrator = "core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/RuntimeOrchestrator.kt"
          replace_one(
              orchestrator,
              "import io.github.daniele21.localllm.models.InferencePreset\n",
              "import io.github.daniele21.localllm.models.GenerationGuardPolicy\nimport io.github.daniele21.localllm.models.InferencePreset\n",
          )
          replace_one(
              orchestrator,
              "import io.github.daniele21.localllm.contracts.SessionOptions\n",
              "import io.github.daniele21.localllm.contracts.SessionOptions\nimport io.github.daniele21.localllm.contracts.StopReason\n",
          )
          replace_one(
              orchestrator,
              "            val backendRequest = BackendGenerationRequest(\n",
              "            val generationGuard = GenerationGuard(resolved.thinkingMode, resolved.guardPolicy)\n            val guardStopReason = AtomicReference<StopReason?>(null)\n            val backendRequest = BackendGenerationRequest(\n",
          )
          old_callback = '''            val outcome = backend.generate(contextResult.context, backendRequest) { text, generatedTokens ->\n                if (lifecycle.cancelRequested.get()) {\n                    false\n                } else {\n                    firstTokenAt.compareAndSet(0, clock.nowNanos())\n                    output.append(text)\n                    lifecycle.emit(\n                        GenerationEvent.TextDelta(\n                            requestId = request.requestId,\n                            text = text,\n                            generatedTokens = generatedTokens,\n                        ),\n                    )\n                    !lifecycle.cancelRequested.get()\n                }\n            }\n\n            if (lifecycle.cancelRequested.get() || outcome is BackendGenerationOutcome.Cancelled) {\n                val cancellation = LocalLlmError.Cancelled()\n                runtimeTelemetry.failed(request.requestId, cancellation)\n                lifecycle.finish(GenerationEvent.Failed(request.requestId, cancellation))\n            } else {\n                val backendMetrics = (outcome as BackendGenerationOutcome.Completed).metrics\n                val publicMetrics = backendMetrics.toPublicMetrics(\n                    queueMs = nanosToMillis(executionStartedAt - enqueuedAt),\n                    modelLoadMs = session.modelLoadDurationMs,\n                    modelLoadKind = session.modelLoadKind,\n                    timeToFirstTokenMs = firstTokenAt.get().takeIf { it != 0L }\n                        ?.let { nanosToMillis(it - executionStartedAt) },\n                    totalMs = nanosToMillis(clock.nowNanos() - enqueuedAt),\n                    promptPlanningMs = promptPlanningMs,\n                    contextCreationMs = contextResult.creationMs,\n                )\n                runtimeTelemetry.completed(request.requestId, publicMetrics)\n                lifecycle.finish(\n                    GenerationEvent.Completed(\n                        requestId = request.requestId,\n                        output = output.toString(),\n                        metrics = publicMetrics,\n                    ),\n                )\n            }\n'''
          new_callback = '''            val outcome = backend.generate(contextResult.context, backendRequest) { text, generatedTokens ->\n                if (lifecycle.cancelRequested.get()) {\n                    false\n                } else {\n                    firstTokenAt.compareAndSet(0, clock.nowNanos())\n                    output.append(text)\n                    lifecycle.emit(\n                        GenerationEvent.TextDelta(\n                            requestId = request.requestId,\n                            text = text,\n                            generatedTokens = generatedTokens,\n                        ),\n                    )\n                    val guardReason = generationGuard.observe(text, generatedTokens)\n                    if (guardReason != null) guardStopReason.compareAndSet(null, guardReason)\n                    guardReason == null && !lifecycle.cancelRequested.get()\n                }\n            }\n\n            val guardReason = guardStopReason.get()\n            if (lifecycle.cancelRequested.get()) {\n                val cancellation = LocalLlmError.Cancelled()\n                runtimeTelemetry.failed(request.requestId, cancellation)\n                lifecycle.finish(GenerationEvent.Failed(request.requestId, cancellation))\n            } else if (guardReason != null) {\n                val guardedMetrics = outcome.metrics().copy(stopReason = guardReason)\n                completeGeneration(\n                    request = request,\n                    session = session,\n                    lifecycle = lifecycle,\n                    output = output.toString(),\n                    backendMetrics = guardedMetrics,\n                    executionStartedAt = executionStartedAt,\n                    enqueuedAt = enqueuedAt,\n                    firstTokenAt = firstTokenAt,\n                    promptPlanningMs = promptPlanningMs,\n                    contextCreationMs = contextResult.creationMs,\n                )\n            } else if (outcome is BackendGenerationOutcome.Cancelled) {\n                val cancellation = LocalLlmError.Cancelled()\n                runtimeTelemetry.failed(request.requestId, cancellation)\n                lifecycle.finish(GenerationEvent.Failed(request.requestId, cancellation))\n            } else {\n                completeGeneration(\n                    request = request,\n                    session = session,\n                    lifecycle = lifecycle,\n                    output = output.toString(),\n                    backendMetrics = (outcome as BackendGenerationOutcome.Completed).metrics,\n                    executionStartedAt = executionStartedAt,\n                    enqueuedAt = enqueuedAt,\n                    firstTokenAt = firstTokenAt,\n                    promptPlanningMs = promptPlanningMs,\n                    contextCreationMs = contextResult.creationMs,\n                )\n            }\n'''
          replace_one(orchestrator, old_callback, new_callback)
          replace_one(
              orchestrator,
              "            contextPreference = preset?.contextPreference ?: ContextPreference(),\n        )\n",
              "            contextPreference = preset?.contextPreference ?: ContextPreference(),\n            guardPolicy = defaults.guardPolicy,\n        )\n",
          )
          replace_one(
              orchestrator,
              "        val required = runCatching {\n            Math.addExact(Math.addExact(promptTokenCount, maxOutputTokens), CONTEXT_RESERVE_TOKENS)\n",
              "        val runtimeCapabilities = session.resolved.model.runtimeCapabilities\n        val required = runCatching {\n            Math.addExact(Math.addExact(promptTokenCount, maxOutputTokens), runtimeCapabilities.contextSafetyReserveTokens)\n",
          )
          replace_one(
              orchestrator,
              "        val maximum = minOf(capabilities.maximumContextTokens, preference.maximumTokens ?: Int.MAX_VALUE)\n",
              "        val approvedTiers = runtimeCapabilities.approvedContextTiers.ifEmpty { ContextSizeSelector.supportedSizes }\n        val maximum = minOf(\n            capabilities.maximumContextTokens,\n            preference.maximumTokens ?: Int.MAX_VALUE,\n            approvedTiers.maxOrNull() ?: Int.MAX_VALUE,\n        )\n",
          )
          replace_one(
              orchestrator,
              "                if (!ContextSizeSelector.supportsManual(policy.tokens, required, maximum)) {\n",
              "                if (!ContextSizeSelector.supportsManual(policy.tokens, required, maximum, approvedTiers)) {\n",
          )
          replace_one(
              orchestrator,
              "                preferredMinimum = preference.preferredTokens,\n            ) ?: throw GenerationPlanningException(\n",
              "                preferredMinimum = preference.preferredTokens,\n                candidateSizes = approvedTiers,\n            ) ?: throw GenerationPlanningException(\n",
          )
          old_materialize = '''            val current = session.context\n            if (current != null && current.contextSize >= requestedContextSize) {\n                return@synchronized ContextMaterialization(current, null, created = false)\n            }\n            if (current != null && session.options.kind == SessionKind.CONVERSATIONAL) {\n'''
          new_materialize = '''            val current = session.context\n            val capabilities = session.resolved.model.runtimeCapabilities\n            val statelessReuse = session.resolved.useCase.cachePolicy.reuseStatelessContext &&\n                capabilities.supportsStatelessContextReuse\n            val liveReuseAllowed = session.options.kind == SessionKind.CONVERSATIONAL || statelessReuse\n            if (current != null && current.contextSize >= requestedContextSize && liveReuseAllowed) {\n                return@synchronized ContextMaterialization(current, null, created = false)\n            }\n            if (current != null && session.options.kind == SessionKind.CONVERSATIONAL) {\n'''
          replace_one(orchestrator, old_materialize, new_materialize)
          replace_one(
              orchestrator,
              "    private fun ensureModelLoaded(resolved: ResolvedUseCase): LoadedModelDescriptor {\n        check(!closed.get()) { \"Runtime is closed\" }\n",
              "    private fun ensureModelLoaded(resolved: ResolvedUseCase): LoadedModelDescriptor {\n        check(!closed.get()) { \"Runtime is closed\" }\n        validateRuntimeCapabilities(resolved)\n",
          )
          replace_one(
              orchestrator,
              "    private fun releaseSessionRequest(session: SessionDescriptor) {\n",
              '''    private fun validateRuntimeCapabilities(resolved: ResolvedUseCase) {\n        val capabilities = resolved.model.runtimeCapabilities\n        capabilities.requiredBackendId?.let { required ->\n            check(backend.id == required) { "Runtime profile requires backend $required" }\n        }\n        capabilities.requiredBackendRevision?.let { required ->\n            check(backend.revision == required) { "Runtime profile requires backend revision $required" }\n        }\n        check(!resolved.useCase.cachePolicy.enablePrefixSnapshot || capabilities.supportsPrefixSnapshot) {\n            "Runtime profile does not allow prefix snapshots"\n        }\n        check(!resolved.useCase.cachePolicy.reuseStatelessContext || capabilities.supportsStatelessContextReuse) {\n            "Runtime profile does not allow stateless context reuse"\n        }\n    }\n\n    private fun BackendGenerationOutcome.metrics(): BackendGenerationMetrics = when (this) {\n        is BackendGenerationOutcome.Completed -> metrics\n        is BackendGenerationOutcome.Cancelled -> metrics\n    }\n\n    private fun completeGeneration(\n        request: GenerationRequest,\n        session: SessionDescriptor,\n        lifecycle: RequestLifecycle,\n        output: String,\n        backendMetrics: BackendGenerationMetrics,\n        executionStartedAt: Long,\n        enqueuedAt: Long,\n        firstTokenAt: AtomicLong,\n        promptPlanningMs: Long,\n        contextCreationMs: Long?,\n    ) {\n        val publicMetrics = backendMetrics.toPublicMetrics(\n            queueMs = nanosToMillis(executionStartedAt - enqueuedAt),\n            modelLoadMs = session.modelLoadDurationMs,\n            modelLoadKind = session.modelLoadKind,\n            timeToFirstTokenMs = firstTokenAt.get().takeIf { it != 0L }\n                ?.let { nanosToMillis(it - executionStartedAt) },\n            totalMs = nanosToMillis(clock.nowNanos() - enqueuedAt),\n            promptPlanningMs = promptPlanningMs,\n            contextCreationMs = contextCreationMs,\n        )\n        runtimeTelemetry.completed(request.requestId, publicMetrics)\n        lifecycle.finish(\n            GenerationEvent.Completed(\n                requestId = request.requestId,\n                output = output,\n                metrics = publicMetrics,\n            ),\n        )\n    }\n\n    private fun releaseSessionRequest(session: SessionDescriptor) {\n''',
          )
          replace_one(
              orchestrator,
              "        val contextPreference: ContextPreference,\n    )\n",
              "        val contextPreference: ContextPreference,\n        val guardPolicy: GenerationGuardPolicy,\n    )\n",
