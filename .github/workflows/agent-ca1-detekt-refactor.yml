name: Agent CA1 detekt refactor

on:
  push:
    branches:
      - agent/consumer-api-ca0-ca1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Refactor CA-1 selection validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt')
          s = p.read_text()
          start = s.index('    fun validateSelection(')
          end = s.index('    private fun resolveContext', start)
          replacement = (
              '    fun validateSelection(\n'
              '        applicationId: ApplicationId,\n'
              '        useCaseId: UseCaseId,\n'
              '        request: ConsumerSelectionRequest,\n'
              '    ): ConsumerPolicyDecision =\n'
              '        when (val context = resolveContext(applicationId, useCaseId)) {\n'
              '            is ContextResult.Rejected -> rejected(context.code, context.detail)\n'
              '            is ContextResult.Resolved -> validateResolvedSelection(context, request)\n'
              '        }\n\n'
              '    private fun validateResolvedSelection(\n'
              '        context: ContextResult.Resolved,\n'
              '        request: ConsumerSelectionRequest,\n'
              '    ): ConsumerPolicyDecision {\n'
              '        val capabilityError = capabilityError(context.capabilities, request)\n'
              '        if (capabilityError != null) return capabilityError\n\n'
              '        val presetRef = request.preset ?: context.policy.defaultPreset\n'
              '        val preset = presetRef?.let(context.presetsByRef::get)\n'
              '        val presetError = presetError(context, presetRef, preset)\n'
              '        if (presetError != null) return presetError\n\n'
              '        val outputConstraint = request.outputConstraint ?: context.policy.defaultOutputConstraint\n'
              '        val sessionKind = request.sessionKind ?: context.policy.defaultSessionKind\n'
              '        val constraintError = constraintError(context, preset, outputConstraint, sessionKind)\n'
              '        if (constraintError != null) return constraintError\n\n'
              '        return resolveAcceptedDecision(context, request, preset, outputConstraint, sessionKind)\n'
              '    }\n\n'
              '    private fun capabilityError(\n'
              '        capabilities: UseCaseCapabilities,\n'
              '        request: ConsumerSelectionRequest,\n'
              '    ): ConsumerPolicyDecision.Rejected? =\n'
              '        when {\n'
              '            request.capabilityRevision != null && request.capabilityRevision != capabilities.capabilityRevision -> rejected(\n'
              '                ConsumerCapabilityErrorCode.STALE_CAPABILITY,\n'
              '                "Capability revision is stale; discover capabilities again before preparation",\n'
              '            )\n'
              '            capabilities.readiness == UseCaseReadiness.UNAVAILABLE_MODEL -> rejected(\n'
              '                ConsumerCapabilityErrorCode.MODEL_UNAVAILABLE,\n'
              '                "The model bound to this use case is unavailable",\n'
              '            )\n'
              '            capabilities.readiness == UseCaseReadiness.UNAVAILABLE_HOST_POLICY -> rejected(\n'
              '                ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE,\n'
              '                "The host cannot currently evaluate model readiness",\n'
              '            )\n'
              '            capabilities.readiness == UseCaseReadiness.INCOMPATIBLE -> rejected(\n'
              '                ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE,\n'
              '                "Consumer policy is incompatible with the resolved use-case profile",\n'
              '            )\n'
              '            else -> null\n'
              '        }\n\n'
              '    private fun presetError(\n'
              '        context: ContextResult.Resolved,\n'
              '        presetRef: InferencePresetRef?,\n'
              '        preset: InferencePreset?,\n'
              '    ): ConsumerPolicyDecision.Rejected? =\n'
              '        when {\n'
              '            presetRef == null -> null\n'
              '            presetRef !in context.policy.exposedPresets -> rejected(\n'
              '                ConsumerCapabilityErrorCode.PRESET_NOT_ALLOWED,\n'
              '                "Requested preset is not exposed for this use case",\n'
              '            )\n'
              '            preset == null -> rejected(\n'
              '                ConsumerCapabilityErrorCode.CAPABILITY_INCOMPATIBLE,\n'
              '                "Requested preset is not present in the resolved use-case profile",\n'
              '            )\n'
              '            else -> null\n'
              '        }\n\n'
              '    private fun constraintError(\n'
              '        context: ContextResult.Resolved,\n'
              '        preset: InferencePreset?,\n'
              '        outputConstraint: ConsumerOutputConstraintKind,\n'
              '        sessionKind: SessionKind,\n'
              '    ): ConsumerPolicyDecision.Rejected? =\n'
              '        when {\n'
              '            sessionKind !in context.policy.sessionKinds -> rejected(\n'
              '                ConsumerCapabilityErrorCode.SESSION_KIND_NOT_ALLOWED,\n'
              '                "Requested session kind is not allowed for this use case",\n'
              '            )\n'
              '            outputConstraint !in context.policy.outputConstraints ||\n'
              '                outputConstraint !in effectiveOutputConstraints(context.resolved, preset) -> rejected(\n'
              '                ConsumerCapabilityErrorCode.OUTPUT_NOT_ALLOWED,\n'
              '                "Requested output constraint is not allowed by the effective preset/use-case policy",\n'
              '            )\n'
              '            else -> null\n'
              '        }\n\n'
              '    private fun resolveAcceptedDecision(\n'
              '        context: ContextResult.Resolved,\n'
              '        request: ConsumerSelectionRequest,\n'
              '        preset: InferencePreset?,\n'
              '        outputConstraint: ConsumerOutputConstraintKind,\n'
              '        sessionKind: SessionKind,\n'
              '    ): ConsumerPolicyDecision =\n'
              '        when (\n'
              '            val result = resolveReasoningMode(\n'
              '                capability = context.policy.reasoning,\n'
              '                preference = request.reasoning,\n'
              '                preset = preset,\n'
              '                resolved = context.resolved,\n'
              '            )\n'
              '        ) {\n'
              '            is ReasoningResolution.Accepted -> ConsumerPolicyDecision.Accepted(\n'
              '                resolvedUseCase = context.resolved,\n'
              '                preset = preset,\n'
              '                reasoningMode = result.mode,\n'
              '                outputConstraint = outputConstraint,\n'
              '                sessionKind = sessionKind,\n'
              '                capabilityRevision = context.capabilities.capabilityRevision,\n'
              '            )\n'
              '            is ReasoningResolution.Rejected -> rejected(result.code, result.detail)\n'
              '        }\n\n'
          )
          s = s[:start] + replacement + s[end:]

          start = s.index('    private fun policyIsCompatible(')
          end = s.index('    private fun effectiveOutputConstraints', start)
          replacement = (
              '    private fun policyIsCompatible(\n'
              '        policy: ConsumerUseCasePolicy,\n'
              '        resolved: ResolvedUseCase,\n'
              '        presetsByRef: Map<InferencePresetRef, InferencePreset>,\n'
              '    ): Boolean {\n'
              '        val presetsCompatible = presetsByRef.keys.containsAll(policy.exposedPresets)\n'
              '        val defaultPresetCompatible = policy.defaultPreset == null || policy.defaultPreset in presetsByRef\n'
              '        val internalOutputKinds = buildSet {\n'
              '            add(resolved.useCase.outputMode.toConsumerKind())\n'
              '            resolved.useCase.presets.forEach { preset ->\n'
              '                preset.allowedOutputModes.forEach { add(it.toConsumerKind()) }\n'
              '            }\n'
              '        }\n'
              '        val outputsCompatible = internalOutputKinds.containsAll(policy.outputConstraints)\n'
              '        val defaultPreset = policy.defaultPreset?.let(presetsByRef::get)\n'
              '        val reasoningCompatible = policy.reasoning != ConsumerReasoningCapability.SURFACED_REQUIRED_BY_POLICY ||\n'
              '            supportsSurfacedReasoning(defaultPreset, resolved)\n'
              '        return presetsCompatible && defaultPresetCompatible && outputsCompatible && reasoningCompatible\n'
              '    }\n\n'
          )
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Format and validate CA-1
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply detekt :core:runtime-core:testDebugUnitTest
      - name: Commit CA-1 refactor
        run: |
          git add core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/ConsumerCapabilityPolicy.kt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor(consumer-api): simplify selection validation'
          git push origin HEAD:${{ github.ref_name }}
