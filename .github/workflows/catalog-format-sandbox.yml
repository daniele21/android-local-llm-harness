name: Catalog format sandbox

on:
  push:
    branches:
      - agent/model-catalog-format-sandbox

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/model-catalog-curated-staging
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Apply deterministic Detekt refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              return text[:start_index] + replacement.rstrip() + "\n\n" + text[end_index:]

          codec_path = Path(
              "models/model-catalog/src/main/kotlin/io/github/daniele21/localllm/catalog/CatalogCodec.kt"
          )
          codec = codec_path.read_text()
          codec = replace_between(
              codec,
              "private fun CatalogJsonObject.requiredLong(name: String, path: String): Long {",
              "private fun CatalogJsonObject.optionalLong",
              '''private fun CatalogJsonObject.requiredLong(name: String, path: String): Long {
              val fieldPath = "$path.$name"
              val raw =
                  (requiredValue(name, path) as? CatalogJsonNumber)?.raw
                      ?: throw CatalogMappingException(CatalogCodecErrorCode.INVALID_FIELD_TYPE, fieldPath)
              if (raw.any { it == '.' || it == 'e' || it == 'E' }) invalidCatalogNumber(fieldPath)
              return raw.toLongOrNull() ?: invalidCatalogNumber(fieldPath)
          }

          private fun invalidCatalogNumber(path: String): Nothing =
              throw CatalogMappingException(CatalogCodecErrorCode.INVALID_NUMBER, path)''',
          )
          codec_path.write_text(codec)

          persistence_path = Path(
              "models/model-catalog/src/main/kotlin/io/github/daniele21/localllm/catalog/CatalogPersistence.kt"
          )
          persistence = persistence_path.read_text()
          persistence = replace_between(
              persistence,
              "    private fun readState(): RepositoryState? {",
              "    private fun decodeMetadata",
              '''    private fun readState(): RepositoryState? {
              val file = stateFile()
              if (!file.exists()) return null
              ensureValidState(file.isFile && file.length() <= maxStateBytes)
              val bytes = readBoundedState(file)
              val root = STATE_PARSER.parse(bytes) as? CatalogJsonObject ?: invalidState()
              requireFields(root, STATE_FIELDS)
              val schemaVersion = requiredLong(root, "storageSchemaVersion")
              ensureValidState(schemaVersion == STORAGE_SCHEMA_VERSION.toLong())
              val persistedAt = requiredLong(root, "persistedAtEpochMs")
              ensureValidState(persistedAt >= 0)
              val catalogString = optionalString(root, "catalogJson")
              val document =
                  catalogString?.let { encoded ->
                      when (val decoded = codec.decode(encoded.toByteArray(Charsets.UTF_8))) {
                          is CatalogDecodeResult.Success -> decoded.document
                          is CatalogDecodeResult.Failure -> invalidState()
                      }
                  }
              val metadata = optionalObject(root, "syncMetadata")?.let(::decodeMetadata)
              val failure = optionalObject(root, "lastFailure")?.let(::decodeFailure)
              ensureValidState((document == null) == (metadata == null))
              return RepositoryState(
                  document = document,
                  encodedDocument = catalogString?.toByteArray(Charsets.UTF_8),
                  syncMetadata = metadata,
                  lastFailure = failure,
                  persistedAtEpochMs = persistedAt,
              )
          }

          private fun ensureValidState(valid: Boolean) {
              if (!valid) invalidState()
          }

          private fun invalidState(): Nothing = throw CatalogStateException()''',
          )
          persistence = replace_between(
              persistence,
              "private fun requireFields(value: CatalogJsonObject, expected: Set<String>) {",
              "private fun requiredValue",
              '''private fun requireFields(value: CatalogJsonObject, expected: Set<String>) {
              require(value.fields.keys == expected) { "Unexpected catalog state fields" }
          }''',
          )
          persistence = replace_between(
              persistence,
              "private fun requiredLong(value: CatalogJsonObject, name: String): Long {",
              "private fun optionalObject",
              '''private fun requiredLong(value: CatalogJsonObject, name: String): Long {
              val number = requiredValue(value, name) as? CatalogJsonNumber
              requireNotNull(number) { "Invalid catalog state number" }
              val raw = number.raw
              require(raw.none { it == '.' || it == 'e' || it == 'E' }) {
                  "Invalid catalog state integer"
              }
              return requireNotNull(raw.toLongOrNull()) { "Catalog state integer out of range" }
          }''',
          )
          persistence_path.write_text(persistence)
          PY

      - name: Format and validate curated catalog
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          ./gradlew --no-configuration-cache \
            spotlessCheck \
            detekt \
            verifyNoModelArtifacts \
            :models:model-catalog:compileDebugKotlin \
            :models:model-catalog:compileDebugUnitTestKotlin \
            :models:model-catalog:testDebugUnitTest \
            :models:model-catalog:lintDebug
          git diff --check

      - name: Publish validated staging tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/model-catalog docs/curated-model-catalog.md
          git diff --cached --quiet && exit 0
          git commit -m "style: validate and format curated catalog"
          git push origin HEAD:agent/model-catalog-curated-staging
