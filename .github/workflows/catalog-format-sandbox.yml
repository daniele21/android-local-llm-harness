name: Catalog format sandbox

on:
  push:
    branches:
      - agent/model-catalog-format-sandbox

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/model-catalog-curated-staging
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Format and validate curated catalog
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          ./gradlew --no-configuration-cache \
            spotlessCheck \
            detekt \
            verifyNoModelArtifacts \
            :models:model-catalog:compileDebugKotlin \
            :models:model-catalog:compileDebugUnitTestKotlin \
            :models:model-catalog:testDebugUnitTest \
            :models:model-catalog:lintDebug
          git diff --check

      - name: Publish formatted staging tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatter produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/model-catalog docs/curated-model-catalog.md
          git commit -m "style: apply repository formatter to curated catalog"
          git push origin HEAD:agent/model-catalog-curated-staging
