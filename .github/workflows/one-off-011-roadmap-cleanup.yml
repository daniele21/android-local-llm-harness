name: One-off 0.11 roadmap cleanup

on:
  push:
    branches: [chore/repo-template-0.11.0-product-engineering-final]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/repo-template-0.11.0-product-engineering-final
      - name: Align current roadmap governance wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap.md')
          text = path.read_text()
          old = 'repo-template-sw` `0.10.0` governance baseline with preserved Harnex-specific customizations;'
          new = 'repo-template-sw` `0.11.0` product-engineering governance baseline with preserved Harnex-specific customizations;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one current 0.10.0 roadmap baseline, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/one-off-011-roadmap-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/roadmap.md .github/workflows/one-off-011-roadmap-cleanup.yml
          git commit -m "Align roadmap with product-engineering baseline"
          git push origin HEAD:chore/repo-template-0.11.0-product-engineering-final
