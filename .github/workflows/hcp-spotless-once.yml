name: HCP spotless once

on:
  pull_request:
    branches:
      - dev
    types:
      - reopened

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hcp-n-consumer-control-plane-protocol
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact repository formatting on latest branch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          git fetch origin agent/hcp-n-consumer-control-plane-protocol
          git reset --hard origin/agent/hcp-n-consumer-control-plane-protocol
          ./gradlew --no-configuration-cache spotlessApply
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(hcp): apply repository formatter'
          git fetch origin agent/hcp-n-consumer-control-plane-protocol
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/agent/hcp-n-consumer-control-plane-protocol)" ]]; then
            git rebase origin/agent/hcp-n-consumer-control-plane-protocol
            ./gradlew --no-configuration-cache spotlessApply
            git add -A
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi
          git push origin HEAD:agent/hcp-n-consumer-control-plane-protocol
