name: LLRT-9 B2B2d spotless

on:
  push:
    branches:
      - agent/llrt9-evaluation-batch-engine-adapter-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/llrt9-evaluation-batch-engine-adapter-v1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Apply canonical formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Commit only B2B2d formatting and remove one-shot workflow
        run: |
          rm .github/workflows/llrt9-b2b2d-spotless.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evaluation/runtime-adapter/src/main/kotlin/io/github/daniele21/localllm/evaluation/runtimeadapter/RuntimeEvaluationBatchExecutionAdapter.kt
          git add evaluation/runtime-adapter/src/test/kotlin/io/github/daniele21/localllm/evaluation/runtimeadapter/RuntimeEvaluationBatchExecutionAdapterTest.kt
          git add .github/workflows/llrt9-b2b2d-spotless.yml
          git diff --cached --check
          git commit -m "style(llrt9): apply runtime adapter formatting"
          git push origin HEAD:agent/llrt9-evaluation-batch-engine-adapter-v1
