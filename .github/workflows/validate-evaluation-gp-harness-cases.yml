name: Validate evaluation GP Harness cases

on:
  pull_request:
    paths:
      - "docs/model-evaluation/general-purpose-v1/**"
      - "scripts/validate-general-purpose-harness-cases.py"
      - ".github/workflows/validate-evaluation-gp-harness-cases.yml"
  push:
    branches: [dev]
    paths:
      - "docs/model-evaluation/general-purpose-v1/**"
      - "scripts/validate-general-purpose-harness-cases.py"
      - ".github/workflows/validate-evaluation-gp-harness-cases.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate authored case fragments
        run: python3 scripts/validate-general-purpose-harness-cases.py
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/validate-general-purpose-harness-cases.py
      - name: Validate documentation navigation
        run: |
          python3 scripts/verify-docs.py
          python3 scripts/verify-agent-navigation.py
