name: OMBRA Format Apply

on:
  push:
    branches:
      - agent/ca5-ombra-4b-v2

permissions:
  contents: write

concurrency:
  group: ombra-format-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Apply repository Kotlin formatter
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply

      - name: Commit exact formatted OMB-4 refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/local-llm-console/src/main/kotlin/io/github/daniele21/localllm/console/analysis/OmbraConsumerAnalysisChunkClient.kt \
            apps/local-llm-console/src/main/kotlin/io/github/daniele21/localllm/console/analysis/OmbraConsumerContractPolicy.kt
          if git diff --cached --quiet; then
            echo "No Kotlin formatting changes to commit."
            exit 0
          fi
          git commit -m "style(ombra): apply repository formatter to Consumer refactor"
          git push origin HEAD:agent/ca5-ombra-4b-v2
