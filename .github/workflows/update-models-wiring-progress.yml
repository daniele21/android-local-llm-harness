name: Update Models wiring progress

on:
  push:
    branches: [agent/models-udf-wiring]
    paths:
      - .github/workflows/update-models-wiring-progress.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/models-udf-wiring
          fetch-depth: 1

      - name: Update canonical progress tracker
        run: python3 .github/scripts/update-models-wiring-progress.py

      - name: Remove temporary updater and commit tracker
        run: |
          rm .github/scripts/update-models-wiring-progress.py
          rm .github/workflows/update-models-wiring-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record connected Models UDF wiring"
          git push origin HEAD:agent/models-udf-wiring
