name: HCP16 reopen runner

on:
  pull_request:
    types:
      - reopened

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hcp-i-runtime-session-instrumentation-current
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run implementation script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/hcp16-runtime-telemetry-once.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |') + 1
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:]]
          Path('/tmp/hcp16.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/hcp16.sh
