name: Format model download files

on:
  push:
    branches:
      - agent/model-catalog-persistence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/model-catalog-persistence
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - name: Format downloader sources
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          git rm .github/workflows/format-model-download-files.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format downloader components"
          git push origin HEAD:agent/model-catalog-persistence
