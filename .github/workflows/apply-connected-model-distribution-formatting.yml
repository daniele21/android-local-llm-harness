name: Apply connected model distribution formatting

on:
  push:
    branches: [agent/connected-model-distribution-ui]
    paths:
      - ".github/workflows/apply-connected-model-distribution-formatting.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-connected-model-distribution-formatting
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/connected-model-distribution-ui
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Apply gateway contract fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionController.kt")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "internal interface PhoneModelDownloadGateway {": "internal fun interface PhoneModelDownloadGateway {",
              "internal interface PhoneModelInstallGateway {": "internal fun interface PhoneModelInstallGateway {",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply canonical repository formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace spotlessApply
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/local-llm-phone-test docs/phone-model-distribution.md
          git commit -m "Apply canonical model distribution formatting"
          git push origin HEAD:agent/connected-model-distribution-ui
