name: LLRT-9 B2B2c native ownership refactor

on:
  push:
    branches:
      - agent/llrt9-evaluation-batch-llama-bridge-v1

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/llrt9-evaluation-batch-llama-bridge-v1
          fetch-depth: 0
      - name: Refactor evaluation JNI into private same-TU fragment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cpp_dir = Path('backends/llama-cpp/src/main/cpp')
          entry_path = cpp_dir / 'llama_jni_entrypoint.cpp'
          inc_path = cpp_dir / 'evaluation_batch_jni.inc'
          jni_path = cpp_dir / 'llama_jni.cpp'
          cmake_path = cpp_dir / 'CMakeLists.txt'
          workflow_path = Path('.github/workflows/llrt9-b2b2c-refactor.yml')

          entry = entry_path.read_text()
          marker = '#include "llama_jni.cpp"\n'
          if marker not in entry:
              raise SystemExit('expected llama_jni.cpp implementation include not found')
          entry = entry.replace(marker, '', 1)
          old_preamble = (
              '// LLRT-9B2B2c keeps the existing JNI implementation and evaluation-only\n'
              '// multi-sequence entry points in one translation unit so the evaluation path\n'
              '// can reuse the same resident-model/context ownership registries. The stable\n'
              '// production JNI surface remains implemented in llama_jni.cpp and unchanged.\n'
          )
          entry = entry.replace(
              old_preamble,
              '// LLRT-9B2B2c private implementation fragment. It is included exactly once\n'
              '// from llama_jni.cpp so evaluation batching shares the resident-model and\n'
              '// cancellation registries without exposing them through the public JNI ABI.\n',
              1,
          )
          inc_path.write_text(entry)

          jni = jni_path.read_text()
          include_line = '#include "evaluation_batch_jni.inc"'
          if include_line not in jni:
              jni = jni.rstrip() + (
                  '\n\n// Evaluation-only JNI extension intentionally shares this translation unit\n'
                  '// with the stable JNI implementation so native model residency stays singular.\n'
                  f'{include_line}\n'
              )
              jni_path.write_text(jni)

          cmake = cmake_path.read_text()
          if 'llama_jni_entrypoint.cpp' not in cmake:
              raise SystemExit('expected CMake entrypoint source not found')
          cmake = cmake.replace(
              '    # LLRT-9 evaluation JNI must share the resident-model registries owned by\n'
              '    # llama_jni.cpp. The entrypoint includes that stable implementation and\n'
              '    # appends evaluation-only methods in the same translation unit.\n'
              '    llama_jni_entrypoint.cpp\n',
              '    llama_jni.cpp\n',
              1,
          )
          cmake_path.write_text(cmake)

          entry_path.unlink()
          workflow_path.unlink()
          PY
      - name: Commit refactor and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(llrt9): keep evaluation JNI in resident-model TU"
          git push origin HEAD:agent/llrt9-evaluation-batch-llama-bridge-v1
