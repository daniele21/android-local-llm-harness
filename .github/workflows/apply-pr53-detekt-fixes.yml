name: Apply PR 53 Detekt fixes

on:
  push:
    branches:
      - agent/recover-model-management

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Apply PR 53 Detekt fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/recover-model-management
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Apply structural fixes
        run: python3 scripts/apply_pr53_detekt_fixes.py
      - name: Validate recovered implementation
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache \
            spotlessApply \
            detekt \
            :apps:local-llm-phone-test:testDebugUnitTest \
            :apps:local-llm-phone-test:lintDebug
      - name: Remove temporary migration files
        run: |
          rm scripts/apply_pr53_detekt_fixes.py
          rm .github/workflows/apply-pr53-detekt-fixes.yml
          rm .github/pr53-detekt.trigger
      - name: Commit final recovery fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix model management Detekt findings"
          git push origin HEAD:agent/recover-model-management
