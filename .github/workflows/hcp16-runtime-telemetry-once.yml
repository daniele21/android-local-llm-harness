import io.github.daniele21.localllm.contracts.ApplicationId
import io.github.daniele21.localllm.contracts.ModelDigest
import io.github.daniele21.localllm.contracts.SessionId
import io.github.daniele21.localllm.contracts.SessionKind
import io.github.daniele21.localllm.contracts.UseCaseId
import io.github.daniele21.localllm.observability.InferenceSessionRecord
import io.github.daniele21.localllm.observability.SessionCloseReason
import io.github.daniele21.localllm.observability.SessionRunStatus
import io.github.daniele21.localllm.observability.SessionTelemetryRepository
import org.junit.Assert.assertEquals
import org.junit.Test

class RuntimeSessionTelemetryTest {
    @Test
    fun `records active then explicit client close without content`() {
        val repository = RecordingSessionRepository()
        var now = 10L
        val telemetry = RuntimeSessionTelemetry(repository, EpochClock { now })
        val sessionId = SessionId("session-1")

        telemetry.opened(
            sessionId = sessionId,
            applicationId = ApplicationId("app"),
            useCaseId = UseCaseId("use-case"),
            modelDigest = ModelDigest("a".repeat(64)),
            sessionKind = SessionKind.STATELESS,
        )
        now = 20L
        telemetry.closed(sessionId, SessionCloseReason.CLIENT_REQUEST)

        assertEquals(2, repository.records.size)
        assertEquals(SessionRunStatus.ACTIVE, repository.records.first().status)
        assertEquals(SessionRunStatus.CLOSED, repository.records.last().status)
        assertEquals(SessionCloseReason.CLIENT_REQUEST, repository.records.last().closeReason)
        assertEquals(20L, repository.records.last().closedAtEpochMs)
    }

    @Test
    fun `telemetry repository failures never escape runtime instrumentation`() {
        val telemetry = RuntimeSessionTelemetry(
            repository = object : SessionTelemetryRepository {
                override fun recordSession(session: InferenceSessionRecord) = error("store unavailable")
                override fun recentSessions(limit: Int) = emptyList<InferenceSessionRecord>()
                override fun findSession(sessionId: SessionId): InferenceSessionRecord? = null
            },
            clock = EpochClock { 1L },
        )

        telemetry.opened(
            sessionId = SessionId("session-2"),
            applicationId = ApplicationId("app"),
            useCaseId = UseCaseId("use-case"),
            modelDigest = ModelDigest("b".repeat(64)),
            sessionKind = SessionKind.STATELESS,
        )
        telemetry.closed(SessionId("session-2"), SessionCloseReason.RUNTIME_FAILURE)
    }

    private class RecordingSessionRepository : SessionTelemetryRepository {
        val records = mutableListOf<InferenceSessionRecord>()
        override fun recordSession(session: InferenceSessionRecord) { records += session }
        override fun recentSessions(limit: Int): List<InferenceSessionRecord> = records.takeLast(limit).reversed()
        override fun findSession(sessionId: SessionId): InferenceSessionRecord? = records.lastOrNull { it.sessionId == sessionId }
    }
}
''')
