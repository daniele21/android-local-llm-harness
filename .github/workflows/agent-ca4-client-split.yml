name: Agent CA-4 client split
on:
  push:
    branches: [agent/ca4-binder-integration]
permissions:
  contents: write
jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ca4-binder-integration
      - name: Apply client split
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('transports/android-binder-client/src/main/kotlin/io/github/daniele21/localllm/transport/binder/client/AidlSharedRuntimeRemoteService.kt')
          s = p.read_text()
          s = s.replace('import io.github.daniele21.localllm.transport.binder.contract.IConsumerGenerationCallback\n', 'import io.github.daniele21.localllm.transport.binder.contract.IConsumerGenerationCallback\nimport io.github.daniele21.localllm.transport.binder.contract.IConsumerLocalLlmService\n')
          marker = 'internal class AidlSharedRuntimeRemoteService(private val delegate: ILocalLlmService) : SharedRuntimeRemoteService {\n'
          s = s.replace(marker, marker + '    override val consumer: ConsumerSharedRuntimeRemoteService =\n        AidlConsumerSharedRuntimeRemoteService(delegate.consumerApi)\n\n')
          start = s.index('    override fun consumerCapabilities')
          unregister = s.index('    override fun unregisterClient')
          unregister_end = s.index('\n', unregister) + 1
          legacy_tail = s[unregister:unregister_end]
          helper = '''}\n\nprivate class AidlConsumerSharedRuntimeRemoteService(\n    private val delegate: IConsumerLocalLlmService,\n) : ConsumerSharedRuntimeRemoteService {\n    override fun capabilities(request: ConsumerRequestParcel, callback: (ConsumerResultParcel) -> Unit) {\n        delegate.capabilities(request, resultCallback(callback))\n    }\n\n    override fun prepare(request: ConsumerRequestParcel, callback: (ConsumerResultParcel) -> Unit) {\n        delegate.prepare(request, resultCallback(callback))\n    }\n\n    override fun openSession(request: ConsumerRequestParcel, callback: (ConsumerResultParcel) -> Unit) {\n        delegate.openSession(request, resultCallback(callback))\n    }\n\n    override fun generate(request: ConsumerRequestParcel, callback: (ConsumerGenerationEventParcel) -> Unit) {\n        delegate.generate(request, object : IConsumerGenerationCallback.Stub() {\n            override fun onEvent(event: ConsumerGenerationEventParcel) = callback(event)\n        })\n    }\n\n    override fun cancel(request: CancelRequestParcel) = delegate.cancel(request)\n    override fun closeSession(request: CloseSessionRequestParcel) = delegate.closeSession(request)\n\n    private fun resultCallback(callback: (ConsumerResultParcel) -> Unit): IConsumerResultCallback =\n        object : IConsumerResultCallback.Stub() {\n            override fun onResult(result: ConsumerResultParcel) = callback(result)\n        }\n}\n'''
          p.write_text(s[:start] + legacy_tail + helper)

          p = Path('transports/android-binder-client/src/test/kotlin/io/github/daniele21/localllm/transport/binder/client/FakeSharedRuntimeRemoteService.kt')
          s = p.read_text()
          marker = ') : SharedRuntimeRemoteService {\n'
          s = s.replace(marker, marker + '    override val consumer: ConsumerSharedRuntimeRemoteService = FakeConsumerRemoteService(this)\n\n', 1)
          for name in ['consumerCapabilities', 'consumerPrepare', 'consumerOpenSession', 'consumerGenerate', 'consumerCancel', 'consumerCloseSession']:
              s = s.replace('    override fun ' + name, '    fun ' + name)
          insert = s.index('\ninternal class FakeEndpointInvalidations')
          helper = '''\nprivate class FakeConsumerRemoteService(\n    private val parent: FakeSharedRuntimeRemoteService,\n) : ConsumerSharedRuntimeRemoteService {\n    override fun capabilities(request: ConsumerRequestParcel, callback: (ConsumerResultParcel) -> Unit) = parent.consumerCapabilities(request, callback)\n    override fun prepare(request: ConsumerRequestParcel, callback: (ConsumerResultParcel) -> Unit) = parent.consumerPrepare(request, callback)\n    override fun openSession(request: ConsumerRequestParcel, callback: (ConsumerResultParcel) -> Unit) = parent.consumerOpenSession(request, callback)\n    override fun generate(request: ConsumerRequestParcel, callback: (ConsumerGenerationEventParcel) -> Unit) = parent.consumerGenerate(request, callback)\n    override fun cancel(request: CancelRequestParcel) = parent.consumerCancel(request)\n    override fun closeSession(request: CloseSessionRequestParcel) = parent.consumerCloseSession(request)\n}\n'''
          p.write_text(s[:insert] + helper + s[insert:])
          PY
          rm -f .github/workflows/agent-ca4-client-split.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: split CA-4 client adapter' || true
          git push
