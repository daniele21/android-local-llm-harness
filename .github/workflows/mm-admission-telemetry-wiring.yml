name: Apply memory admission telemetry wiring

on:
  push:
    branches:
      - agent/mm-admission-telemetry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mm-admission-telemetry
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply scoped admission telemetry wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/RuntimeOrchestrator.kt')
          text = path.read_text()

          context_function = '    private fun resolveMemoryAwareContextSize(session: SessionDescriptor, contextPlan: ContextPlanningResult): Int {'
          context_next = '    private fun memoryAdmissionFailureMessage('
          assert text.count(context_function) == 1 and text.count(context_next) == 1, 'context admission scope changed'
          scope_start = text.index(context_function)
          scope_end = text.index(context_next, scope_start)
          scope = text[scope_start:scope_end]
          decision_start = scope.index('        return when (decision) {')
          decision_end_marker = '\n    }\n\n'
          decision_end = scope.index(decision_end_marker, decision_start) + len('\n    }')
          context_new = '''        return when (decision) {
              is MemoryAwareContextDecision.Allow -> {
                  runtimeTelemetry.memoryAdmission(
                      resource = MemoryAdmissionResource.CONTEXT,
                      outcome = if (decision.downshifted) MemoryAdmissionOutcome.DOWNSHIFT else MemoryAdmissionOutcome.ALLOW,
                      estimate = decision.estimate,
                      requestedContextTokens = contextPlan.requestedContextTokens,
                      effectiveContextTokens = decision.contextTokens,
                  )
                  decision.contextTokens
              }

              is MemoryAwareContextDecision.Reject -> {
                  runtimeTelemetry.memoryAdmission(
                      resource = MemoryAdmissionResource.CONTEXT,
                      outcome = MemoryAdmissionOutcome.REJECT,
                      decisionReason = decision.reason.name,
                      admissionReason = decision.admissionReason,
                      requestedContextTokens = contextPlan.requestedContextTokens,
                  )
                  throw GenerationPlanningException(
                      ConfigurationErrorCode.MEMORY_BUDGET_EXCEEDED,
                      memoryAdmissionFailureMessage(contextPlan, decision),
                  )
              }
          }'''.replace('              ', '    ')
          scope = scope[:decision_start] + context_new + scope[decision_end:]
          text = text[:scope_start] + scope + text[scope_end:]

          model_function = '    private fun admitModelLoad(resolved: ResolvedUseCase, schedulerSnapshot: DecodeSchedulerSnapshot) {'
          model_next = '    private fun validateRuntimeCapabilities('
          assert text.count(model_function) == 1 and text.count(model_next) == 1, 'model admission scope changed'
          scope_start = text.index(model_function)
          scope_end = text.index(model_next, scope_start)
          scope = text[scope_start:scope_end]
          decision_start = scope.index('        if (decision is MemoryAwareModelLoadDecision.Reject) {')
          decision_end = scope.index('\n    }\n\n', decision_start) + len('\n    }')
          model_new = '''        when (decision) {
              is MemoryAwareModelLoadDecision.Allow -> runtimeTelemetry.memoryAdmission(
                  resource = MemoryAdmissionResource.MODEL,
                  outcome = MemoryAdmissionOutcome.ALLOW,
                  estimate = decision.estimate,
              )

              is MemoryAwareModelLoadDecision.Reject -> {
                  runtimeTelemetry.memoryAdmission(
                      resource = MemoryAdmissionResource.MODEL,
                      outcome = MemoryAdmissionOutcome.REJECT,
                      decisionReason = decision.reason.name,
                      admissionReason = decision.admissionReason,
                  )
                  throw ModelLoadMemoryAdmissionException(resolved.model.id, decision)
              }
          }'''.replace('              ', '    ')
          scope = scope[:decision_start] + model_new + scope[decision_end:]
          text = text[:scope_start] + scope + text[scope_end:]

          path.write_text(text)
          PY
      - name: Apply canonical Kotlin formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Remove branch-scoped patch workflow
        run: git rm .github/workflows/mm-admission-telemetry-wiring.yml
      - name: Commit telemetry wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- core/runtime-core .github/workflows
          git commit -m 'feat(runtime): wire memory admission telemetry'
          git push origin HEAD:agent/mm-admission-telemetry
