name: Apply memory admission telemetry wiring

on:
  push:
    branches:
      - agent/mm-admission-telemetry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mm-admission-telemetry
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Replace admission functions with telemetry-aware versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/RuntimeOrchestrator.kt')
          text = path.read_text()

          context_start_marker = '    private fun resolveMemoryAwareContextSize(session: SessionDescriptor, contextPlan: ContextPlanningResult): Int {'
          context_end_marker = '    private fun memoryAdmissionFailureMessage('
          assert text.count(context_start_marker) == 1 and text.count(context_end_marker) == 1, 'context function boundary changed'
          context_start = text.index(context_start_marker)
          context_end = text.index(context_end_marker, context_start)
          context_new = (
              '    private fun resolveMemoryAwareContextSize(session: SessionDescriptor, contextPlan: ContextPlanningResult): Int {\n'
              '        val planner = memoryAwareContextPlanner ?: return contextPlan.requestedContextTokens\n'
              '        val schedulerSnapshot = scheduler.snapshot()\n'
              '        val decision = planner.plan(\n'
              '            MemoryAwareContextRequest(\n'
              '                modelProfileId = session.resolved.model.id,\n'
              '                requestedContextTokens = contextPlan.requestedContextTokens,\n'
              '                minimumContextTokens = contextPlan.minimumRequiredTokens,\n'
              '                approvedContextTiers = contextPlan.memoryEligibleContextTiers,\n'
              '                residency = RuntimeResidencySnapshot(\n'
              '                    modelLoaded = loadedModel != null,\n'
              '                    residentContexts = sessions.values.count { it.context != null },\n'
              '                    activeGeneration = schedulerSnapshot.activeRequest != null,\n'
              '                    queuedGenerations = schedulerSnapshot.queuedRequests,\n'
              '                ),\n'
              '            ),\n'
              '        )\n'
              '        return when (decision) {\n'
              '            is MemoryAwareContextDecision.Allow -> {\n'
              '                runtimeTelemetry.memoryAdmission(\n'
              '                    resource = MemoryAdmissionResource.CONTEXT,\n'
              '                    outcome = if (decision.downshifted) MemoryAdmissionOutcome.DOWNSHIFT else MemoryAdmissionOutcome.ALLOW,\n'
              '                    estimate = decision.estimate,\n'
              '                    requestedContextTokens = contextPlan.requestedContextTokens,\n'
              '                    effectiveContextTokens = decision.contextTokens,\n'
              '                )\n'
              '                decision.contextTokens\n'
              '            }\n'
              '\n'
              '            is MemoryAwareContextDecision.Reject -> {\n'
              '                runtimeTelemetry.memoryAdmission(\n'
              '                    resource = MemoryAdmissionResource.CONTEXT,\n'
              '                    outcome = MemoryAdmissionOutcome.REJECT,\n'
              '                    decisionReason = decision.reason.name,\n'
              '                    admissionReason = decision.admissionReason,\n'
              '                    requestedContextTokens = contextPlan.requestedContextTokens,\n'
              '                )\n'
              '                throw GenerationPlanningException(\n'
              '                    ConfigurationErrorCode.MEMORY_BUDGET_EXCEEDED,\n'
              '                    memoryAdmissionFailureMessage(contextPlan, decision),\n'
              '                )\n'
              '            }\n'
              '        }\n'
              '    }\n\n'
          )
          text = text[:context_start] + context_new + text[context_end:]

          model_start_marker = '    private fun admitModelLoad(resolved: ResolvedUseCase, schedulerSnapshot: DecodeSchedulerSnapshot) {'
          model_end_marker = '    private fun validateRuntimeCapabilities('
          assert text.count(model_start_marker) == 1 and text.count(model_end_marker) == 1, 'model function boundary changed'
          model_start = text.index(model_start_marker)
          model_end = text.index(model_end_marker, model_start)
          model_new = (
              '    private fun admitModelLoad(resolved: ResolvedUseCase, schedulerSnapshot: DecodeSchedulerSnapshot) {\n'
              '        val planner = memoryAwareModelLoadPlanner ?: return\n'
              '        val decision = planner.plan(\n'
              '            MemoryAwareModelLoadRequest(\n'
              '                modelProfileId = resolved.model.id,\n'
              '                residency = RuntimeResidencySnapshot(\n'
              '                    modelLoaded = false,\n'
              '                    residentContexts = 0,\n'
              '                    activeGeneration = schedulerSnapshot.activeRequest != null,\n'
              '                    queuedGenerations = schedulerSnapshot.queuedRequests,\n'
              '                ),\n'
              '            ),\n'
              '        )\n'
              '        when (decision) {\n'
              '            is MemoryAwareModelLoadDecision.Allow -> runtimeTelemetry.memoryAdmission(\n'
              '                resource = MemoryAdmissionResource.MODEL,\n'
              '                outcome = MemoryAdmissionOutcome.ALLOW,\n'
              '                estimate = decision.estimate,\n'
              '            )\n'
              '\n'
              '            is MemoryAwareModelLoadDecision.Reject -> {\n'
              '                runtimeTelemetry.memoryAdmission(\n'
              '                    resource = MemoryAdmissionResource.MODEL,\n'
              '                    outcome = MemoryAdmissionOutcome.REJECT,\n'
              '                    decisionReason = decision.reason.name,\n'
              '                    admissionReason = decision.admissionReason,\n'
              '                )\n'
              '                throw ModelLoadMemoryAdmissionException(resolved.model.id, decision)\n'
              '            }\n'
              '        }\n'
              '    }\n\n'
          )
          text = text[:model_start] + model_new + text[model_end:]
          path.write_text(text)
          PY
      - name: Apply canonical Kotlin formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Remove branch-scoped patch workflow
        run: git rm .github/workflows/mm-admission-telemetry-wiring.yml
      - name: Commit telemetry wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- core/runtime-core .github/workflows
          git commit -m 'feat(runtime): wire memory admission telemetry'
          git push origin HEAD:agent/mm-admission-telemetry
