name: Remove legacy playground response once

on:
  push:
    branches: [dev]
    paths:
      - "scripts/remove-legacy-playground-response-once.py"
      - ".github/workflows/remove-legacy-playground-response-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Remove legacy response renderer
        run: python3 scripts/remove-legacy-playground-response-once.py

      - name: Commit focused source cleanup
        shell: bash
        run: |
          set -euo pipefail
          target="apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/MainActivity.kt"
          if git diff --quiet -- "$target"; then
            echo "No source cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "refactor: remove legacy playground response renderer"
          git push origin HEAD:dev
