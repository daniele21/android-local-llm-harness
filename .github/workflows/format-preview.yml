name: Format preview

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply Spotless and archive formatted sources
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace spotlessApply
          tar -czf formatted-health-sources.tar.gz \
            observability/contracts/src/main/kotlin/io/github/daniele21/localllm/observability/Health.kt \
            observability/health-engine/src/main/kotlin/io/github/daniele21/localllm/observability/health/HealthEngine.kt \
            observability/health-engine/src/main/kotlin/io/github/daniele21/localllm/observability/health/ModelIntegrityChecker.kt \
            observability/health-engine/src/main/kotlin/io/github/daniele21/localllm/observability/health/SanitySuiteRunner.kt \
            observability/health-engine/src/main/kotlin/io/github/daniele21/localllm/observability/health/LocalLlmSanityExecutor.kt \
            observability/health-engine/src/test/kotlin/io/github/daniele21/localllm/observability/health/HealthEngineTest.kt \
            observability/health-engine/src/test/kotlin/io/github/daniele21/localllm/observability/health/LocalLlmSanityExecutorTest.kt

      - uses: actions/upload-artifact@v4
        with:
          name: formatted-health-sources
          path: formatted-health-sources.tar.gz
