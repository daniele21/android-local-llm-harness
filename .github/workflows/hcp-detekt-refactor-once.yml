name: HCP structural refactor once

on:
  pull_request:
    branches:
      - dev
    types:
      - reopened

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hcp-n-consumer-control-plane-protocol
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Refactor HCP transport boundaries
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/hcp-n-consumer-control-plane-protocol
          git reset --hard origin/agent/hcp-n-consumer-control-plane-protocol
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          # AIDL consumer adapter: callback construction is a transport helper, not service behavior.
          p = 'transports/android-binder-client/src/main/kotlin/io/github/daniele21/localllm/transport/binder/client/AidlSharedRuntimeRemoteService.kt'
          s = read(p)
          old = '''    private fun resultCallback(callback: (ConsumerResultParcel) -> Unit): IConsumerResultCallback =
                  object : IConsumerResultCallback.Stub() {
                      override fun onResult(result: ConsumerResultParcel) = callback(result)
                  }
          
              private fun controlPlaneResultCallback(callback: (ConsumerControlPlaneResultParcel) -> Unit): IConsumerControlPlaneResultCallback =
                  object : IConsumerControlPlaneResultCallback.Stub() {
                      override fun onResult(result: ConsumerControlPlaneResultParcel) = callback(result)
                  }
          }'''
          new = '''}
          
          private fun resultCallback(callback: (ConsumerResultParcel) -> Unit): IConsumerResultCallback =
              object : IConsumerResultCallback.Stub() {
                  override fun onResult(result: ConsumerResultParcel) = callback(result)
              }
          
          private fun controlPlaneResultCallback(callback: (ConsumerControlPlaneResultParcel) -> Unit): IConsumerControlPlaneResultCallback =
              object : IConsumerControlPlaneResultCallback.Stub() {
                  override fun onResult(result: ConsumerControlPlaneResultParcel) = callback(result)
              }'''
          if old not in s:
              raise SystemExit('AIDL helper block not found')
          write(p, s.replace(old, new))

          # Public client: open-state validation belongs to the atomic lifecycle state helper.
          p = 'transports/android-binder-client/src/main/kotlin/io/github/daniele21/localllm/transport/binder/client/BinderConsumerLocalLlmClient.kt'
          s = read(p)
          helper = '''    private fun checkOpen() {
                  check(!closed.get()) { "Shared-runtime consumer client is closed" }
              }
          
          '''
          if helper not in s:
              raise SystemExit('client checkOpen block not found')
          s = s.replace(helper, '')
          s = s.replace('checkOpen()', 'closed.requireOpen()')
          s += '''\nprivate fun AtomicBoolean.requireOpen() {\n    check(!get()) { "Shared-runtime consumer client is closed" }\n}\n'''
          write(p, s)

          # Binder stub: caller authorization/rejection helpers are edge helpers, not Binder transactions.
          p = 'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConsumerRuntimeBinderStub.kt'
          s = read(p)
          s = s.replace('withResultCaller(request, callback)', 'withResultCaller(authorizer, callingProcessSource, request, callback)')
          s = s.replace('withControlPlaneCaller(request, callback)', 'withControlPlaneCaller(authorizer, callingProcessSource, request, callback)')
          s = s.replace('authorizedCallerOrNull()', 'authorizedCallerOrNull(authorizer, callingProcessSource)')
          marker = '    private inline fun withResultCaller('
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('binder helper block not found')
          prefix = s[:idx] + '}\n\n'
          helpers = '''private inline fun withResultCaller(
              authorizer: CallerAuthorizer,
              callingProcessSource: CallingProcessSource,
              request: ConsumerRequestParcel,
              callback: IConsumerResultCallback,
              block: (AuthorizedCaller) -> Unit,
          ) {
              val caller = authorizedCallerOrNull(authorizer, callingProcessSource)
              if (caller == null) {
                  deliverRemote {
                      callback.onResult(
                          ConsumerResultParcel(
                              operationId = request.operationId,
                              error = wireError(WireErrorCodes.CLIENT_NOT_REGISTERED),
                          ),
                      )
                  }
              } else {
                  block(caller)
              }
          }
          
          private inline fun withControlPlaneCaller(
              authorizer: CallerAuthorizer,
              callingProcessSource: CallingProcessSource,
              request: ConsumerControlPlaneRequestParcel,
              callback: IConsumerControlPlaneResultCallback,
              block: (AuthorizedCaller) -> Unit,
          ) {
              val caller = authorizedCallerOrNull(authorizer, callingProcessSource)
              if (caller == null) {
                  deliverRemote {
                      callback.onResult(
                          ConsumerControlPlaneResultParcel(
                              operationId = request.operationId,
                              error = wireError(WireErrorCodes.CLIENT_NOT_REGISTERED),
                          ),
                      )
                  }
              } else {
                  block(caller)
              }
          }
          
          private fun authorizedCallerOrNull(
              authorizer: CallerAuthorizer,
              callingProcessSource: CallingProcessSource,
          ): AuthorizedCaller? = when (val result = authorizer.authorize(callingProcessSource.current())) {
              is AuthorizationResult.Allowed -> result.caller
              is AuthorizationResult.Denied -> null
          }
          '''
          write(p, prefix + helpers)

          # Control-plane operations: keep stateful submission in the class; move pure wire parsing/errors out.
          p = 'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConsumerControlPlaneHostOperations.kt'
          s = read(p)
          marker = '    private fun ConsumerControlPlaneRequestParcel.toCoreActivationRequestOrNull()'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('control-plane pure helper block not found')
          s = s[:idx] + '}\n\n' + '''private fun ConsumerControlPlaneRequestParcel.toCoreActivationRequestOrNull(): ConsumerActivationRequest? {
              val useCase = useCaseId?.takeIf(String::isNotBlank)
              val useCaseRevisionValue = useCaseRevision?.takeIf { it > 0 }
              val bindingRevisionValue = bindingRevision?.takeIf { it > 0 }
              val presetValue = preset
              val valid = useCase != null && useCaseRevisionValue != null && bindingRevisionValue != null &&
                  presetValue != null && presetValue.id.isNotBlank() && presetValue.version > 0
              return if (!valid) {
                  null
              } else {
                  ConsumerActivationRequest(
                      useCaseId = UseCaseId(requireNotNull(useCase)),
                      useCaseRevision = requireNotNull(useCaseRevisionValue),
                      bindingRevision = requireNotNull(bindingRevisionValue),
                      preset = InferencePresetRef(InferencePresetId(requireNotNull(presetValue).id), presetValue.version),
                  )
              }
          }
          
          private fun unauthorizedPresetDiscovery(request: ConsumerControlPlaneRequestParcel): ConsumerControlPlaneResultParcel =
              ConsumerPublishedPresetsResult.Rejected(unauthorizedUseCaseFailure())
                  .toConsumerControlPlaneWire(request.operationId)
          
          private fun unauthorizedActivation(request: ConsumerControlPlaneRequestParcel): ConsumerControlPlaneResultParcel =
              ConsumerActivationResult.Rejected(unauthorizedUseCaseFailure())
                  .toConsumerControlPlaneWire(request.operationId)
          
          private fun unauthorizedUseCaseFailure() = ConsumerControlPlaneFailure(
              ConsumerControlPlaneErrorCode.USE_CASE_NOT_ASSIGNED,
              "Use case is not assigned",
          )
          
          private fun invalidRequest(request: ConsumerControlPlaneRequestParcel) = failure(request, WireErrorCodes.INVALID_WIRE_REQUEST)
          
          private fun failure(request: ConsumerControlPlaneRequestParcel, code: String) = ConsumerControlPlaneResultParcel(
              operationId = request.operationId,
              error = wireError(code),
          )
          '''
          write(p, s)

          # Wire mapping: split operation mapping from domain/error mapping.
          p = 'transports/android-binder-contract/src/main/kotlin/io/github/daniele21/localllm/transport/binder/contract/ConsumerControlPlaneWireMapping.kt'
          s = read(p)
          marker = 'private fun ConsumerAssignedUseCase.toWire()'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('wire mapping split point not found')
          domain_tail = s[idx:]
          write(p, s[:idx].rstrip() + '\n')
          domain_imports = '''package io.github.daniele21.localllm.transport.binder.contract
          
          import io.github.daniele21.localllm.contracts.ConsumerActivation
          import io.github.daniele21.localllm.contracts.ConsumerActivationId
          import io.github.daniele21.localllm.contracts.ConsumerAssignedUseCase
          import io.github.daniele21.localllm.contracts.ConsumerControlPlaneErrorCode
          import io.github.daniele21.localllm.contracts.ConsumerControlPlaneFailure
          import io.github.daniele21.localllm.contracts.ConsumerPublishedPreset
          import io.github.daniele21.localllm.contracts.InferencePresetId
          import io.github.daniele21.localllm.contracts.InferencePresetRef
          import io.github.daniele21.localllm.contracts.UseCaseId
          
          '''
          write(p.replace('ConsumerControlPlaneWireMapping.kt', 'ConsumerControlPlaneDomainWireMapping.kt'), domain_imports + domain_tail)

          # Runtime graph: activation binding lifecycle gets its own cohesive controller.
          p = 'apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessRuntimeGraph.kt'
          s = read(p)
          s = s.replace(
              '    val activationResidency = ActivationResidencyCoordinator(activationLeases)\n',
              '    val activationResidency = ActivationResidencyCoordinator(activationLeases)\n    val activationBindings = HarnessActivationBindingController(registry)\n',
          )
          block = '''    fun installActivationBinding(
                  activationId: UseCaseActivationId,
                  applicationId: ApplicationId,
                  useCaseId: UseCaseId,
                  resolved: ResolvedUseCase,
              ) {
                  registry.installActivationBinding(activationId, applicationId, useCaseId, resolved)
              }
          
              fun removeActivationBinding(activationId: UseCaseActivationId) {
                  registry.removeActivationBinding(activationId)
              }
          
          '''
          if block not in s:
              raise SystemExit('runtime graph activation wrapper block not found')
          s = s.replace(block, '')
          insert = '''
          internal class HarnessActivationBindingController(private val registry: HarnessPhoneBindingRegistry) {
              fun install(
                  activationId: UseCaseActivationId,
                  applicationId: ApplicationId,
                  useCaseId: UseCaseId,
                  resolved: ResolvedUseCase,
              ) = registry.installActivationBinding(activationId, applicationId, useCaseId, resolved)
          
              fun remove(activationId: UseCaseActivationId) = registry.removeActivationBinding(activationId)
          }
          
          '''
          s = s.replace('\ninternal enum class HarnessRuntimePurpose', insert + 'internal enum class HarnessRuntimePurpose')
          write(p, s)

          # Consumer host: remove runtime-graph wrappers and keep catalog/bootstrap helpers outside the coordinator.
          p = 'apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessConsumerControlPlaneHost.kt'
          s = read(p)
          s = s.replace('runtimeGraph.removeActivationBinding(', 'runtimeGraph.activationBindings.remove(')
          s = s.replace('runtimeGraph.installActivationBinding(', 'runtimeGraph.activationBindings.install(')
          s = s.replace('executionEnvironment(applicationId)', 'controlPlaneExecutionEnvironment(modelStore, applicationId)')
          s = s.replace('importedModel(installed.digest, installed.sizeBytes)', 'importedPhoneModel(installed.digest, installed.sizeBytes)')
          start = s.find('    override fun activate(ownerId: String, applicationId: ApplicationId, request: ConsumerActivationRequest): ConsumerActivationResult {')
          end = s.find('\n    override fun deactivate(', start)
          if start < 0 or end < 0:
              raise SystemExit('activate method boundaries not found')
          activate = '''    override fun activate(ownerId: String, applicationId: ApplicationId, request: ConsumerActivationRequest): ConsumerActivationResult {
              ensureSeeded()
              val resolution = resolver.resolve(
                  HostExecutionRequest(
                      applicationId = applicationId,
                      useCaseId = request.useCaseId,
                      presetId = request.preset.id.value,
                      presetRevision = request.preset.version,
                  ),
                  controlPlaneExecutionEnvironment(modelStore, applicationId),
              )
              val execution = (resolution as? HostExecutionResolution.Success)?.execution
              val resolutionFailure = when {
                  resolution is HostExecutionResolution.Failure -> ConsumerActivationResult.Rejected(
                      resolution.code.toConsumerFailure(),
                  )
                  execution == null -> ConsumerActivationResult.Rejected(
                      failure(ConsumerControlPlaneErrorCode.RUNTIME_FAILURE, "Unable to resolve consumer execution"),
                  )
                  execution.useCaseRevision != request.useCaseRevision || execution.bindingRevision != request.bindingRevision ->
                      ConsumerActivationResult.Rejected(
                          failure(ConsumerControlPlaneErrorCode.STALE_REVISION, "Consumer configuration changed; refresh assignments"),
                      )
                  else -> null
              }
              if (resolutionFailure != null) return resolutionFailure
          
              val resolvedExecution = requireNotNull(execution)
              val installed = modelStore.find(resolvedExecution.modelDigest)?.takeIf { it.verified }
              val imported = installed?.let { importedPhoneModel(it.digest, it.sizeBytes) }
              val runtimeResolved = imported?.let { HarnessSharedRuntimeBindings.resolveOmbra(it, applicationId) }
              val modelFailure = when {
                  installed == null -> ConsumerActivationResult.Rejected(
                      failure(ConsumerControlPlaneErrorCode.MODEL_UNAVAILABLE, "Required local model is unavailable"),
                  )
                  imported == null -> ConsumerActivationResult.Rejected(
                      failure(ConsumerControlPlaneErrorCode.MODEL_UNAVAILABLE, "Required local model is unsupported"),
                  )
                  runtimeResolved == null || runtimeResolved.model.artifact.digest != resolvedExecution.modelDigest ->
                      ConsumerActivationResult.Rejected(
                          failure(ConsumerControlPlaneErrorCode.RUNTIME_FAILURE, "Resolved model identity mismatch"),
                      )
                  else -> null
              }
              if (modelFailure != null) return modelFailure
          
              val acquired = runtimeGraph.activationResidency.acquireExclusiveUseCase(
                  request = UseCaseActivationRequest(
                      ownerId = ActivationOwnerId(ownerId),
                      applicationId = applicationId,
                      useCaseId = request.useCaseId,
                      preset = request.preset,
                      modelDigest = resolvedExecution.modelDigest,
                      acquiredAtEpochMs = epochClock(),
                      useCaseRevision = resolvedExecution.useCaseRevision,
                      bindingRevision = resolvedExecution.bindingRevision,
                  ),
                  retainModelWarmMs = resolvedExecution.cachePolicy.retainModelWarmMs,
              )
              return when (acquired) {
                  is ActivationResidencyResult.Failure -> ConsumerActivationResult.Rejected(acquired.toConsumerFailure())
                  is ActivationResidencyResult.Success ->
                      activateRuntimeBinding(acquired.value, applicationId, request, requireNotNull(runtimeResolved))
              }
          }
          '''
          s = s[:start] + activate + s[end:]

          # Move catalog/environment/seed constructors out of the class.
          helper_start = s.find('    private fun executionEnvironment(')
          helper_end = s.find('    private companion object {', helper_start)
          if helper_start < 0:
              helper_start = s.find('    private fun controlPlaneExecutionEnvironment(')
          if helper_start < 0 or helper_end < 0:
              raise SystemExit('consumer host helper region not found')
          s = s[:helper_start] + s[helper_end:]
          insert_at = s.find('\nprivate fun AssignedUseCaseDiscoveryFailure')
          if insert_at < 0:
              raise SystemExit('consumer mapping insert point not found')
          helpers = '''
          private fun controlPlaneExecutionEnvironment(modelStore: ModelStore, applicationId: ApplicationId): HostExecutionEnvironment {
              val installed = modelStore.snapshot().entries.filter { it.verified }
              val profiles = installed.mapNotNull { stored ->
                  importedPhoneModel(stored.digest, stored.sizeBytes)?.let { model ->
                      runCatching { HarnessSharedRuntimeBindings.resolveOmbra(model, applicationId).model }.getOrNull()
                  }
              }
              return HostExecutionEnvironment(
                  modelProfiles = profiles,
                  installedModelDigests = installed.map { it.digest }.toSet(),
                  backendId = LLAMA_CPP_BACKEND_ID,
                  backendRevision = Qwen35RuntimeTuningProfiles.LLAMA_CPP_REVISION,
              )
          }
          
          private fun importedPhoneModel(digest: ModelDigest, sizeBytes: Long): ImportedPhoneModel? {
              val release = CuratedModelCatalog.releases.singleOrNull { candidate ->
                  candidate.artifact.digest == digest && candidate.artifact.sizeBytes == sizeBytes
              }
              return release?.let {
                  ImportedPhoneModel(
                      digest = digest,
                      fileName = it.artifact.fileName,
                      sizeBytes = sizeBytes,
                      architecture = it.artifact.architecture,
                      quantization = it.artifact.quantization,
                  )
              }
          }
          
          private fun seedUseCase() = UseCaseDefinition(
              useCaseId = HarnessSharedRuntimeBindings.ombraUseCaseId,
              displayName = "Document PII detection",
              description = "Detect configured PII locally from document text",
              requirements = UseCaseRequirements(
                  outputMode = OutputMode.JSON_SCHEMA,
                  sessionKind = SessionKind.STATELESS,
                  reasoningSupported = false,
                  minimumContextTokens = OMBRA_MINIMUM_CONTEXT_TOKENS,
                  maxInputCharacters = OMBRA_MAX_INPUT_CHARACTERS,
                  maxJsonSchemaCharacters = OMBRA_MAX_SCHEMA_CHARACTERS,
              ),
              state = UseCaseDefinitionState.ACTIVE,
              revision = SEED_REVISION,
          )
          
          private fun seedPreset() = UseCasePresetDefinition(
              useCaseId = HarnessSharedRuntimeBindings.ombraUseCaseId,
              metadata = PresetConsumerMetadata(
                  presetId = HarnessSharedRuntimeBindings.ombraDefaultPreset.id.value,
                  revision = HarnessSharedRuntimeBindings.ombraDefaultPreset.version,
                  displayName = "Balanced local PII",
                  description = "Automatic local Qwen3.5 selection for structured PII detection",
              ),
              creationSource = PresetCreationSource.SUGGESTED,
              state = PresetLifecycleState.PUBLISHED,
              execution = PresetExecutionPolicy(
                  modelProfileId = null,
                  inferencePreset = HarnessSharedRuntimeBindings.ombraDefaultPreset,
                  contextTokens = OMBRA_MINIMUM_CONTEXT_TOKENS,
                  cachePolicy = UseCaseCachePolicy(
                      retainModelWarmMs = MIGRATION_WARM_RETENTION_MS,
                      reuseStatelessContext = false,
                      enablePrefixSnapshot = false,
                      enableDeterministicResultCache = false,
                  ),
              ),
          )
          
          '''
          s = s[:insert_at] + helpers + s[insert_at:]
          # Constants are now used by top-level helpers; move them out of the private companion.
          s = s.replace('    private companion object {\n        const val SEED_REVISION = 1\n        const val OMBRA_MINIMUM_CONTEXT_TOKENS = 4_096\n        const val OMBRA_MAX_INPUT_CHARACTERS = 12_000\n        const val OMBRA_MAX_SCHEMA_CHARACTERS = 4_096\n        const val MIGRATION_WARM_RETENTION_MS = 60_000L\n        const val LLAMA_CPP_BACKEND_ID = "llama.cpp"\n    }\n', '')
          constants = '''\nprivate const val SEED_REVISION = 1\nprivate const val OMBRA_MINIMUM_CONTEXT_TOKENS = 4_096\nprivate const val OMBRA_MAX_INPUT_CHARACTERS = 12_000\nprivate const val OMBRA_MAX_SCHEMA_CHARACTERS = 4_096\nprivate const val MIGRATION_WARM_RETENTION_MS = 60_000L\nprivate const val LLAMA_CPP_BACKEND_ID = "llama.cpp"\n'''
          s = s[:insert_at] + constants + s[insert_at:]
          write(p, s)

          # Remove a redundant ledger validation API only when no caller exists outside its declaration.
          p = 'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConnectionLedger.kt'
          s = read(p)
          uses = []
          for candidate in Path('.').rglob('*'):
              if candidate.is_file() and candidate.suffix in {'.kt', '.java'} and str(candidate) != p:
                  try:
                      if 'validateConnection(' in candidate.read_text(errors='ignore'):
                          uses.append(str(candidate))
                  except Exception:
                      pass
          if uses:
              raise SystemExit('validateConnection still used by: ' + ', '.join(uses))
          s, count = re.subn(
              r'\n    @Synchronized\n    fun validateConnection\(token: HostClientToken, caller: AuthorizedCaller\): LedgerResult<Unit> =\n        if \(connections\.activeConnection\(token, caller\) != null\) LedgerResult\.Success\(Unit\) else invalidConnection\(\)\n',
              '\n',
              s,
          )
          if count != 1:
              raise SystemExit(f'expected one validateConnection declaration, got {count}')
          write(p, s)
          PY
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          ./gradlew --no-configuration-cache detektAll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(hcp): split control-plane boundaries'
          git push origin HEAD:agent/hcp-n-consumer-control-plane-protocol
