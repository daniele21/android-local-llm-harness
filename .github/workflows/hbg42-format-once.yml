name: HBG-42 format once

on:
  push:
    branches:
      - fix/hbg42-host-restart-reconciliation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out HBG-42 head
        uses: actions/checkout@v7
        with:
          ref: fix/hbg42-host-restart-reconciliation
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply repository Kotlin formatting
        run: ./gradlew --no-configuration-cache spotlessApply

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobCoordinator.kt
          git add integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobMetadataStore.kt
          git add integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobRegistry.kt
          git add integrations/android-service-host/src/test/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobPersistenceFailureTest.kt
          git add integrations/android-service-host/src/test/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobRestartReconciliationTest.kt
          git commit -m "style(hbg42): apply repository Kotlin formatting"
          git push origin HEAD:fix/hbg42-host-restart-reconciliation
