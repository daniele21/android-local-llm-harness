name: LLRT-9 B2B2d finalize

on:
  push:
    branches:
      - agent/llrt9-evaluation-batch-engine-adapter-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/llrt9-evaluation-batch-engine-adapter-v1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Reconcile canonical LLRT narrative
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/llama-cpp-runtime-optimization-plan.md')
          text = path.read_text()
          old = "LLRT-9B2B2c next adapts `LlamaCppInferenceBackend` through a dedicated evaluation JNI API to the integrated native kernel. It must not widen the flat production `createContext` ABI, and its execution fingerprint must distinguish batch width plus per-sequence and aggregate context capacity. LLRT-9B2B2d then adapts the runtime operation to `EvaluationBatchExecutionPort` while preserving immutable sample order and keeping `evaluation:engine` backend-neutral. None of these slices change `SingleDecodeScheduler` production policy."
          new = "LLRT-9B2B2c adapts `LlamaCppInferenceBackend` through a dedicated evaluation JNI API to the integrated native kernel while preserving the flat production `createContext` ABI and fingerprinting batch width plus per-sequence and aggregate context capacity. LLRT-9B2B2d composes that runtime operation into `EvaluationBatchExecutionPort` through `evaluation:runtime-adapter`, preserving immutable sample order, isolated stateless sessions, timeout/cancellation and serial one-case fallback while keeping `evaluation:engine` backend-neutral. Neither slice changes `SingleDecodeScheduler` production policy."
          if old not in text:
              raise SystemExit('stale LLRT-9 B2B2c/d narrative anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply canonical formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Commit finalized B2B2d and remove one-shot workflow
        run: |
          rm .github/workflows/llrt9-b2b2d-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evaluation/runtime-adapter/src/main/kotlin/io/github/daniele21/localllm/evaluation/runtimeadapter/RuntimeEvaluationBatchExecutionAdapter.kt
          git add evaluation/runtime-adapter/src/main/kotlin/io/github/daniele21/localllm/evaluation/runtimeadapter/RuntimeEvaluationBatchSupport.kt
          git add evaluation/runtime-adapter/src/test/kotlin/io/github/daniele21/localllm/evaluation/runtimeadapter/RuntimeEvaluationBatchExecutionAdapterTest.kt
          git add docs/llama-cpp-runtime-optimization-plan.md
          git add .github/workflows/llrt9-b2b2d-finalize.yml
          git diff --cached --check
          git commit -m "refactor(llrt9): finalize evaluation runtime adapter"
          git push origin HEAD:agent/llrt9-evaluation-batch-engine-adapter-v1
