name: PR43 format and gate

on:
  push:
    branches:
      - agent/pr43-format-fix-sandbox

permissions:
  contents: write

jobs:
  format-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/model-catalog-secure-download
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Format and validate downloader
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          ./gradlew --no-configuration-cache --stacktrace \
            spotlessCheck \
            detekt \
            verifyNoModelArtifacts \
            :models:model-download:testDebugUnitTest \
            :models:model-download:lintDebug
          git diff --check

      - name: Publish validated formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/model-download/src
          if git diff --cached --quiet; then
            echo "No formatting changes to publish"
          else
            git commit -m "style: apply repository formatter to secure downloader"
            git push origin HEAD:refs/heads/agent/model-catalog-secure-download
          fi
