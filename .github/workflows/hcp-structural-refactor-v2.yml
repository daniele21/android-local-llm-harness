name: HCP structural refactor v2

on:
  pull_request:
    branches:
      - dev
    types:
      - reopened

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hcp-n-consumer-control-plane-protocol
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply structural HCP refactor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/hcp-n-consumer-control-plane-protocol
          git reset --hard origin/agent/hcp-n-consumer-control-plane-protocol
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          # 1. AIDL adapter: callback factories are stateless transport helpers.
          p = 'transports/android-binder-client/src/main/kotlin/io/github/daniele21/localllm/transport/binder/client/AidlSharedRuntimeRemoteService.kt'
          s = load(p)
          pattern = re.compile(
              r'\n    private fun resultCallback\(callback: \(ConsumerResultParcel\) -> Unit\): IConsumerResultCallback =\n'
              r'        object : IConsumerResultCallback\.Stub\(\) \{\n'
              r'            override fun onResult\(result: ConsumerResultParcel\) = callback\(result\)\n'
              r'        \}\n\n'
              r'    private fun controlPlaneResultCallback\(callback: \(ConsumerControlPlaneResultParcel\) -> Unit\): IConsumerControlPlaneResultCallback =\n'
              r'        object : IConsumerControlPlaneResultCallback\.Stub\(\) \{\n'
              r'            override fun onResult\(result: ConsumerControlPlaneResultParcel\) = callback\(result\)\n'
              r'        \}\n'
          )
          s, n = pattern.subn('', s)
          if n != 1:
              raise SystemExit(f'AIDL helper extraction expected 1 block, got {n}')
          s += '''\nprivate fun resultCallback(callback: (ConsumerResultParcel) -> Unit): IConsumerResultCallback =\n    object : IConsumerResultCallback.Stub() {\n        override fun onResult(result: ConsumerResultParcel) = callback(result)\n    }\n\nprivate fun controlPlaneResultCallback(\n    callback: (ConsumerControlPlaneResultParcel) -> Unit,\n): IConsumerControlPlaneResultCallback =\n    object : IConsumerControlPlaneResultCallback.Stub() {\n        override fun onResult(result: ConsumerControlPlaneResultParcel) = callback(result)\n    }\n'''
          save(p, s)

          # 2. Public consumer client: lifecycle guard is not part of the public operation count.
          p = 'transports/android-binder-client/src/main/kotlin/io/github/daniele21/localllm/transport/binder/client/BinderConsumerLocalLlmClient.kt'
          s = load(p)
          s, n = re.subn(
              r'\n    private fun checkOpen\(\) \{\n        check\(!closed\.get\(\)\) \{ "Shared-runtime consumer client is closed" \}\n    \}\n',
              '\n',
              s,
          )
          if n != 1:
              raise SystemExit(f'checkOpen extraction expected 1 block, got {n}')
          s = s.replace('checkOpen()', 'closed.requireOpen()')
          s += '''\nprivate fun AtomicBoolean.requireOpen() {\n    check(!get()) { "Shared-runtime consumer client is closed" }\n}\n'''
          save(p, s)

          # 3. Binder stub: authorization/rejection helpers are edge helpers, not Binder methods.
          p = 'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConsumerRuntimeBinderStub.kt'
          s = load(p)
          s = s.replace('withResultCaller(request, callback)', 'withResultCaller(authorizer, callingProcessSource, request, callback)')
          s = s.replace('withControlPlaneCaller(request, callback)', 'withControlPlaneCaller(authorizer, callingProcessSource, request, callback)')
          s = s.replace('authorizedCallerOrNull()', 'authorizedCallerOrNull(authorizer, callingProcessSource)')
          start = s.find('    private inline fun withResultCaller(')
          if start < 0:
              raise SystemExit('Binder helper start not found')
          s = s[:start] + '}\n\n' + '''private inline fun withResultCaller(\n    authorizer: CallerAuthorizer,\n    callingProcessSource: CallingProcessSource,\n    request: ConsumerRequestParcel,\n    callback: IConsumerResultCallback,\n    block: (AuthorizedCaller) -> Unit,\n) {\n    val caller = authorizedCallerOrNull(authorizer, callingProcessSource)\n    if (caller == null) {\n        deliverRemote {\n            callback.onResult(\n                ConsumerResultParcel(\n                    operationId = request.operationId,\n                    error = wireError(WireErrorCodes.CLIENT_NOT_REGISTERED),\n                ),\n            )\n        }\n    } else {\n        block(caller)\n    }\n}\n\nprivate inline fun withControlPlaneCaller(\n    authorizer: CallerAuthorizer,\n    callingProcessSource: CallingProcessSource,\n    request: ConsumerControlPlaneRequestParcel,\n    callback: IConsumerControlPlaneResultCallback,\n    block: (AuthorizedCaller) -> Unit,\n) {\n    val caller = authorizedCallerOrNull(authorizer, callingProcessSource)\n    if (caller == null) {\n        deliverRemote {\n            callback.onResult(\n                ConsumerControlPlaneResultParcel(\n                    operationId = request.operationId,\n                    error = wireError(WireErrorCodes.CLIENT_NOT_REGISTERED),\n                ),\n            )\n        }\n    } else {\n        block(caller)\n    }\n}\n\nprivate fun authorizedCallerOrNull(\n    authorizer: CallerAuthorizer,\n    callingProcessSource: CallingProcessSource,\n): AuthorizedCaller? = when (val result = authorizer.authorize(callingProcessSource.current())) {\n    is AuthorizationResult.Allowed -> result.caller\n    is AuthorizationResult.Denied -> null\n}\n'''
          save(p, s)

          # 4. Control-plane operations: keep only stateful orchestration in the class.
          p = 'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConsumerControlPlaneHostOperations.kt'
          s = load(p)
          start = s.find('    private fun ConsumerControlPlaneRequestParcel.toCoreActivationRequestOrNull()')
          if start < 0:
              raise SystemExit('Control-plane helper start not found')
          s = s[:start] + '}\n\n' + '''private fun ConsumerControlPlaneRequestParcel.toCoreActivationRequestOrNull(): ConsumerActivationRequest? {\n    val useCase = useCaseId?.takeIf(String::isNotBlank)\n    val useCaseRevisionValue = useCaseRevision?.takeIf { it > 0 }\n    val bindingRevisionValue = bindingRevision?.takeIf { it > 0 }\n    val presetValue = preset\n    val valid =\n        useCase != null &&\n            useCaseRevisionValue != null &&\n            bindingRevisionValue != null &&\n            presetValue != null &&\n            presetValue.id.isNotBlank() &&\n            presetValue.version > 0\n    return if (valid) {\n        ConsumerActivationRequest(\n            useCaseId = UseCaseId(requireNotNull(useCase)),\n            useCaseRevision = requireNotNull(useCaseRevisionValue),\n            bindingRevision = requireNotNull(bindingRevisionValue),\n            preset = InferencePresetRef(\n                InferencePresetId(requireNotNull(presetValue).id),\n                presetValue.version,\n            ),\n        )\n    } else {\n        null\n    }\n}\n\nprivate fun unauthorizedPresetDiscovery(\n    request: ConsumerControlPlaneRequestParcel,\n): ConsumerControlPlaneResultParcel =\n    ConsumerPublishedPresetsResult.Rejected(unauthorizedUseCaseFailure())\n        .toConsumerControlPlaneWire(request.operationId)\n\nprivate fun unauthorizedActivation(\n    request: ConsumerControlPlaneRequestParcel,\n): ConsumerControlPlaneResultParcel =\n    ConsumerActivationResult.Rejected(unauthorizedUseCaseFailure())\n        .toConsumerControlPlaneWire(request.operationId)\n\nprivate fun unauthorizedUseCaseFailure() = ConsumerControlPlaneFailure(\n    ConsumerControlPlaneErrorCode.USE_CASE_NOT_ASSIGNED,\n    "Use case is not assigned",\n)\n\nprivate fun invalidRequest(request: ConsumerControlPlaneRequestParcel) =\n    failure(request, WireErrorCodes.INVALID_WIRE_REQUEST)\n\nprivate fun failure(\n    request: ConsumerControlPlaneRequestParcel,\n    code: String,\n) = ConsumerControlPlaneResultParcel(\n    operationId = request.operationId,\n    error = wireError(code),\n)\n'''
          save(p, s)

          # 5. Split wire operation mapping from domain/error mapping.
          p = 'transports/android-binder-contract/src/main/kotlin/io/github/daniele21/localllm/transport/binder/contract/ConsumerControlPlaneWireMapping.kt'
          s = load(p)
          split = s.find('private fun ConsumerAssignedUseCase.toWire()')
          if split < 0:
              raise SystemExit('Wire mapping split point not found')
          tail = s[split:]
          save(p, s[:split].rstrip() + '\n')
          new_p = p.replace('ConsumerControlPlaneWireMapping.kt', 'ConsumerControlPlaneDomainWireMapping.kt')
          header = '''package io.github.daniele21.localllm.transport.binder.contract\n\nimport io.github.daniele21.localllm.contracts.ConsumerActivation\nimport io.github.daniele21.localllm.contracts.ConsumerActivationId\nimport io.github.daniele21.localllm.contracts.ConsumerAssignedUseCase\nimport io.github.daniele21.localllm.contracts.ConsumerControlPlaneErrorCode\nimport io.github.daniele21.localllm.contracts.ConsumerControlPlaneFailure\nimport io.github.daniele21.localllm.contracts.ConsumerPublishedPreset\nimport io.github.daniele21.localllm.contracts.InferencePresetId\nimport io.github.daniele21.localllm.contracts.InferencePresetRef\nimport io.github.daniele21.localllm.contracts.UseCaseId\n\n'''
          save(new_p, header + tail)

          # 6. Ledger: one connection query owns both validation and feature checks.
          p = 'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConnectionLedger.kt'
          s = load(p)
          pattern = re.compile(
              r'\n    @Synchronized\n    fun validateConnection\(token: HostClientToken, caller: AuthorizedCaller\): LedgerResult<Unit> =\n'
              r'        if \(connections\.activeConnection\(token, caller\) != null\) LedgerResult\.Success\(Unit\) else invalidConnection\(\)\n\n'
              r'    @Synchronized\n    fun supportsFeature\(token: HostClientToken, caller: AuthorizedCaller, feature: String\): LedgerResult<Boolean> \{\n'
              r'        val connection = connections\.activeConnection\(token, caller\) \?: return invalidConnection\(\)\n'
              r'        return LedgerResult\.Success\(connection\.supportsFeature\(feature\)\)\n'
              r'    \}\n'
          )
          replacement = '''\n    @Synchronized\n    fun connectionFeature(\n        token: HostClientToken,\n        caller: AuthorizedCaller,\n        feature: String? = null,\n    ): LedgerResult<Boolean> {\n        val connection = connections.activeConnection(token, caller) ?: return invalidConnection()\n        return LedgerResult.Success(feature == null || connection.supportsFeature(feature))\n    }\n'''
          s, n = pattern.subn(replacement, s)
          if n != 1:
              raise SystemExit(f'Ledger connection API replacement expected 1 block, got {n}')
          save(p, s)
          call_files = [
              'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConsumerHostOperations.kt',
              'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/HostRuntimeOperations.kt',
              'integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/ConsumerControlPlaneHostOperations.kt',
          ]
          for path in call_files:
              text = load(path)
              text = text.replace('ledger.validateConnection(', 'ledger.connectionFeature(')
              text = text.replace('ledger.supportsFeature(', 'ledger.connectionFeature(')
              save(path, text)

          # 7. Runtime graph: activation-binding lifecycle gets a dedicated controller.
          p = 'apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessRuntimeGraph.kt'
          s = load(p)
          anchor = '    val activationResidency = ActivationResidencyCoordinator(activationLeases)\n'
          if anchor not in s:
              raise SystemExit('Runtime activation residency anchor not found')
          s = s.replace(anchor, anchor + '    val activationBindings = HarnessActivationBindingController(registry)\n', 1)
          pattern = re.compile(
              r'\n    fun installActivationBinding\([\s\S]*?\n    \}\n\n'
              r'    fun removeActivationBinding\(activationId: UseCaseActivationId\) \{\n'
              r'        registry\.removeActivationBinding\(activationId\)\n'
              r'    \}\n',
          )
          s, n = pattern.subn('\n', s, count=1)
          if n != 1:
              raise SystemExit(f'Runtime activation wrapper extraction expected 1 block, got {n}')
          insert = '''\ninternal class HarnessActivationBindingController(private val registry: HarnessPhoneBindingRegistry) {\n    fun install(\n        activationId: UseCaseActivationId,\n        applicationId: ApplicationId,\n        useCaseId: UseCaseId,\n        resolved: ResolvedUseCase,\n    ) = registry.installActivationBinding(activationId, applicationId, useCaseId, resolved)\n\n    fun remove(activationId: UseCaseActivationId) = registry.removeActivationBinding(activationId)\n}\n\n'''
          enum_anchor = '\ninternal enum class HarnessRuntimePurpose'
          if enum_anchor not in s:
              raise SystemExit('Runtime purpose anchor not found')
          s = s.replace(enum_anchor, insert + 'internal enum class HarnessRuntimePurpose', 1)
          save(p, s)

          # 8. Host coordinator: reduce return count and move construction helpers out of the class.
          p = 'apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessConsumerControlPlaneHost.kt'
          s = load(p)
          s = s.replace('runtimeGraph.installActivationBinding(', 'runtimeGraph.activationBindings.install(')
          s = s.replace('runtimeGraph.removeActivationBinding(', 'runtimeGraph.activationBindings.remove(')
          start = s.find('    override fun activate(ownerId: String, applicationId: ApplicationId, request: ConsumerActivationRequest): ConsumerActivationResult {')
          end = s.find('\n    override fun deactivate(', start)
          if start < 0 or end < 0:
              raise SystemExit('Host activate boundaries not found')
          activate = '''    override fun activate(\n        ownerId: String,\n        applicationId: ApplicationId,\n        request: ConsumerActivationRequest,\n    ): ConsumerActivationResult {\n        ensureSeeded()\n        val resolution = resolver.resolve(\n            HostExecutionRequest(\n                applicationId = applicationId,\n                useCaseId = request.useCaseId,\n                presetId = request.preset.id.value,\n                presetRevision = request.preset.version,\n            ),\n            controlPlaneExecutionEnvironment(modelStore, applicationId),\n        )\n        val execution = (resolution as? HostExecutionResolution.Success)?.execution\n        val resolutionFailure = when {\n            resolution is HostExecutionResolution.Failure ->\n                ConsumerActivationResult.Rejected(resolution.code.toConsumerFailure())\n            execution == null ->\n                ConsumerActivationResult.Rejected(\n                    failure(ConsumerControlPlaneErrorCode.RUNTIME_FAILURE, "Unable to resolve consumer execution"),\n                )\n            execution.useCaseRevision != request.useCaseRevision ||\n                execution.bindingRevision != request.bindingRevision ->\n                ConsumerActivationResult.Rejected(\n                    failure(\n                        ConsumerControlPlaneErrorCode.STALE_REVISION,\n                        "Consumer configuration changed; refresh assignments",\n                    ),\n                )\n            else -> null\n        }\n        if (resolutionFailure != null) return resolutionFailure\n\n        val resolvedExecution = requireNotNull(execution)\n        val installed = modelStore.find(resolvedExecution.modelDigest)?.takeIf { it.verified }\n        val imported = installed?.let { importedPhoneModel(it.digest, it.sizeBytes) }\n        val runtimeResolved = imported?.let { HarnessSharedRuntimeBindings.resolveOmbra(it, applicationId) }\n        val modelFailure = when {\n            installed == null ->\n                ConsumerActivationResult.Rejected(\n                    failure(ConsumerControlPlaneErrorCode.MODEL_UNAVAILABLE, "Required local model is unavailable"),\n                )\n            imported == null ->\n                ConsumerActivationResult.Rejected(\n                    failure(ConsumerControlPlaneErrorCode.MODEL_UNAVAILABLE, "Required local model is unsupported"),\n                )\n            runtimeResolved == null || runtimeResolved.model.artifact.digest != resolvedExecution.modelDigest ->\n                ConsumerActivationResult.Rejected(\n                    failure(ConsumerControlPlaneErrorCode.RUNTIME_FAILURE, "Resolved model identity mismatch"),\n                )\n            else -> null\n        }\n        if (modelFailure != null) return modelFailure\n\n        val acquired = runtimeGraph.activationResidency.acquireExclusiveUseCase(\n            request = UseCaseActivationRequest(\n                ownerId = ActivationOwnerId(ownerId),\n                applicationId = applicationId,\n                useCaseId = request.useCaseId,\n                preset = request.preset,\n                modelDigest = resolvedExecution.modelDigest,\n                acquiredAtEpochMs = epochClock(),\n                useCaseRevision = resolvedExecution.useCaseRevision,\n                bindingRevision = resolvedExecution.bindingRevision,\n            ),\n            retainModelWarmMs = resolvedExecution.cachePolicy.retainModelWarmMs,\n        )\n        return when (acquired) {\n            is ActivationResidencyResult.Failure ->\n                ConsumerActivationResult.Rejected(acquired.toConsumerFailure())\n            is ActivationResidencyResult.Success ->\n                activateRuntimeBinding(\n                    acquired.value,\n                    applicationId,\n                    request,\n                    requireNotNull(runtimeResolved),\n                )\n        }\n    }\n'''
          s = s[:start] + activate + s[end:]
          helper_start = s.find('    private fun executionEnvironment(')
          companion_start = s.find('    private companion object {', helper_start)
          if helper_start < 0 or companion_start < 0:
              raise SystemExit('Host helper region not found')
          companion_end = s.find('\n    }\n}', companion_start)
          if companion_end < 0:
              raise SystemExit('Host companion end not found')
          companion_end += len('\n    }')
          s = s[:helper_start] + s[companion_end:]
          class_end = s.find('\n}\n\nprivate fun AssignedUseCaseDiscoveryFailure')
          if class_end < 0:
              raise SystemExit('Host class end anchor not found')
          helpers = '''\nprivate const val SEED_REVISION = 1\nprivate const val OMBRA_MINIMUM_CONTEXT_TOKENS = 4_096\nprivate const val OMBRA_MAX_INPUT_CHARACTERS = 12_000\nprivate const val OMBRA_MAX_SCHEMA_CHARACTERS = 4_096\nprivate const val MIGRATION_WARM_RETENTION_MS = 60_000L\nprivate const val LLAMA_CPP_BACKEND_ID = "llama.cpp"\n\nprivate fun controlPlaneExecutionEnvironment(\n    modelStore: ModelStore,\n    applicationId: ApplicationId,\n): HostExecutionEnvironment {\n    val installed = modelStore.snapshot().entries.filter { it.verified }\n    val profiles = installed.mapNotNull { stored ->\n        importedPhoneModel(stored.digest, stored.sizeBytes)?.let { model ->\n            runCatching { HarnessSharedRuntimeBindings.resolveOmbra(model, applicationId).model }.getOrNull()\n        }\n    }\n    return HostExecutionEnvironment(\n        modelProfiles = profiles,\n        installedModelDigests = installed.map { it.digest }.toSet(),\n        backendId = LLAMA_CPP_BACKEND_ID,\n        backendRevision = Qwen35RuntimeTuningProfiles.LLAMA_CPP_REVISION,\n    )\n}\n\nprivate fun importedPhoneModel(digest: ModelDigest, sizeBytes: Long): ImportedPhoneModel? {\n    val release = CuratedModelCatalog.releases.singleOrNull { candidate ->\n        candidate.artifact.digest == digest && candidate.artifact.sizeBytes == sizeBytes\n    }\n    return release?.let {\n        ImportedPhoneModel(\n            digest = digest,\n            fileName = it.artifact.fileName,\n            sizeBytes = sizeBytes,\n            architecture = it.artifact.architecture,\n            quantization = it.artifact.quantization,\n        )\n    }\n}\n\nprivate fun seedUseCase() = UseCaseDefinition(\n    useCaseId = HarnessSharedRuntimeBindings.ombraUseCaseId,\n    displayName = "Document PII detection",\n    description = "Detect configured PII locally from document text",\n    requirements = UseCaseRequirements(\n        outputMode = OutputMode.JSON_SCHEMA,\n        sessionKind = SessionKind.STATELESS,\n        reasoningSupported = false,\n        minimumContextTokens = OMBRA_MINIMUM_CONTEXT_TOKENS,\n        maxInputCharacters = OMBRA_MAX_INPUT_CHARACTERS,\n        maxJsonSchemaCharacters = OMBRA_MAX_SCHEMA_CHARACTERS,\n    ),\n    state = UseCaseDefinitionState.ACTIVE,\n    revision = SEED_REVISION,\n)\n\nprivate fun seedPreset() = UseCasePresetDefinition(\n    useCaseId = HarnessSharedRuntimeBindings.ombraUseCaseId,\n    metadata = PresetConsumerMetadata(\n        presetId = HarnessSharedRuntimeBindings.ombraDefaultPreset.id.value,\n        revision = HarnessSharedRuntimeBindings.ombraDefaultPreset.version,\n        displayName = "Balanced local PII",\n        description = "Automatic local Qwen3.5 selection for structured PII detection",\n    ),\n    creationSource = PresetCreationSource.SUGGESTED,\n    state = PresetLifecycleState.PUBLISHED,\n    execution = PresetExecutionPolicy(\n        modelProfileId = null,\n        inferencePreset = HarnessSharedRuntimeBindings.ombraDefaultPreset,\n        contextTokens = OMBRA_MINIMUM_CONTEXT_TOKENS,\n        cachePolicy = UseCaseCachePolicy(\n            retainModelWarmMs = MIGRATION_WARM_RETENTION_MS,\n            reuseStatelessContext = false,\n            enablePrefixSnapshot = false,\n            enableDeterministicResultCache = false,\n        ),\n    ),\n)\n'''
          s = s[:class_end + 2] + helpers + s[class_end + 2:]
          save(p, s)
          PY
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          ./gradlew --no-configuration-cache detektAll
          ./gradlew --no-configuration-cache test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(hcp): split control-plane responsibilities'
          git push origin HEAD:agent/hcp-n-consumer-control-plane-protocol
