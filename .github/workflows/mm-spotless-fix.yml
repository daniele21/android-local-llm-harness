name: Memory admission spotless fix

on:
  push:
    branches:
      - agent/mm-orchestrator-admission-replay

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mm-orchestrator-admission-replay
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply canonical Kotlin formatting
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Commit formatted memory admission files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            core/runtime-core/src/main/kotlin/io/github/daniele21/localllm/runtime/RuntimeOrchestrator.kt \
            core/runtime-core/src/test/kotlin/io/github/daniele21/localllm/runtime/RuntimeMemoryAdmissionIntegrationTest.kt
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: apply canonical memory admission formatting'
          git push origin HEAD:agent/mm-orchestrator-admission-replay
