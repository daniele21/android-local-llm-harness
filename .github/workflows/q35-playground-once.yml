name: Q35 playground once

on:
  push:
    paths:
      - ".github/workflows/q35-playground-once.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Integrate Qwen3.5 presets into playground
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          ui = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessUiState.kt')
          text = ui.read_text()
          text = text.replace(
              'package io.github.daniele21.localllm.phonetest\n',
              '''package io.github.daniele21.localllm.phonetest\n\nimport io.github.daniele21.localllm.contracts.ThinkingMode\nimport io.github.daniele21.localllm.models.GenerationDefaults\nimport io.github.daniele21.localllm.models.Qwen35GenerationProfileId\nimport io.github.daniele21.localllm.models.Qwen35GenerationProfiles\nimport io.github.daniele21.localllm.models.Qwen35ModelTier\n''',
              1,
          )
          start = text.index('internal data class PlaygroundPresetOption(')
          end = text.index('\n\ninternal data class HarnessUiState(', start)
          preset_block = '''internal data class PlaygroundPresetOption(\n    val id: String,\n    val profileId: Qwen35GenerationProfileId,\n    val label: String,\n    val description: String,\n    val preferredContextTokens: Int,\n    val recommendedMaximumContextTokens: Int,\n    val systemPrompt: String,\n)\n\ninternal val playgroundPresetOptions = listOf(\n    PlaygroundPresetOption(\n        "qwen35-text-fast",\n        Qwen35GenerationProfileId.QWEN35_TEXT_FAST,\n        "Fast",\n        "Short non-thinking answers with the Qwen3.5 mobile baseline",\n        2_048,\n        4_096,\n        "Answer directly and concisely.",\n    ),\n    PlaygroundPresetOption(\n        "qwen35-text-quality",\n        Qwen35GenerationProfileId.QWEN35_TEXT_QUALITY,\n        "Quality",\n        "General-purpose non-thinking Qwen3.5 profile",\n        4_096,\n        8_192,\n        "Be accurate, direct, and concise.",\n    ),\n    PlaygroundPresetOption(\n        "qwen35-thinking",\n        Qwen35GenerationProfileId.QWEN35_THINKING,\n        "Thinking",\n        "Qwen3.5 reasoning mode using enable_thinking",\n        4_096,\n        8_192,\n        "Reason carefully before giving the final answer.",\n    ),\n    PlaygroundPresetOption(\n        "qwen35-precise",\n        Qwen35GenerationProfileId.QWEN35_PRECISE,\n        "Precise",\n        "Lower-temperature thinking profile for precise tasks",\n        4_096,\n        8_192,\n        "Reason carefully and return a precise answer without unnecessary commentary.",\n    ),\n    PlaygroundPresetOption(\n        "qwen35-json",\n        Qwen35GenerationProfileId.QWEN35_JSON,\n        "JSON",\n        "Non-thinking structured-output profile",\n        4_096,\n        8_192,\n        "Return only the requested structured result. Do not add commentary outside the required format.",\n    ),\n)'''
          text = text[:start] + preset_block + text[end:]
          text = text.replace(
              '''    val playgroundTopK: String = DEFAULT_TOP_K,\n    val playgroundRepeatPenalty: String = DEFAULT_REPEAT_PENALTY,''',
              '''    val playgroundTopK: String = DEFAULT_TOP_K,\n    val playgroundMinP: String = DEFAULT_MIN_P,\n    val playgroundPresencePenalty: String = DEFAULT_PRESENCE_PENALTY,\n    val playgroundThinkingMode: ThinkingMode = ThinkingMode.DISABLED,\n    val playgroundRepeatPenalty: String = DEFAULT_REPEAT_PENALTY,''',
              1,
          )
          text = text.replace('const val DEFAULT_MAX_OUTPUT_TOKENS = "768"', 'const val DEFAULT_MAX_OUTPUT_TOKENS = "512"')
          text = text.replace('const val DEFAULT_TEMPERATURE = "0.6"', 'const val DEFAULT_TEMPERATURE = "1"')
          text = text.replace('const val DEFAULT_PRESET = "balanced-conversation"', 'const val DEFAULT_PRESET = "qwen35-text-quality"')
          text = text.replace('const val DEFAULT_TOP_P = "0.9"', 'const val DEFAULT_TOP_P = "1"')
          text = text.replace('const val DEFAULT_TOP_K = "40"', 'const val DEFAULT_TOP_K = "20"')
          text = text.replace('const val DEFAULT_REPEAT_PENALTY = "1.05"', 'const val DEFAULT_REPEAT_PENALTY = "1"')
          text = text.replace(
              '        const val DEFAULT_TOP_K = "20"\n',
              '        const val DEFAULT_TOP_K = "20"\n        const val DEFAULT_MIN_P = "0"\n        const val DEFAULT_PRESENCE_PENALTY = "2"\n',
              1,
          )
          text = text.replace(
              '    data class PlaygroundTopKChanged(val topK: String) : Playground\n',
              '''    data class PlaygroundTopKChanged(val topK: String) : Playground\n\n    data class PlaygroundMinPChanged(val minP: String) : Playground\n\n    data class PlaygroundPresencePenaltyChanged(val presencePenalty: String) : Playground\n\n    data class PlaygroundThinkingModeChanged(val mode: ThinkingMode) : Playground\n''',
              1,
          )
          text = text.replace(
              '''        is HarnessUiEvent.ModelChanged -> state.copy(\n            importedModel = event.model,\n            modelInventory = HarnessModelInventoryReconciler.reconcile(\n                distribution = state.modelDistribution,\n                selectedModel = event.model,\n                loadedDigest = state.modelInventory.loadedDigest,\n            ),\n            removalConfirmationPending = false,\n            modelRecoveryConfirmation = null,\n        )''',
              '''        is HarnessUiEvent.ModelChanged -> state.copy(\n            importedModel = event.model,\n            modelInventory = HarnessModelInventoryReconciler.reconcile(\n                distribution = state.modelDistribution,\n                selectedModel = event.model,\n                loadedDigest = state.modelInventory.loadedDigest,\n            ),\n            removalConfirmationPending = false,\n            modelRecoveryConfirmation = null,\n        ).let { updated ->\n            if (event.model != null && updated.playgroundPreset.isNotBlank()) {\n                updated.applyPreset(updated.playgroundPreset)\n            } else {\n                updated\n            }\n        }''',
              1,
          )
          text = text.replace(
              '        is HarnessUiEvent.PlaygroundTopKChanged -> state.copy(playgroundTopK = event.topK, playgroundPreset = "")\n',
              '''        is HarnessUiEvent.PlaygroundTopKChanged -> state.copy(playgroundTopK = event.topK, playgroundPreset = "")\n\n        is HarnessUiEvent.PlaygroundMinPChanged -> state.copy(playgroundMinP = event.minP, playgroundPreset = "")\n\n        is HarnessUiEvent.PlaygroundPresencePenaltyChanged -> state.copy(\n            playgroundPresencePenalty = event.presencePenalty,\n            playgroundPreset = "",\n        )\n\n        is HarnessUiEvent.PlaygroundThinkingModeChanged -> state.copy(\n            playgroundThinkingMode = event.mode,\n            playgroundPreset = "",\n        )\n''',
              1,
          )
          old_apply = '''    private fun HarnessUiState.applyPreset(id: String): HarnessUiState {\n        val preset = playgroundPresetOptions.firstOrNull { it.id == id } ?: return copy(playgroundPreset = id)\n        return copy(\n            playgroundPreset = id,\n            playgroundBasePreset = id,\n            playgroundMaxTokens = preset.maxOutputTokens,\n            playgroundTemperature = preset.temperature,\n            playgroundTopP = preset.topP,\n            playgroundTopK = preset.topK,\n            playgroundRepeatPenalty = preset.repeatPenalty,\n            playgroundRepeatLastN = preset.repeatLastN,\n            playgroundSeed = preset.seed,\n            playgroundContext = "",\n        )\n    }'''
          new_apply = '''    private fun HarnessUiState.applyPreset(id: String): HarnessUiState {\n        val preset = playgroundPresetOptions.firstOrNull { it.id == id } ?: return copy(playgroundPreset = id)\n        val defaults = preset.defaultsFor(importedModel)\n        return copy(\n            playgroundPreset = id,\n            playgroundBasePreset = id,\n            playgroundMaxTokens = defaults.maxOutputTokens.toString(),\n            playgroundTemperature = defaults.temperature.toControlValue(),\n            playgroundTopP = defaults.topP.toControlValue(),\n            playgroundTopK = defaults.topK.toString(),\n            playgroundMinP = defaults.minP.toControlValue(),\n            playgroundPresencePenalty = defaults.presencePenalty.toControlValue(),\n            playgroundThinkingMode = defaults.thinkingMode,\n            playgroundRepeatPenalty = defaults.repeatPenalty.toControlValue(),\n            playgroundRepeatLastN = defaults.repeatLastN.toString(),\n            playgroundSeed = "",\n            playgroundContext = "",\n        )\n    }\n\n    private fun PlaygroundPresetOption.defaultsFor(model: ImportedPhoneModel?): GenerationDefaults {\n        val tier = model?.let(::qwen35Tier) ?: Qwen35ModelTier.B0_8\n        return Qwen35GenerationProfiles.forTier(tier).single { it.id == profileId }.defaults\n    }\n\n    private fun qwen35Tier(model: ImportedPhoneModel): Qwen35ModelTier {\n        val stableId = Qwen35PhoneModelPolicy.requireCurated(model).id.modelId.value\n        return if (stableId.startsWith("qwen35-08b-")) Qwen35ModelTier.B0_8 else Qwen35ModelTier.B2\n    }\n\n    private fun Float.toControlValue(): String = toString().removeSuffix(".0")'''
          if old_apply not in text:
              raise SystemExit('applyPreset block missing')
          text = text.replace(old_apply, new_apply, 1)
          ui.write_text(text)

          vm = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessViewModel.kt')
          text = vm.read_text()
          text = text.replace(
              'import androidx.lifecycle.ViewModel\n',
              'import androidx.lifecycle.ViewModel\nimport io.github.daniele21.localllm.contracts.ThinkingMode\n',
              1,
          )
          text = text.replace(
              '    fun updatePlaygroundTopK(value: String) = dispatch(HarnessUiEvent.PlaygroundTopKChanged(value))\n',
              '''    fun updatePlaygroundTopK(value: String) = dispatch(HarnessUiEvent.PlaygroundTopKChanged(value))\n\n    fun updatePlaygroundMinP(value: String) = dispatch(HarnessUiEvent.PlaygroundMinPChanged(value))\n\n    fun updatePlaygroundPresencePenalty(value: String) = dispatch(HarnessUiEvent.PlaygroundPresencePenaltyChanged(value))\n\n    fun updatePlaygroundThinkingMode(mode: ThinkingMode) = dispatch(HarnessUiEvent.PlaygroundThinkingModeChanged(mode))\n''',
              1,
          )
          text = text.replace(
              '''                topK = state.playgroundTopK,\n                repeatPenalty = state.playgroundRepeatPenalty,''',
              '''                topK = state.playgroundTopK,\n                minP = state.playgroundMinP,\n                presencePenalty = state.playgroundPresencePenalty,\n                thinkingMode = state.playgroundThinkingMode,\n                repeatPenalty = state.playgroundRepeatPenalty,''',
              1,
          )
          vm.write_text(text)

          models = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneTestModels.kt')
          text = models.read_text()
          text = text.replace(
              'import io.github.daniele21.localllm.contracts.SeedPolicy\n',
              'import io.github.daniele21.localllm.contracts.SeedPolicy\nimport io.github.daniele21.localllm.contracts.ThinkingMode\n',
              1,
          )
          text = text.replace(
              'import io.github.daniele21.localllm.models.OutputMode\n',
              '''import io.github.daniele21.localllm.models.OutputMode\nimport io.github.daniele21.localllm.models.Qwen35GenerationProfiles\nimport io.github.daniele21.localllm.models.Qwen35ModelTier\n''',
              1,
          )
          text = text.replace(
              '''    val topK: Int,\n    val repeatPenalty: Float,''',
              '''    val topK: Int,\n    val minP: Float,\n    val presencePenalty: Float,\n    val thinkingMode: ThinkingMode,\n    val repeatPenalty: Float,''',
              1,
          )
          text = text.replace(
              '''            val parsedTopK = requireNotNull(fields.topK.trim().toIntOrNull()) { "Top-k must be an integer" }\n            require(parsedTopK in 0..1000) { "Top-k must be between 0 and 1000" }\n            val parsedRepeatPenalty''',
              '''            val parsedTopK = requireNotNull(fields.topK.trim().toIntOrNull()) { "Top-k must be an integer" }\n            require(parsedTopK in 0..1000) { "Top-k must be between 0 and 1000" }\n            val parsedMinP = requireNotNull(fields.minP.trim().toFloatOrNull()) { "Min-p must be a number" }\n            require(parsedMinP.isFinite() && parsedMinP in 0f..1f) { "Min-p must be between 0 and 1" }\n            val parsedPresencePenalty = requireNotNull(fields.presencePenalty.trim().toFloatOrNull()) {\n                "Presence penalty must be a number"\n            }\n            require(parsedPresencePenalty.isFinite() && parsedPresencePenalty in 0f..2f) {\n                "Presence penalty must be between 0 and 2"\n            }\n            val parsedRepeatPenalty''',
              1,
          )
          text = text.replace(
              '''                topK = parsedTopK,\n                repeatPenalty = parsedRepeatPenalty,''',
              '''                topK = parsedTopK,\n                minP = parsedMinP,\n                presencePenalty = parsedPresencePenalty,\n                thinkingMode = fields.thinkingMode,\n                repeatPenalty = parsedRepeatPenalty,''',
              1,
          )
          text = text.replace(
              '''    val topK: String,\n    val repeatPenalty: String,''',
              '''    val topK: String,\n    val minP: String = "0",\n    val presencePenalty: String = "0",\n    val thinkingMode: ThinkingMode = ThinkingMode.DISABLED,\n    val repeatPenalty: String,''',
              1,
          )
          text = text.replace(
              '''    val release = Qwen35PhoneModelPolicy.requireCurated(model)\n    val applicationId''',
              '''    val release = Qwen35PhoneModelPolicy.requireCurated(model)\n    val tier = if (release.id.modelId.value.startsWith("qwen35-08b-")) Qwen35ModelTier.B0_8 else Qwen35ModelTier.B2\n    val applicationId''',
              1,
          )
          start = text.index('        chatTemplatePolicy = ChatTemplatePolicy(')
          end = text.index('        ),\n    )', start) + len('        ),')
          text = text[:start] + '        chatTemplatePolicy = ChatTemplatePolicy(),\n' + text[end:]
          old_defaults = '''        generationDefaults = GenerationDefaults(\n            maxOutputTokens = maxOutputTokens,\n            temperature = 0f,\n            topP = 1f,\n            topK = 0,\n            seed = 42,\n            repeatPenalty = PHONE_REPEAT_PENALTY,\n            repeatLastN = PHONE_REPEAT_LAST_N,\n        ),'''
          new_defaults = '''        generationDefaults = Qwen35GenerationProfiles.defaultForTier(tier).copy(\n            maxOutputTokens = maxOutputTokens,\n            seed = 42,\n            seedPolicy = SeedPolicy.Fixed(42),\n        ),'''
          if old_defaults not in text:
              raise SystemExit('phone generation defaults block missing')
          text = text.replace(old_defaults, new_defaults, 1)
          text = text.replace('presets = phoneInferencePresets(),', 'presets = phoneInferencePresets(tier),', 1)
          text = text.replace(
              'defaultPreset = InferencePresetRef(InferencePresetId("balanced-conversation"), PHONE_INFERENCE_PRESET_VERSION),',
              'defaultPreset = InferencePresetRef(InferencePresetId("qwen35-text-quality"), PHONE_INFERENCE_PRESET_VERSION),',
              1,
          )
          start = text.index('private fun phoneInferencePresets()')
          end = text.index('\ninternal const val PHONE_INFERENCE_PRESET_VERSION', start)
          replacement = '''private fun phoneInferencePresets(tier: Qwen35ModelTier): List<InferencePreset> =\n    playgroundPresetOptions.map { phonePreset(tier, it) }\n\nprivate fun phonePreset(tier: Qwen35ModelTier, preset: PlaygroundPresetOption): InferencePreset {\n    val profile = Qwen35GenerationProfiles.forTier(tier).single { it.id == preset.profileId }\n    return InferencePreset(\n        ref = InferencePresetRef(InferencePresetId(preset.id), profile.version),\n        generation = profile.defaults,\n        systemPromptVersion = "play-internal-phone-${preset.id}-v1",\n        systemPrompt = preset.systemPrompt,\n        contextPreference = ContextPreference(\n            preferredTokens = preset.preferredContextTokens,\n            recommendedMaximumTokens = preset.recommendedMaximumContextTokens,\n        ),\n        allowedOutputModes = if (preset.id == "qwen35-json") {\n            setOf(OutputMode.TEXT, OutputMode.JSON, OutputMode.JSON_SCHEMA)\n        } else {\n            setOf(OutputMode.TEXT)\n        },\n    )\n}\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'internal const val PHONE_INFERENCE_PRESET_VERSION = 2\nprivate const val PHONE_REPEAT_PENALTY = 1.05f\nprivate const val PHONE_REPEAT_LAST_N = 64',
              'internal const val PHONE_INFERENCE_PRESET_VERSION = Qwen35GenerationProfiles.VERSION',
              1,
          )
          models.write_text(text)

          controller = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhonePlaygroundController.kt')
          text = controller.read_text()
          old = '''                overrides = GenerationOverrides(\n                    maxOutputTokens = options.maxOutputTokens,\n                    temperature = options.temperature,\n                    topP = options.topP,\n                    topK = options.topK,\n                    repeatPenalty = options.repeatPenalty,\n                    repeatLastN = options.repeatLastN,\n                    seedPolicy = options.seedPolicy,\n                    preset = options.presetId?.let {\n                        InferencePresetRef(InferencePresetId(it), PHONE_INFERENCE_PRESET_VERSION)\n                    },\n                ),'''
          new = '''                overrides = options.toGenerationOverrides(),'''
          if old not in text:
              raise SystemExit('controller overrides block missing')
          text = text.replace(old, new, 1)
          insert = '''\nprivate fun PlaygroundRequestOptions.toGenerationOverrides(): GenerationOverrides {\n    val preset = presetId?.let { InferencePresetRef(InferencePresetId(it), PHONE_INFERENCE_PRESET_VERSION) }\n    val custom = preset == null\n    return GenerationOverrides(\n        maxOutputTokens = maxOutputTokens.takeIf { custom },\n        temperature = temperature.takeIf { custom },\n        topP = topP.takeIf { custom },\n        topK = topK.takeIf { custom },\n        minP = minP.takeIf { custom },\n        presencePenalty = presencePenalty.takeIf { custom },\n        thinkingMode = thinkingMode.takeIf { custom },\n        repeatPenalty = repeatPenalty.takeIf { custom },\n        repeatLastN = repeatLastN.takeIf { custom },\n        seedPolicy = seedPolicy.takeIf { custom },\n        preset = preset,\n    )\n}\n'''
          marker = '\n@Suppress("TooManyFunctions", "ReturnCount", "CyclomaticComplexMethod", "NestedBlockDepth")\n'
          text = text.replace(marker, insert + marker, 1)
          controller.write_text(text)

          main = Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/MainActivity.kt')
          text = main.read_text()
          text = text.replace(
              'import io.github.daniele21.localllm.observability.android.AndroidResourceSnapshotProvider\n',
              'import io.github.daniele21.localllm.contracts.ThinkingMode\nimport io.github.daniele21.localllm.observability.android.AndroidResourceSnapshotProvider\n',
              1,
          )
          marker = '''        Text(\n            text = selectedPreset?.description ?: basePreset?.description.orEmpty(),\n            style = MaterialTheme.typography.bodySmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,\n        )\n'''
          addition = marker + '''        Text("Thinking", style = MaterialTheme.typography.labelLarge)\n        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            FilterChip(\n                selected = state.playgroundThinkingMode == ThinkingMode.DISABLED,\n                onClick = { harnessViewModel.updatePlaygroundThinkingMode(ThinkingMode.DISABLED) },\n                label = { Text("Off") },\n                enabled = presentation.inputsEnabled,\n            )\n            FilterChip(\n                selected = state.playgroundThinkingMode == ThinkingMode.ENABLED,\n                onClick = { harnessViewModel.updatePlaygroundThinkingMode(ThinkingMode.ENABLED) },\n                label = { Text("On") },\n                enabled = presentation.inputsEnabled,\n                modifier = Modifier.testTag("playground-thinking-on"),\n            )\n        }\n'''
          if marker not in text:
              raise SystemExit('main preset description marker missing')
          text = text.replace(marker, addition, 1)
          marker = '''        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            OutlinedTextField(\n                value = state.playgroundRepeatPenalty,'''
          fields = '''        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            OutlinedTextField(\n                value = state.playgroundMinP,\n                onValueChange = harnessViewModel::updatePlaygroundMinP,\n                modifier = Modifier.weight(1f).testTag("playground-min-p"),\n                label = { Text("Min-p") },\n                enabled = presentation.inputsEnabled && temperature != 0f,\n            )\n            OutlinedTextField(\n                value = state.playgroundPresencePenalty,\n                onValueChange = harnessViewModel::updatePlaygroundPresencePenalty,\n                modifier = Modifier.weight(1f).testTag("playground-presence-penalty"),\n                label = { Text("Presence penalty") },\n                enabled = presentation.inputsEnabled,\n            )\n        }\n'''+marker
          if marker not in text:
              raise SystemExit('main repeat marker missing')
          text = text.replace(marker, fields, 1)
          marker = '''                    "Context ${configuration.contextSize} · Prompt ${configuration.promptTokenCount} · " +\n                        "Seed ${configuration.effectiveSeed} · Repeat ${configuration.repeatPenalty}/${configuration.repeatLastN}",'''
          replacement = '''                    "Context ${configuration.contextSize} · Prompt ${configuration.promptTokenCount} · " +\n                        "Thinking ${configuration.thinkingMode.name.lowercase()} · Seed ${configuration.effectiveSeed}",'''
          if marker not in text:
              raise SystemExit('effective config metrics marker missing')
          text = text.replace(marker, replacement, 1)
          marker = '''                    "Template ${configuration.chatTemplateId} (${configuration.chatTemplateSource.name}) · " +\n                        "System ${configuration.systemPromptVersion ?: "none"}",'''
          replacement = '''                    "Sampler min-p ${configuration.minP} · presence ${configuration.presencePenalty} · " +\n                        "repeat ${configuration.repeatPenalty}/${configuration.repeatLastN} · " +\n                        "Template ${configuration.chatTemplateId} (${configuration.chatTemplateSource.name})",'''
          if marker not in text:
              raise SystemExit('template metrics marker missing')
          text = text.replace(marker, replacement, 1)
          main.write_text(text)
          PY
      - name: Add Qwen3.5 playground assertions
        run: |
          cat > apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/Qwen35PlaygroundIntegrationTest.kt <<'EOF'
          package io.github.daniele21.localllm.phonetest

          import io.github.daniele21.localllm.contracts.ThinkingMode
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class Qwen35PlaygroundIntegrationTest {
              @Test
              fun productPresetsAreOnlyQwen35Presets() {
                  assertEquals(
                      listOf(
                          "qwen35-text-fast",
                          "qwen35-text-quality",
                          "qwen35-thinking",
                          "qwen35-precise",
                          "qwen35-json",
                      ),
                      playgroundPresetOptions.map { it.id },
                  )
                  assertFalse(playgroundPresetOptions.any { it.id.contains("balanced") || it.id.contains("creative") })
              }

              @Test
              fun customFieldsParseThinkingMinPAndPresencePenalty() {
                  val options = PlaygroundRequestOptions.parse(
                      PlaygroundRequestFields(
                          presetId = "",
                          maxOutputTokens = "256",
                          temperature = "0.6",
                          topP = "0.95",
                          topK = "20",
                          minP = "0.1",
                          presencePenalty = "0.5",
                          thinkingMode = ThinkingMode.ENABLED,
                          repeatPenalty = "1",
                          repeatLastN = "64",
                          seed = "42",
                          context = "",
                      ),
                  )
                  assertNull(options.presetId)
                  assertEquals(ThinkingMode.ENABLED, options.thinkingMode)
                  assertEquals(0.1f, options.minP)
                  assertEquals(0.5f, options.presencePenalty)
              }

              @Test
              fun defaultUiIsQwen35QualityNonThinking() {
                  val state = HarnessUiState()
                  assertEquals("qwen35-text-quality", state.playgroundPreset)
                  assertEquals(ThinkingMode.DISABLED, state.playgroundThinkingMode)
                  assertEquals("0", state.playgroundMinP)
                  assertEquals("2", state.playgroundPresencePenalty)
                  assertTrue(state.playgroundTopK == "20")
              }
          }
          EOF
      - name: Format and test playground integration
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply \
            :apps:local-llm-phone-test:testDebugUnitTest \
            :apps:local-llm-phone-test:compileDebugAndroidTestKotlin \
            :apps:local-llm-phone-test:assembleDebug
      - name: Commit playground integration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/q35-playground-once.yml
          git add -u
          git add -f apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/Qwen35PlaygroundIntegrationTest.kt
          git commit -m "feat: expose qwen35 generation profiles in playground"
          git push origin HEAD:dev
