name: Format Phase 1 Once

on:
  push:
    branches:
      - agent/phase-1-consolidation
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: format-phase-1-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-1-consolidation
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply repository formatting
        shell: bash
        run: ./gradlew --no-configuration-cache spotlessApply

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.kt' '*.kts'
          git commit -m "Apply repository formatting"
          git push origin HEAD:agent/phase-1-consolidation
