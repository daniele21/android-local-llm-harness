name: HBG-42 detekt refactor once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'fix/hbg42-host-restart-reconciliation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out HBG-42 head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Refactor current HBG-42 static-analysis regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          coordinator = "integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobCoordinator.kt"
          metadata = "integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobMetadataStore.kt"
          delegate = "integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/SharedRuntimeHostDelegate.kt"

          replace_once(
              coordinator,
              """    private fun submitResolvedIdentity(\n        client: ConsumerLocalLlmClient,\n        request: ConsumerLogicalJobSubmitParcel,\n        identity: SubmissionIdentityResolution.Valid,\n    ): ConsumerLogicalJobResultParcel = when (val resolution = submitToRegistry(identity)) {\n""",
              """    private fun submitResolvedIdentity(\n        client: ConsumerLocalLlmClient,\n        request: ConsumerLogicalJobSubmitParcel,\n        identity: SubmissionIdentityResolution.Valid,\n    ): ConsumerLogicalJobResultParcel = when (val resolution = registry.submitResolved(identity)) {\n""",
          )

          replace_once(
              coordinator,
              """    private fun submitToRegistry(identity: SubmissionIdentityResolution.Valid): RegistrySubmissionResolution = try {\n        RegistrySubmissionResolution.Accepted(\n            registry.submit(identity.scope, identity.clientRequestId, identity.execution),\n        )\n    } catch (_: HostLogicalJobIdentityConflictException) {\n        RegistrySubmissionResolution.Rejected(WireErrorCodes.INVALID_WIRE_REQUEST)\n    } catch (_: HostLogicalJobCapacityException) {\n        RegistrySubmissionResolution.Rejected(WireErrorCodes.CLIENT_BACKPRESSURE)\n    } catch (_: HostLogicalJobPersistenceException) {\n        RegistrySubmissionResolution.Rejected(WireErrorCodes.RUNTIME_FAILURE)\n    }\n\n""",
              "",
          )

          old_start = """    private fun startCreatedJob(\n        client: ConsumerLocalLlmClient,\n        request: ConsumerLogicalJobSubmitParcel,\n        preparedId: String,\n        submitted: HostLogicalJobSnapshot,\n    ): ConsumerLogicalJobResultParcel {\n        val requestParts = runCatching {\n            Triple(\n                request.input.toCoreConsumerInput(),\n                request.outputConstraint.toCoreConsumerOutput(),\n                request.taskDefinitions.map { it.toCoreTaskDefinition() },\n            )\n        }.getOrNull()\n        if (requestParts == null) {\n            val failed = transitionLogicalJobSafely(registry, submitted, HostLogicalJobState.FAILED_FINAL)\n            executionDemand.release(submitted.jobId)\n            if (failed == null) {\n                resultStore.recordError(submitted.jobId, WireErrorCodes.RUNTIME_FAILURE)\n                return resultStore.failure(request.operationId, WireErrorCodes.RUNTIME_FAILURE)\n            }\n            resultStore.recordError(submitted.jobId, WireErrorCodes.INVALID_WIRE_REQUEST)\n            return resultStore.response(request.operationId, failed)\n        }\n\n        val preparing = transitionLogicalJobSafely(registry, submitted, HostLogicalJobState.PREPARING)\n        if (preparing == null) {\n            executionDemand.release(submitted.jobId)\n            resultStore.recordError(submitted.jobId, WireErrorCodes.RUNTIME_FAILURE)\n            return resultStore.failure(request.operationId, WireErrorCodes.RUNTIME_FAILURE)\n        }\n        val session = runCatching { client.createSession(ConsumerPreparedId(preparedId)) }.getOrNull()\n        if (session !is ConsumerSessionResult.Created) {\n            val failed = transitionLogicalJobSafely(registry, preparing, HostLogicalJobState.FAILED_FINAL)\n            executionDemand.release(preparing.jobId)\n            if (failed == null) {\n                resultStore.recordError(preparing.jobId, WireErrorCodes.RUNTIME_FAILURE)\n                return resultStore.failure(request.operationId, WireErrorCodes.RUNTIME_FAILURE)\n            }\n            resultStore.recordError(\n                preparing.jobId,\n                (session as? ConsumerSessionResult.Rejected)?.failure?.code?.toWireCode() ?: WireErrorCodes.RUNTIME_FAILURE,\n            )\n            return resultStore.response(request.operationId, failed)\n        }\n\n        val execution = Execution(client, session.sessionId)\n        synchronized(lock) { executions[preparing.jobId] = execution }\n        val coreRequest = ConsumerGenerationRequest(\n            requestId = RequestId(\"logical:${preparing.jobId.value}\"),\n            sessionId = session.sessionId,\n            input = requestParts.first,\n            outputConstraint = requestParts.second,\n            taskDefinitions = requestParts.third,\n        )\n        val start = runCatching {\n            client.generate(\n                coreRequest,\n                ConsumerGenerationListener { event -> eventHandler.onEvent(preparing.scope, preparing.jobId, event) },\n            )\n        }.getOrNull()\n        when (start) {\n            is ConsumerGenerationStartResult.Accepted -> synchronized(lock) {\n                executions[preparing.jobId]?.handle = start.handle\n            }\n\n            is ConsumerGenerationStartResult.Rejected -> eventHandler.finishFailure(\n                preparing.scope,\n                preparing.jobId,\n                start.failure.code.toWireCode(),\n            )\n\n            null -> eventHandler.finishFailure(preparing.scope, preparing.jobId, WireErrorCodes.RUNTIME_FAILURE)\n        }\n        val current = registry.snapshot(preparing.scope, preparing.jobId) ?: preparing\n        return resultStore.response(request.operationId, current)\n    }\n"""

          new_start = """    private fun startCreatedJob(\n        client: ConsumerLocalLlmClient,\n        request: ConsumerLogicalJobSubmitParcel,\n        preparedId: String,\n        submitted: HostLogicalJobSnapshot,\n    ): ConsumerLogicalJobResultParcel {\n        val requestParts = runCatching {\n            Triple(\n                request.input.toCoreConsumerInput(),\n                request.outputConstraint.toCoreConsumerOutput(),\n                request.taskDefinitions.map { it.toCoreTaskDefinition() },\n            )\n        }.getOrNull()\n        val response =\n            if (requestParts == null) {\n                val failed = transitionLogicalJobSafely(registry, submitted, HostLogicalJobState.FAILED_FINAL)\n                executionDemand.release(submitted.jobId)\n                if (failed == null) {\n                    resultStore.recordError(submitted.jobId, WireErrorCodes.RUNTIME_FAILURE)\n                    resultStore.failure(request.operationId, WireErrorCodes.RUNTIME_FAILURE)\n                } else {\n                    resultStore.recordError(submitted.jobId, WireErrorCodes.INVALID_WIRE_REQUEST)\n                    resultStore.response(request.operationId, failed)\n                }\n            } else {\n                val preparing = transitionLogicalJobSafely(registry, submitted, HostLogicalJobState.PREPARING)\n                if (preparing == null) {\n                    executionDemand.release(submitted.jobId)\n                    resultStore.recordError(submitted.jobId, WireErrorCodes.RUNTIME_FAILURE)\n                    resultStore.failure(request.operationId, WireErrorCodes.RUNTIME_FAILURE)\n                } else {\n                    val session = runCatching { client.createSession(ConsumerPreparedId(preparedId)) }.getOrNull()\n                    if (session !is ConsumerSessionResult.Created) {\n                        val failed = transitionLogicalJobSafely(registry, preparing, HostLogicalJobState.FAILED_FINAL)\n                        executionDemand.release(preparing.jobId)\n                        if (failed == null) {\n                            resultStore.recordError(preparing.jobId, WireErrorCodes.RUNTIME_FAILURE)\n                            resultStore.failure(request.operationId, WireErrorCodes.RUNTIME_FAILURE)\n                        } else {\n                            resultStore.recordError(\n                                preparing.jobId,\n                                (session as? ConsumerSessionResult.Rejected)?.failure?.code?.toWireCode()\n                                    ?: WireErrorCodes.RUNTIME_FAILURE,\n                            )\n                            resultStore.response(request.operationId, failed)\n                        }\n                    } else {\n                        val execution = Execution(client, session.sessionId)\n                        synchronized(lock) { executions[preparing.jobId] = execution }\n                        val coreRequest =\n                            ConsumerGenerationRequest(\n                                requestId = RequestId(\"logical:${preparing.jobId.value}\"),\n                                sessionId = session.sessionId,\n                                input = requestParts.first,\n                                outputConstraint = requestParts.second,\n                                taskDefinitions = requestParts.third,\n                            )\n                        val start =\n                            runCatching {\n                                client.generate(\n                                    coreRequest,\n                                    ConsumerGenerationListener { event ->\n                                        eventHandler.onEvent(preparing.scope, preparing.jobId, event)\n                                    },\n                                )\n                            }.getOrNull()\n                        when (start) {\n                            is ConsumerGenerationStartResult.Accepted -> synchronized(lock) {\n                                executions[preparing.jobId]?.handle = start.handle\n                            }\n\n                            is ConsumerGenerationStartResult.Rejected ->\n                                eventHandler.finishFailure(\n                                    preparing.scope,\n                                    preparing.jobId,\n                                    start.failure.code.toWireCode(),\n                                )\n\n                            null ->\n                                eventHandler.finishFailure(\n                                    preparing.scope,\n                                    preparing.jobId,\n                                    WireErrorCodes.RUNTIME_FAILURE,\n                                )\n                        }\n                        val current = registry.snapshot(preparing.scope, preparing.jobId) ?: preparing\n                        resultStore.response(request.operationId, current)\n                    }\n                }\n            }\n        return response\n    }\n"""
          replace_once(coordinator, old_start, new_start)

          replace_once(
              coordinator,
              """private sealed interface RegistrySubmissionResolution {\n    data class Accepted(val submission: HostLogicalJobSubmission) : RegistrySubmissionResolution\n\n    data class Rejected(val code: String) : RegistrySubmissionResolution\n}\n\n""",
              """private sealed interface RegistrySubmissionResolution {\n    data class Accepted(val submission: HostLogicalJobSubmission) : RegistrySubmissionResolution\n\n    data class Rejected(val code: String) : RegistrySubmissionResolution\n}\n\nprivate fun HostLogicalJobRegistry.submitResolved(\n    identity: SubmissionIdentityResolution.Valid,\n): RegistrySubmissionResolution = try {\n    RegistrySubmissionResolution.Accepted(\n        submit(identity.scope, identity.clientRequestId, identity.execution),\n    )\n} catch (_: HostLogicalJobIdentityConflictException) {\n    RegistrySubmissionResolution.Rejected(WireErrorCodes.INVALID_WIRE_REQUEST)\n} catch (_: HostLogicalJobCapacityException) {\n    RegistrySubmissionResolution.Rejected(WireErrorCodes.CLIENT_BACKPRESSURE)\n} catch (_: HostLogicalJobPersistenceException) {\n    RegistrySubmissionResolution.Rejected(WireErrorCodes.RUNTIME_FAILURE)\n}\n\n""",
          )

          old_read = """    private fun readRecord(jobId: String): HostLogicalJobMetadataRecord? {\n        val prefix = recordPrefix(jobId)\n        val clientRequestId = preferences.getString(prefix + FIELD_CLIENT_REQUEST_ID, null) ?: return null\n        val applicationId = preferences.getString(prefix + FIELD_APPLICATION_ID, null) ?: return null\n        val useCaseId = preferences.getString(prefix + FIELD_USE_CASE_ID, null) ?: return null\n        val capabilityRevision = preferences.getString(prefix + FIELD_CAPABILITY_REVISION, null) ?: return null\n        val reasoningMode = preferences.getString(prefix + FIELD_REASONING_MODE, null) ?: return null\n        val outputConstraint = preferences.getString(prefix + FIELD_OUTPUT_CONSTRAINT, null) ?: return null\n        val sessionKind = preferences.getString(prefix + FIELD_SESSION_KIND, null) ?: return null\n        val state = preferences.getString(prefix + FIELD_STATE, null) ?: return null\n        val runtimeSessionId = preferences.getString(prefix + FIELD_RUNTIME_SESSION_ID, null) ?: return null\n        val revision = preferences.getLong(prefix + FIELD_REVISION, INVALID_LONG)\n        val attempt = preferences.getInt(prefix + FIELD_ATTEMPT, INVALID_INT)\n        if (revision < 0 || attempt < 1) return null\n        val presetId = preferences.getString(prefix + FIELD_PRESET_ID, null)\n        val presetVersion = preferences.getInt(prefix + FIELD_PRESET_VERSION, NO_PRESET_VERSION).takeIf { it != NO_PRESET_VERSION }\n        return HostLogicalJobMetadataRecord(\n            jobId = jobId,\n            clientRequestId = clientRequestId,\n            applicationId = applicationId,\n            useCaseId = useCaseId,\n            capabilityRevision = capabilityRevision,\n            presetId = presetId,\n            presetVersion = presetVersion,\n            reasoningMode = reasoningMode,\n            outputConstraint = outputConstraint,\n            sessionKind = sessionKind,\n            state = state,\n            revision = revision,\n            attempt = attempt,\n            runtimeSessionId = runtimeSessionId,\n        )\n    }\n"""
          new_read = """    private fun readRecord(jobId: String): HostLogicalJobMetadataRecord? {\n        val prefix = recordPrefix(jobId)\n        val requiredStrings =\n            REQUIRED_STRING_FIELDS.associateWith { field -> preferences.getString(prefix + field, null) }\n        if (requiredStrings.values.any { value -> value == null }) return null\n\n        val revision = preferences.getLong(prefix + FIELD_REVISION, INVALID_LONG)\n        val attempt = preferences.getInt(prefix + FIELD_ATTEMPT, INVALID_INT)\n        if (revision < 0 || attempt < 1) return null\n\n        val presetId = preferences.getString(prefix + FIELD_PRESET_ID, null)\n        val presetVersion = preferences.getInt(prefix + FIELD_PRESET_VERSION, NO_PRESET_VERSION).takeIf { it != NO_PRESET_VERSION }\n        return HostLogicalJobMetadataRecord(\n            jobId = jobId,\n            clientRequestId = requireNotNull(requiredStrings[FIELD_CLIENT_REQUEST_ID]),\n            applicationId = requireNotNull(requiredStrings[FIELD_APPLICATION_ID]),\n            useCaseId = requireNotNull(requiredStrings[FIELD_USE_CASE_ID]),\n            capabilityRevision = requireNotNull(requiredStrings[FIELD_CAPABILITY_REVISION]),\n            presetId = presetId,\n            presetVersion = presetVersion,\n            reasoningMode = requireNotNull(requiredStrings[FIELD_REASONING_MODE]),\n            outputConstraint = requireNotNull(requiredStrings[FIELD_OUTPUT_CONSTRAINT]),\n            sessionKind = requireNotNull(requiredStrings[FIELD_SESSION_KIND]),\n            state = requireNotNull(requiredStrings[FIELD_STATE]),\n            revision = revision,\n            attempt = attempt,\n            runtimeSessionId = requireNotNull(requiredStrings[FIELD_RUNTIME_SESSION_ID]),\n        )\n    }\n"""
          replace_once(metadata, old_read, new_read)

          replace_once(
              metadata,
              """        const val NO_PRESET_VERSION = Int.MIN_VALUE\n        val RECORD_FIELDS =\n""",
              """        const val NO_PRESET_VERSION = Int.MIN_VALUE\n        val REQUIRED_STRING_FIELDS =\n            listOf(\n                FIELD_CLIENT_REQUEST_ID,\n                FIELD_APPLICATION_ID,\n                FIELD_USE_CASE_ID,\n                FIELD_CAPABILITY_REVISION,\n                FIELD_REASONING_MODE,\n                FIELD_OUTPUT_CONSTRAINT,\n                FIELD_SESSION_KIND,\n                FIELD_STATE,\n                FIELD_RUNTIME_SESSION_ID,\n            )\n        val RECORD_FIELDS =\n""",
          )

          replace_once(
              delegate,
              """class SharedRuntimeHostDelegate private constructor(\n    private val client: LocalLlmClient,\n    val protocolInfo: ProtocolInfoParcel,\n    private val consumerClientFactory: ((ApplicationId) -> ConsumerLocalLlmClient)?,\n    private val consumerControlPlaneHost: ConsumerControlPlaneHost?,\n    private val consumerRuntimeReadinessHost: ConsumerRuntimeReadinessHost?,\n    private val ledger: ClientConnectionLedger,\n    private val controlExecutor: HostControlExecutor,\n    private val readinessExecutor: HostControlExecutor,\n    private val callbackDispatcherFactory: HostCallbackDispatcherFactory,\n    private val logicalJobMetadataStore: HostLogicalJobMetadataStore,\n) : AutoCloseable {\n""",
              """private class SharedRuntimeHostInfrastructure(\n    val ledger: ClientConnectionLedger,\n    val controlExecutor: HostControlExecutor,\n    val readinessExecutor: HostControlExecutor,\n    val callbackDispatcherFactory: HostCallbackDispatcherFactory,\n)\n\nclass SharedRuntimeHostDelegate private constructor(\n    private val client: LocalLlmClient,\n    val protocolInfo: ProtocolInfoParcel,\n    private val consumerClientFactory: ((ApplicationId) -> ConsumerLocalLlmClient)?,\n    private val consumerControlPlaneHost: ConsumerControlPlaneHost?,\n    private val consumerRuntimeReadinessHost: ConsumerRuntimeReadinessHost?,\n    infrastructure: SharedRuntimeHostInfrastructure,\n    logicalJobMetadataStore: HostLogicalJobMetadataStore,\n) : AutoCloseable {\n""",
          )

          replace_once(
              delegate,
              """        consumerControlPlaneHost = consumerControlPlaneHost,\n        consumerRuntimeReadinessHost = consumerRuntimeReadinessHost,\n        ledger = ledger,\n        controlExecutor = controlExecutor,\n        readinessExecutor = readinessExecutor,\n        callbackDispatcherFactory = callbackDispatcherFactory,\n        logicalJobMetadataStore = NoOpHostLogicalJobMetadataStore,\n""",
              """        consumerControlPlaneHost = consumerControlPlaneHost,\n        consumerRuntimeReadinessHost = consumerRuntimeReadinessHost,\n        infrastructure =\n            SharedRuntimeHostInfrastructure(\n                ledger = ledger,\n                controlExecutor = controlExecutor,\n                readinessExecutor = readinessExecutor,\n                callbackDispatcherFactory = callbackDispatcherFactory,\n            ),\n        logicalJobMetadataStore = NoOpHostLogicalJobMetadataStore,\n""",
          )

          replace_once(
              delegate,
              """        consumerControlPlaneHost = consumerControlPlaneHost,\n        consumerRuntimeReadinessHost = consumerRuntimeReadinessHost,\n        ledger = ClientConnectionLedger(),\n        controlExecutor = BoundedSerialHostControlExecutor(),\n        readinessExecutor = BoundedSerialHostControlExecutor(),\n        callbackDispatcherFactory = HostCallbackDispatcherFactory { BoundedSerialHostCallbackDispatcher() },\n        logicalJobMetadataStore = logicalJobMetadataStore,\n    )\n\n    private val resources = HostRuntimeResources()\n""",
              """        consumerControlPlaneHost = consumerControlPlaneHost,\n        consumerRuntimeReadinessHost = consumerRuntimeReadinessHost,\n        infrastructure =\n            SharedRuntimeHostInfrastructure(\n                ledger = ClientConnectionLedger(),\n                controlExecutor = BoundedSerialHostControlExecutor(),\n                readinessExecutor = BoundedSerialHostControlExecutor(),\n                callbackDispatcherFactory = HostCallbackDispatcherFactory { BoundedSerialHostCallbackDispatcher() },\n            ),\n        logicalJobMetadataStore = logicalJobMetadataStore,\n    )\n\n    private val ledger = infrastructure.ledger\n    private val controlExecutor = infrastructure.controlExecutor\n    private val readinessExecutor = infrastructure.readinessExecutor\n    private val callbackDispatcherFactory = infrastructure.callbackDispatcherFactory\n    private val resources = HostRuntimeResources()\n""",
          )
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply canonical formatting
        run: ./gradlew --no-configuration-cache spotlessApply

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobCoordinator.kt
          git add integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/HostLogicalJobMetadataStore.kt
          git add integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/SharedRuntimeHostDelegate.kt
          git commit -m "refactor(hbg42): satisfy lifecycle complexity guards"
          git push origin HEAD:fix/hbg42-host-restart-reconciliation
