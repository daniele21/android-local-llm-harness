name: Model download format sandbox

on:
  push:
    branches:
      - agent/model-download-format-sandbox

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/model-download-formatted-staging
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Format and validate secure downloader
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          ./gradlew --no-configuration-cache --stacktrace \
            spotlessCheck \
            detekt \
            verifyNoModelArtifacts \
            :models:model-download:testDebugUnitTest \
            :models:model-download:lintDebug
          git diff --check

          unexpected="$({ git diff --name-only || true; } | grep -Ev '^models/model-download/src/(main|test)/kotlin/.*\.kt$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "spotlessApply changed unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Publish validated formatted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            models/model-download/src/main/kotlin \
            models/model-download/src/test/kotlin
          git diff --cached --quiet && exit 0
          git commit -m "style: format secure model downloader"
          git push origin HEAD:agent/model-download-formatted-staging
