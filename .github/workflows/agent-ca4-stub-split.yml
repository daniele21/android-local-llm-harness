name: Agent CA-4 stub split
on:
  push:
    branches: [agent/ca4-binder-integration]
permissions:
  contents: write
jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ca4-binder-integration
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/SharedRuntimeBinderStub.kt')
          s=p.read_text()
          s=s.replace('import io.github.daniele21.localllm.transport.binder.contract.IGenerationCallback\n', 'import io.github.daniele21.localllm.transport.binder.contract.IGenerationCallback\nimport io.github.daniele21.localllm.transport.binder.contract.IConsumerLocalLlmService\n')
          marker=') : ILocalLlmService.Stub() {\n'
          s=s.replace(marker, marker+'    private val consumerStub = ConsumerRuntimeBinderStub(authorizer, delegate, callingProcessSource)\n\n', 1)
          for a,b in [('delegate.prepare(', 'delegate.runtimeOperations.prepare('), ('delegate.openSession(', 'delegate.runtimeOperations.openSession('), ('delegate.generate(', 'delegate.runtimeOperations.generate('), ('delegate.cancel(', 'delegate.runtimeOperations.cancel('), ('delegate.closeSession(', 'delegate.runtimeOperations.closeSession(')]:
              s=s.replace(a,b)
          start=s.index('    override fun consumerCapabilities')
          end=s.index('    private fun authorizedCallerOrNull')
          replacement='''    override fun getConsumerApi(): IConsumerLocalLlmService {\n        authorizedCallerOrNull() ?: throw SecurityException("Caller is not authorized")\n        return consumerStub\n    }\n\n'''
          s=s[:start]+replacement+s[end:]
          s=s.replace('    private fun requireAuthorizedCaller(): AuthorizedCaller =\n        authorizedCallerOrNull() ?: throw SecurityException("Caller is not authorized")\n','')
          s=s.replace('        requireAuthorizedCaller()\n        return delegate.protocolInfo','        authorizedCallerOrNull() ?: throw SecurityException("Caller is not authorized")\n        return delegate.protocolInfo')
          p.write_text(s)
          PY
          rm -f .github/workflows/agent-ca4-stub-split.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: split CA-4 Binder stubs' || true
          git push
