name: Fix phone distribution start state

on:
  push:
    branches: [agent/connected-model-distribution-ui]
    paths:
      - ".github/workflows/fix-phone-distribution-start-state.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-phone-distribution-start-state
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/connected-model-distribution-ui
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Publish distribution start states before worker execution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionController.kt")
          text = path.read_text(encoding="utf-8")

          old_download = '''        val accepted = synchronized(lock) {
              if (activeOperation != null) return@synchronized false
              val compatibilityResult = compatibility.getValue(stableId)
              if (!compatibilityResult.compatible || installed.containsKey(release.artifact.digest)) {
                  return@synchronized false
              }
              activeOperation = ActiveOperation(stableId, cancellation)
              operationStates[stableId] = RuntimeModelState(
                  status = PhoneCatalogModelStatus.DOWNLOADING,
                  detail = "Preparing secure download",
              )
              publishLocked("Downloading ${release.displayName}")
              true
          }
          if (!accepted) return

          executor.execute {
          '''
          new_download = '''        val initialState = synchronized(lock) {
              if (activeOperation != null) return@synchronized null
              val compatibilityResult = compatibility.getValue(stableId)
              if (!compatibilityResult.compatible || installed.containsKey(release.artifact.digest)) {
                  return@synchronized null
              }
              activeOperation = ActiveOperation(stableId, cancellation)
              operationStates[stableId] = RuntimeModelState(
                  status = PhoneCatalogModelStatus.DOWNLOADING,
                  detail = "Preparing secure download",
              )
              publishLocked("Downloading ${release.displayName}")
          } ?: return
          listener.onStateChanged(initialState)

          executor.execute {
          '''

          old_install = '''        val handle = synchronized(lock) {
              if (activeOperation != null) return@synchronized null
              val pending = pendingDownloads[stableId] ?: return@synchronized null
              activeOperation = ActiveOperation(stableId, AtomicBoolean(false))
              operationStates[stableId] = RuntimeModelState(
                  status = PhoneCatalogModelStatus.INSTALLING,
                  detail = "Validating GGUF metadata",
              )
              publishLocked("Installing ${release.displayName}")
              pending
          } ?: return

          executor.execute {
          '''
          new_install = '''        val start = synchronized(lock) {
              if (activeOperation != null) return@synchronized null
              val pending = pendingDownloads[stableId] ?: return@synchronized null
              activeOperation = ActiveOperation(stableId, AtomicBoolean(false))
              operationStates[stableId] = RuntimeModelState(
                  status = PhoneCatalogModelStatus.INSTALLING,
                  detail = "Validating GGUF metadata",
              )
              pending to publishLocked("Installing ${release.displayName}")
          } ?: return
          val handle = start.first
          listener.onStateChanged(start.second)

          executor.execute {
          '''

          replacements = [
              (old_download, new_download, "download start state"),
              (old_install, new_install, "installation start state"),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} block, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and run phone app unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace \
            spotlessApply \
            :apps:local-llm-phone-test:testDebugUnitTest
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionController.kt
          git commit -m "Publish model distribution start states"
          git push origin HEAD:agent/connected-model-distribution-ui
