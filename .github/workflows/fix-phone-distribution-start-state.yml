name: Fix phone distribution start state

on:
  push:
    branches: [agent/connected-model-distribution-ui]
    paths:
      - ".github/workflows/fix-phone-distribution-start-state.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-phone-distribution-start-state
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/connected-model-distribution-ui
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Publish distribution start states before worker execution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionController.kt")
          text = path.read_text(encoding="utf-8")

          download_start = text.index("    fun download(stableId: String) {")
          download_end = text.index("    fun cancelDownload(stableId: String) {", download_start)
          download = text[download_start:download_end]
          download = download.replace(
              "        val accepted = synchronized(lock) {",
              "        val initialState = synchronized(lock) {",
              1,
          )
          download = download.replace("return@synchronized false", "return@synchronized null")
          old_download_tail = '''            publishLocked("Downloading ${release.displayName}")
              true
          }
          if (!accepted) return

          executor.execute {
          '''
          new_download_tail = '''            publishLocked("Downloading ${release.displayName}")
          } ?: return
          listener.onStateChanged(initialState)

          executor.execute {
          '''
          if download.count(old_download_tail) != 1:
              raise SystemExit("Unable to locate the formatted download start-state tail")
          download = download.replace(old_download_tail, new_download_tail, 1)
          text = text[:download_start] + download + text[download_end:]

          install_start = text.index("    fun install(stableId: String) {")
          install_end = text.index("    override fun close()", install_start)
          install = text[install_start:install_end]
          install = install.replace(
              "        val handle = synchronized(lock) {",
              "        val start = synchronized(lock) {",
              1,
          )
          old_install_tail = '''            publishLocked("Installing ${release.displayName}")
              pending
          } ?: return

          executor.execute {
          '''
          new_install_tail = '''            pending to publishLocked("Installing ${release.displayName}")
          } ?: return
          val handle = start.first
          listener.onStateChanged(start.second)

          executor.execute {
          '''
          if install.count(old_install_tail) != 1:
              raise SystemExit("Unable to locate the formatted installation start-state tail")
          install = install.replace(old_install_tail, new_install_tail, 1)
          text = text[:install_start] + install + text[install_end:]

          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and run phone app unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace \
            spotlessApply \
            :apps:local-llm-phone-test:testDebugUnitTest
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionController.kt
          git commit -m "Publish model distribution start states"
          git push origin HEAD:agent/connected-model-distribution-ui
