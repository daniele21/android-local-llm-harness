name: Fix phone distribution start state

on:
  push:
    branches: [agent/connected-model-distribution-ui]
    paths:
      - ".github/workflows/fix-phone-distribution-start-state.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-phone-distribution-start-state
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/connected-model-distribution-ui
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Publish distribution start states before worker execution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionController.kt")
          lines = path.read_text(encoding="utf-8").splitlines()

          download_start = lines.index("    fun download(stableId: String) {")
          cancel_start = lines.index("    fun cancelDownload(stableId: String) {")
          accepted_index = lines.index("        val accepted = synchronized(lock) {", download_start, cancel_start)
          lines[accepted_index] = "        val initialState = synchronized(lock) {"
          for index in range(accepted_index, cancel_start):
              lines[index] = lines[index].replace("return@synchronized false", "return@synchronized null")
          true_index = lines.index("            true", accepted_index, cancel_start)
          del lines[true_index]
          cancel_start -= 1
          accepted_guard_index = lines.index("        if (!accepted) return", accepted_index, cancel_start)
          if lines[accepted_guard_index - 1] != "        }":
              raise SystemExit("Unexpected download synchronized-block boundary")
          lines[accepted_guard_index - 1] = "        } ?: return"
          lines[accepted_guard_index] = "        listener.onStateChanged(initialState)"

          install_start = lines.index("    fun install(stableId: String) {")
          handle_index = lines.index("        val handle = synchronized(lock) {", install_start)
          lines[handle_index] = "        val start = synchronized(lock) {"
          publish_index = lines.index(
              '            publishLocked("Installing ${release.displayName}")',
              handle_index,
          )
          if lines[publish_index + 1] != "            pending":
              raise SystemExit("Unexpected installation synchronized-block result")
          lines[publish_index] = '            pending to publishLocked("Installing ${release.displayName}")'
          del lines[publish_index + 1]
          executor_index = lines.index("        executor.execute {", publish_index)
          lines[executor_index:executor_index] = [
              "        val handle = start.first",
              "        listener.onStateChanged(start.second)",
              "",
          ]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Format and run phone app unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace \
            spotlessApply \
            :apps:local-llm-phone-test:testDebugUnitTest
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/PhoneModelDistributionController.kt
          git commit -m "Publish model distribution start states"
          git push origin HEAD:agent/connected-model-distribution-ui
