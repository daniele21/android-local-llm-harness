name: Recover model management

on:
  push:
    branches:
      - agent/recover-model-management

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/recover-model-management
          fetch-depth: 2
      - name: Apply focused recovery
        shell: bash
        run: |
          git show HEAD^:.github/workflows/recover-model-management.yml > /tmp/bootstrap.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/bootstrap.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.rindex("\n          PY")
          body = source[start:end]
          lines = [(line[10:] if line.startswith('          ') else line) for line in body.splitlines()]
          Path('/tmp/recover_model_management.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/recover_model_management.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover safe phone model management"
          git push origin HEAD:agent/recover-model-management
