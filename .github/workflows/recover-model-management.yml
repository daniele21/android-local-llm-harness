name: Recover model management

on:
  push:
    branches:
      - agent/recover-model-management

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/recover-model-management
          fetch-depth: 7
      - name: Apply focused recovery
        shell: bash
        run: |
          git show e5f79d4ccd290e6d53bbba668856cd8320a8eb43:.github/workflows/recover-model-management.yml > /tmp/bootstrap.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/bootstrap.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.rindex("\n          PY")
          body = source[start:end]
          lines = [(line[10:] if line.startswith('          ') else line) for line in body.splitlines()]
          lines[275] = "if needle in text:\n    text = text.replace(needle, replacement, 1)\nelse:\n    index = replacement.index('val management')\n    line_start = replacement.rfind('\\n', 0, index) + 1\n    management_insert = replacement[line_start:]\n    text = text.replace('            return PhoneModelDistributionController(\\n', management_insert, 1)"
          lines[276] = ""
          lines[368] = "if old in text:\n    text = text.replace(old, new, 1)\nelse:\n    anchor = '                    HarnessPrimaryButton(\\n                        \"Use in Playground\",'\n    start = text.index(anchor)\n    end_marker = '                        onSelectInstalled(installed)\\n                    }\\n'\n    end = text.index(end_marker, start) + len(end_marker)\n    text = text[:start] + new + text[end:]"
          lines[369] = "ui.write_text(text)"
          Path('/tmp/recover_model_management.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/recover_model_management.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover safe phone model management"
          git push origin HEAD:agent/recover-model-management
