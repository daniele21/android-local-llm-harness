name: Agent CA-4 split
on:
  push:
    branches: [agent/ca4-binder-integration]
permissions:
  contents: write
jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ca4-binder-integration
      - name: Split consumer transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('transports/android-binder-contract/src/main/aidl/io/github/daniele21/localllm/transport/binder/contract/ILocalLlmService.aidl')
          s=p.read_text()
          s=s.replace('import io.github.daniele21.localllm.transport.binder.contract.IClientLifecycle;','import io.github.daniele21.localllm.transport.binder.contract.IClientLifecycle;\nimport io.github.daniele21.localllm.transport.binder.contract.IConsumerLocalLlmService;')
          marker='    void consumerCapabilities('
          if marker in s:
              s=s[:s.index(marker)]+'    IConsumerLocalLlmService getConsumerApi();\n}\n'
          p.write_text(s)
          for rel in ['BinderConsumerLifecycleAdapter.kt','BinderConsumerGenerationAdapter.kt']:
              p=Path('transports/android-binder-client/src/main/kotlin/io/github/daniele21/localllm/transport/binder/client')/rel
              s=p.read_text()
              for a,b in [('consumerCapabilities','consumer.capabilities'),('consumerPrepare','consumer.prepare'),('consumerOpenSession','consumer.openSession'),('consumerGenerate','consumer.generate'),('consumerCancel','consumer.cancel'),('consumerCloseSession','consumer.closeSession')]:
                  s=s.replace('endpoint.service.'+a,'endpoint.service.'+b)
              p.write_text(s)
          PY
          rm -f ca4-gate.log .github/workflows/agent-ca4-split.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: apply CA-4 split' || true
          git push
