name: Q35 detekt refactor once

on:
  push:
    paths:
      - ".github/workflows/q35-detekt-refactor-once.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply refactor
        run: python3 .github/scripts/q35_detekt_refactor_once.py
      - name: Validate refactor
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache \
            spotlessApply \
            detekt \
            :models:model-install:testDebugUnitTest \
            :core:runtime-core:testDebugUnitTest \
            :apps:local-llm-phone-test:testDebugUnitTest \
            :apps:local-llm-phone-test:compileDebugAndroidTestKotlin
      - name: Commit refactor and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/q35-detekt-refactor-once.yml .github/scripts/q35_detekt_refactor_once.py
          git add models/model-install core/runtime-core apps/local-llm-phone-test
          git commit -m "refactor: simplify qwen35 generation validation"
          git push origin HEAD:dev
