name: Temporary OMBRA 7B formatting

on:
  push:
    branches:
      - agent/tmp-format-ombra-7b-20260815

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply Spotless
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Capture formatter output
        run: |
          git diff --binary > /tmp/ombra-7b-format.patch
          mkdir -p /tmp/ombra-7b-formatted
          cp apps/local-llm-console/src/main/kotlin/io/github/daniele21/localllm/console/ombra/OmbraReviewExportScreens.kt /tmp/ombra-7b-formatted/
          cp apps/local-llm-console/src/main/kotlin/io/github/daniele21/localllm/console/ombra/OmbraReviewUiState.kt /tmp/ombra-7b-formatted/
          cp apps/local-llm-console/src/main/kotlin/io/github/daniele21/localllm/console/presentation/OmbraWorkflowLifecycleTransitions.kt /tmp/ombra-7b-formatted/
      - uses: actions/upload-artifact@v4
        with:
          name: ombra-7b-format-output
          path: |
            /tmp/ombra-7b-format.patch
            /tmp/ombra-7b-formatted
