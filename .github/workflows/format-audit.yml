name: Format audit

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Capture exact Spotless changes
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace spotlessApply
          mkdir -p build/format-audit
          git diff --name-only > build/format-audit/files.txt
          git diff --binary > build/format-audit/spotless.patch

      - uses: actions/upload-artifact@v4
        with:
          name: format-audit
          path: build/format-audit
