name: Q35 compatibility patch once

on:
  push:
    paths:
      - ".github/workflows/q35-compat-patch-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply compatibility gate
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          patch(
            'models/model-install/src/main/kotlin/io/github/daniele21/localllm/install/ModelInstallation.kt',
            '''data class GgufArtifactMetadata(\n    val version: UInt,\n    val architecture: String?,\n    val name: String?,\n    val fileType: Long?,\n    val quantization: String? = null,\n)''',
            '''data class GgufArtifactMetadata(\n    val version: UInt,\n    val architecture: String?,\n    val name: String?,\n    val fileType: Long?,\n    val quantization: String? = null,\n    val keyValueCount: Long? = null,\n    val tensorCount: Long? = null,\n    val contextLength: Long? = null,\n    val blockCount: Long? = null,\n    val embeddingLength: Long? = null,\n)''')
          patch(
            'models/model-install/src/main/kotlin/io/github/daniele21/localllm/install/ModelInstallation.kt',
            '''    QUANTIZATION_MISMATCH,\n    MODEL_STORE_IMPORT_FAILED,''',
            '''    QUANTIZATION_MISMATCH,\n    GGUF_MANIFEST_MISMATCH,\n    MODEL_STORE_IMPORT_FAILED,''')
          patch(
            'models/model-install/src/main/kotlin/io/github/daniele21/localllm/install/ModelInstallation.kt',
            '''            validateInspectedMetadata(request, metadata)?.let {\n                return fail(observer, installationId, it.code, it.detail)\n            }\n\n            emit(observer, installationId, ModelInstallationStage.IMPORTING)''',
            '''            validateInspectedMetadata(request, metadata)?.let {\n                return fail(observer, installationId, it.code, it.detail)\n            }\n            Qwen35CompatibilityManifest.forRelease(request.release.id)\n                ?.mismatch(request.release, metadata)\n                ?.let { mismatch ->\n                    return fail(\n                        observer,\n                        installationId,\n                        ModelInstallationFailureCode.GGUF_MANIFEST_MISMATCH,\n                        "Reference GGUF metadata mismatch: $mismatch",\n                    )\n                }\n\n            emit(observer, installationId, ModelInstallationStage.IMPORTING)''')

          patch(
            'backends/llama-cpp/src/main/cpp/gguf_metadata.h',
            '''    std::optional<std::int64_t> file_type;\n};''',
            '''    std::optional<std::int64_t> file_type;\n    std::optional<std::int64_t> context_length;\n    std::optional<std::int64_t> block_count;\n    std::optional<std::int64_t> embedding_length;\n};''')
          patch(
            'backends/llama-cpp/src/main/cpp/gguf_metadata.cpp',
            '''    result.metadata.file_type = read_optional_integer(context, "general.file_type");\n\n    gguf_free(context);''',
            '''    result.metadata.file_type = read_optional_integer(context, "general.file_type");\n    if (!result.metadata.architecture.empty()) {\n        const std::string prefix = result.metadata.architecture + ".";\n        result.metadata.context_length = read_optional_integer(context, (prefix + "context_length").c_str());\n        result.metadata.block_count = read_optional_integer(context, (prefix + "block_count").c_str());\n        result.metadata.embedding_length = read_optional_integer(context, (prefix + "embedding_length").c_str());\n    }\n\n    gguf_free(context);''')
          patch(
            'backends/llama-cpp/src/main/cpp/llama_jni.cpp',
            '''        metadata.file_type.has_value() ? std::to_string(metadata.file_type.value()) : std::string{},\n    };''',
            '''        metadata.file_type.has_value() ? std::to_string(metadata.file_type.value()) : std::string{},\n        metadata.context_length.has_value() ? std::to_string(metadata.context_length.value()) : std::string{},\n        metadata.block_count.has_value() ? std::to_string(metadata.block_count.value()) : std::string{},\n        metadata.embedding_length.has_value() ? std::to_string(metadata.embedding_length.value()) : std::string{},\n    };''')

          patch(
            'backends/llama-cpp/src/main/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppBridge.kt',
            '''                    fileType = response[8].ifBlank { null }?.toLong(),\n                ),''',
            '''                    fileType = response[8].ifBlank { null }?.toLong(),\n                    contextLength = response[9].ifBlank { null }?.toLong(),\n                    blockCount = response[10].ifBlank { null }?.toLong(),\n                    embeddingLength = response[11].ifBlank { null }?.toLong(),\n                ),''')
          patch(
            'backends/llama-cpp/src/main/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppBridge.kt',
            'const val INSPECTION_SUCCESS_FIELD_COUNT = 9',
            'const val INSPECTION_SUCCESS_FIELD_COUNT = 12')
          patch(
            'backends/llama-cpp/src/main/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppBridge.kt',
            '''    val fileType: Long?,\n)''',
            '''    val fileType: Long?,\n    val contextLength: Long?,\n    val blockCount: Long?,\n    val embeddingLength: Long?,\n)''')

          patch(
            'backends/llama-cpp/src/main/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppGgufArtifactInspector.kt',
            '''                    fileType = result.metadata.fileType,\n                ),''',
            '''                    fileType = result.metadata.fileType,\n                    keyValueCount = result.metadata.keyValueCount,\n                    tensorCount = result.metadata.tensorCount,\n                    contextLength = result.metadata.contextLength,\n                    blockCount = result.metadata.blockCount,\n                    embeddingLength = result.metadata.embeddingLength,\n                ),''')

          p = Path('backends/llama-cpp/src/test/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppGgufArtifactInspectorTest.kt')
          text = p.read_text()
          text = text.replace('''                            "15",\n                        ),''', '''                            "15",\n                            "262144",\n                            "24",\n                            "1024",\n                        ),''', 1)
          text = text.replace('''        assertEquals(15L, result.metadata.fileType)''', '''        assertEquals(15L, result.metadata.fileType)\n        assertEquals(4L, result.metadata.keyValueCount)\n        assertEquals(2L, result.metadata.tensorCount)\n        assertEquals(262144L, result.metadata.contextLength)\n        assertEquals(24L, result.metadata.blockCount)\n        assertEquals(1024L, result.metadata.embeddingLength)''', 1)
          p.write_text(text)

          p = Path('backends/llama-cpp/src/test/kotlin/io/github/daniele21/localllm/llamacpp/LlamaCppBridgeTest.kt')
          text = p.read_text()
          text = text.replace('''                "fixture-model",\n                "15",\n            ),''', '''                "fixture-model",\n                "15",\n                "262144",\n                "24",\n                "1024",\n            ),''', 1)
          text = text.replace('''        assertEquals(15L, metadata.fileType)\n        assertEquals(model.absolutePath, nativeApi.lastInspectedPath)''', '''        assertEquals(15L, metadata.fileType)\n        assertEquals(262144L, metadata.contextLength)\n        assertEquals(24L, metadata.blockCount)\n        assertEquals(1024L, metadata.embeddingLength)\n        assertEquals(model.absolutePath, nativeApi.lastInspectedPath)''', 1)
          text = text.replace('''inspection = arrayOf("ok", "3", "32", "0", "0", "0", "", "", ""),''', '''inspection = arrayOf("ok", "3", "32", "0", "0", "0", "", "", "", "", "", ""),''', 1)
          text = text.replace('''        assertEquals(null, result.metadata.fileType)''', '''        assertEquals(null, result.metadata.fileType)\n        assertEquals(null, result.metadata.contextLength)\n        assertEquals(null, result.metadata.blockCount)\n        assertEquals(null, result.metadata.embeddingLength)''', 1)
          p.write_text(text)
          PY
      - name: Format and test
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply \
            :models:model-install:testDebugUnitTest \
            :backends:llama-cpp:testDebugUnitTest
      - name: Commit compatibility gate and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/q35-compat-patch-once.yml
          git add models/model-install backends/llama-cpp
          git commit -m "feat: enforce qwen35 reference gguf fingerprints"
          git push origin HEAD:dev
