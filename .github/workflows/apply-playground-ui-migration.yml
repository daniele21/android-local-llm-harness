name: Apply Playground UI migration

on:
  push:
    branches:
      - agent/playground-viewmodel-udf
    paths:
      - scripts/apply-playground-ui-migration.py
      - .github/workflows/apply-playground-ui-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/playground-viewmodel-udf
          fetch-depth: 0

      - name: Refine ownership assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-playground-ui-migration.py")
          text = path.read_text(encoding="utf-8")
          start = text.index('for forbidden in ("playgroundState"')
          end = text.index('activity_path.write_text', start)
          replacement = '''for declaration in (
              "private var playgroundState ",
              "private var playgroundPrompt ",
              "private var playgroundMaxTokens ",
              "private var playgroundTemperature ",
              "private var playgroundSeed ",
          ):
              if declaration in activity:
                  raise RuntimeError(f"MainActivity still owns migrated field: {declaration}")
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Apply deterministic migration
        run: python3 scripts/apply-playground-ui-migration.py

      - name: Remove one-off migration assets
        run: |
          rm scripts/apply-playground-ui-migration.py
          rm .github/workflows/apply-playground-ui-migration.yml

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(phone-test): migrate Playground to ViewModel UDF"
          git push origin HEAD:agent/playground-viewmodel-udf
