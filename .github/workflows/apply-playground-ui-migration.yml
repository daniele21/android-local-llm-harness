name: Apply Playground UI migration

on:
  push:
    branches:
      - agent/playground-viewmodel-udf
    paths:
      - scripts/apply-playground-ui-migration.py
      - .github/workflows/apply-playground-ui-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/playground-viewmodel-udf
          fetch-depth: 0

      - name: Apply deterministic migration
        run: python3 scripts/apply-playground-ui-migration.py

      - name: Remove one-off migration assets
        run: |
          rm scripts/apply-playground-ui-migration.py
          rm .github/workflows/apply-playground-ui-migration.yml

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(phone-test): migrate Playground to ViewModel UDF"
          git push origin HEAD:agent/playground-viewmodel-udf
