name: Finalize model management fix

on:
  push:
    branches:
      - agent/recover-model-management

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.head_commit.message == 'Add final model management test fixer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/recover-model-management
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Apply recovery source fixes
        run: python3 scripts/finalize_model_management_recovery.py
      - name: Validate recovered model management
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply :apps:local-llm-phone-test:compileDebugKotlin :apps:local-llm-phone-test:testDebugUnitTest
      - name: Remove temporary recovery automation
        run: |
          rm scripts/finalize_model_management_recovery.py
          rm .github/workflows/fix-model-management-compile.yml
          rm .github/workflows/finalize-model-management-fix.yml
      - name: Commit recovered implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix model management integration compile errors"
          git push origin HEAD:agent/recover-model-management
