name: Q35-6 Benchmark Identity Staging

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.head_commit.message == 'chore: stage q35-6 benchmark identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Apply Q35-6 benchmark identity patch
        run: python3 scripts/q35-6-benchmark-identity-patch.py
      - name: Format
        run: ./gradlew spotlessApply
      - name: Validate benchmark identity and persistence
        run: >-
          ./gradlew
          :observability:contracts:test
          :observability:benchmark-engine:test
          :observability:room-store:testDebugUnitTest
          detekt
      - name: Commit validated changes and remove staging files
        run: |
          git rm .github/workflows/q35-6-benchmark-identity-staging.yml scripts/q35-6-benchmark-identity-patch.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: make benchmark identity execution-strict'
          git push origin HEAD:dev
