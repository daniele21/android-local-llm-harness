name: Q35-6 Benchmark Identity Staging

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Apply Q35-6 benchmark identity patch
        run: python3 scripts/q35-6-benchmark-identity-patch.py
      - name: Complete identity fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          telemetry = Path('observability/contracts/src/main/kotlin/io/github/daniele21/localllm/observability/Telemetry.kt')
          text = telemetry.read_text()
          text = text.replace(
              'data class BenchmarkExecutionIdentity private constructor(val fingerprint: String)',
              'data class BenchmarkExecutionIdentity(val fingerprint: String)',
          )
          telemetry.write_text(text)

          path = Path('observability/room-store/src/test/kotlin/io/github/daniele21/localllm/observability/room/RoomTelemetryRepositoryTest.kt')
          text = path.read_text()
          text = text.replace(
              'import io.github.daniele21.localllm.observability.BenchmarkBaseline\n',
              'import io.github.daniele21.localllm.observability.BenchmarkBaseline\nimport io.github.daniele21.localllm.observability.BenchmarkExecutionIdentity\n',
          )
          text = text.replace(
              '            ModelLoadKind.WARM,\n        ),',
              '            ModelLoadKind.WARM,\n            BenchmarkExecutionIdentity.fromFingerprint("b".repeat(64)),\n        ),',
          )
          path.write_text(text)
          PY
      - name: Format
        run: ./gradlew spotlessApply
      - name: Validate benchmark identity and persistence
        run: ./gradlew :observability:contracts:test :observability:benchmark-engine:test :observability:room-store:testDebugUnitTest detekt
      - name: Commit validated changes and remove staging files
        run: |
          git rm .github/workflows/q35-6-benchmark-identity-staging.yml scripts/q35-6-benchmark-identity-patch.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: make benchmark identity execution-strict"
          git push origin HEAD:dev
