name: Agent Spotless apply

on:
  push:
    branches:
      - agent/qwen35-4b-unsloth-q4

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Apply repository Spotless formatter
        run: ./gradlew --no-configuration-cache spotlessApply
      - name: Commit formatted source and remove temporary workflow
        run: |
          rm .github/workflows/agent-spotless-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository Spotless formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
