name: Temporary OMBRA verification

on:
  push:
    branches:
      - agent/tmp-format-ombra-1b

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify OMBRA JVM slice
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace \
            spotlessCheck detekt \
            :apps:local-llm-console:testDebugUnitTest
