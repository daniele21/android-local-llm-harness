name: Validate model inventory foundation

on:
  push:
    branches: [agent/models-udf-foundation]
    paths:
      - .github/workflows/validate-model-inventory-foundation.yml
      - apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelInventory.kt
      - apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessUiState.kt
      - apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelInventoryTest.kt
      - apps/local-llm-phone-test/src/test/kotlin/io/github/daniele21/localllm/phonetest/HarnessModelInventoryReducerTest.kt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate model inventory foundation
        run: |
          chmod +x gradlew
          ./gradlew \
            spotlessCheck \
            detekt \
            :apps:local-llm-phone-test:testDebugUnitTest \
            :apps:local-llm-phone-test:lintDebug \
            :apps:local-llm-phone-test:compileDebugKotlin \
            --no-configuration-cache \
            --stacktrace
