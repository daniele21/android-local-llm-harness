name: Generate brand assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_brand_assets.py
      - .github/workflows/generate-brand-assets.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate dark and light assets
        run: python scripts/generate_brand_assets.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/brand
          if git diff --cached --quiet; then
            echo "Brand assets are already up to date."
            exit 0
          fi
          git commit -m "Generate Harness brand assets"
          git push
