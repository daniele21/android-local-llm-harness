name: Agent CA-4 delegate split
on:
  push:
    branches: [agent/ca4-binder-integration]
permissions:
  contents: write
jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ca4-binder-integration
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('integrations/android-service-host/src/main/kotlin/io/github/daniele21/localllm/integration/servicehost/SharedRuntimeHostDelegate.kt')
          s=p.read_text()
          s=s.replace('private val runtimeOperations = HostRuntimeOperations', 'internal val runtimeOperations = HostRuntimeOperations')
          s=s.replace('private val consumerOperations = ConsumerHostOperations', 'internal val consumerOperations = ConsumerHostOperations')
          s=s[:s.index('    fun prepare(')]+s[s.index('    fun unregisterClient('):]
          p.write_text(s)
          PY
          rm -f .github/workflows/agent-ca4-delegate-split.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: split CA-4 delegate operations' || true
          git push
