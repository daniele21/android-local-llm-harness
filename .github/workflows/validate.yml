name: Validate

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Validation scope and repository guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.scope.outputs.android }}
      native: ${{ steps.scope.outputs.native }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/detect_ci_scope.py \
            --event "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify coding-agent navigation
        run: python3 scripts/verify-agent-navigation.py

      - name: Check repository scripts
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          python3 -m py_compile scripts/*.py
          python3 scripts/test_detect_ci_scope.py
          bash scripts/test-verify-llama-cpp-pin.sh
          bash scripts/run-device-e2e.sh --help >/dev/null
          bash scripts/capture-device-e2e-evidence.sh --help >/dev/null

  native:
    name: Native host tests
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify llama.cpp pin
        run: ./scripts/verify-llama-cpp-pin.sh

      - name: Run native host tests
        shell: bash
        run: |
          cmake \
            -S backends/llama-cpp/src/test-native \
            -B build/native-tests \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-tests --parallel 2
          ctest --test-dir build/native-tests --output-on-failure

  android:
    name: Android validation
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify llama.cpp pin
        run: ./scripts/verify-llama-cpp-pin.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Check repository formatting
        run: ./gradlew --stacktrace spotlessCheck

      - name: Run static analysis and repository guards
        run: |
          ./gradlew \
            --no-configuration-cache \
            --stacktrace \
            detekt \
            verifyNoModelArtifacts

      - name: Test, lint and build Android artifacts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew \
            --stacktrace \
            check \
            lintDebug \
            :apps:local-llm-console:lintInternal \
            :apps:local-llm-phone-test:lintRelease \
            :core:contracts:assembleDebug \
            :core:runtime-core:assembleDebug \
            :models:model-profile:assembleDebug \
            :models:model-store:assembleDebug \
            :backends:llama-cpp:assembleDebug \
            :observability:contracts:assembleDebug \
            :observability:in-memory-store:assembleDebug \
            :observability:room-store:assembleDebug \
            :observability:room-store:assembleDebugAndroidTest \
            :observability:health-engine:assembleDebug \
            :observability:android-resource-probe:assembleDebug \
            :observability:benchmark-engine:assembleDebug \
            :transports:in-process:assembleDebug \
            :apps:local-llm-console:assembleInternal \
            :apps:device-test-runner:assembleDebug \
            :apps:device-test-runner:assembleDebugAndroidTest \
            :apps:local-llm-phone-test:assembleDebug \
            :apps:local-llm-phone-test:bundleRelease \
            2>&1 | tee build/android-validation.log

      - name: Verify Android native packaging
        run: python3 scripts/verify-android-packaging.py

      - name: Upload console APKs
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-console-apks
          path: apps/local-llm-console/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload device test APKs
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-device-test-apks
          path: apps/device-test-runner/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload phone test artifacts
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-phone-test-artifacts
          path: |
            apps/local-llm-phone-test/build/outputs/apk/**/*.apk
            apps/local-llm-phone-test/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload Android libraries
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-harness-aars
          path: "**/build/outputs/aar/*.aar"
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload failure reports
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            **/build/reports/**
            build/android-validation.log
          if-no-files-found: warn
          retention-days: 7

  validation:
    name: Repository validation
    if: always()
    needs: [scope, native, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate validation jobs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Validation scope and repository guards failed: $SCOPE_RESULT" >&2
            exit 1
          fi

          for job_result in "$NATIVE_RESULT" "$ANDROID_RESULT"; do
            if [[ "$job_result" != "success" && "$job_result" != "skipped" ]]; then
              echo "Required validation job failed: $job_result" >&2
              exit 1
            fi
          done

          echo "Repository validation passed."
