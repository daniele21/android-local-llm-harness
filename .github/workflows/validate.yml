name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply and commit initial formatting
        shell: bash
        run: |
          ./gradlew --no-configuration-cache spotlessApply
          git diff --check

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply repository formatting"
            git push
          fi

      - name: Validate project
        shell: bash
        run: |
          ./gradlew \
            --stacktrace \
            qualityCheck \
            check \
            lintDebug \
            :apps:local-llm-console:lintInternal \
            assembleDebug \
            :apps:local-llm-console:assembleInternal

      - name: Upload console APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-console-apks
          path: apps/local-llm-console/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Android libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-harness-aars
          path: "**/build/outputs/aar/*.aar"
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: "**/build/reports/**"
          if-no-files-found: warn
