name: Validate

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify coding-agent navigation
        run: python3 scripts/verify-agent-navigation.py

      - name: Verify llama.cpp pin
        run: ./scripts/verify-llama-cpp-pin.sh

      - name: Run native host tests
        shell: bash
        run: |
          cmake \
            -S backends/llama-cpp/src/test-native \
            -B build/native-tests \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-tests --parallel 2
          ctest --test-dir build/native-tests --output-on-failure

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Select Gradle command
        shell: bash
        run: |
          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            chmod +x gradlew
            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
          fi

      - name: Check repository formatting
        shell: bash
        run: |
          "$GRADLE_COMMAND" --stacktrace spotlessCheck

      - name: Run static analysis and repository guards
        shell: bash
        run: |
          "$GRADLE_COMMAND" \
            --no-configuration-cache \
            --stacktrace \
            detekt \
            verifyNoModelArtifacts

      - name: Run JVM unit tests
        shell: bash
        run: |
          "$GRADLE_COMMAND" --stacktrace check

      - name: Run Android Lint
        shell: bash
        run: |
          "$GRADLE_COMMAND" \
            --stacktrace \
            lintDebug \
            :apps:local-llm-console:lintInternal

      - name: Build Android artifacts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          "$GRADLE_COMMAND" \
            --stacktrace \
            :core:contracts:assembleDebug \
            :core:runtime-core:assembleDebug \
            :models:model-profile:assembleDebug \
            :models:model-store:assembleDebug \
            :backends:llama-cpp:assembleDebug \
            :observability:contracts:assembleDebug \
            :observability:in-memory-store:assembleDebug \
            :transports:in-process:assembleDebug \
            :apps:local-llm-console:assembleInternal \
            :apps:device-test-runner:assembleDebug \
            :apps:device-test-runner:assembleDebugAndroidTest \
            2>&1 | tee build/android-artifacts.log

      - name: Upload console APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-console-apks
          path: apps/local-llm-console/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload device test APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-device-test-apks
          path: apps/device-test-runner/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Android libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-harness-aars
          path: "**/build/outputs/aar/*.aar"
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            **/build/reports/**
            build/android-artifacts.log
          if-no-files-found: warn
