name: Validate

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply repository formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply and commit Spotless output
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace spotlessApply
          if ! git diff --quiet -- . ':!third_party'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add observability core settings.gradle.kts AGENTS.md
            git commit -m "Apply benchmark engine formatting"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
