name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Select Gradle command
        shell: bash
        run: |
          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            chmod +x gradlew
            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
          fi

      - name: Validate project
        shell: bash
        run: |
          "$GRADLE_COMMAND" \
            --stacktrace \
            qualityCheck \
            check \
            lintDebug \
            :apps:local-llm-console:lintInternal \
            assembleDebug \
            :apps:local-llm-console:assembleInternal

      - name: Upload console APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-console-apks
          path: apps/local-llm-console/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Android libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-harness-aars
          path: "**/build/outputs/aar/*.aar"
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: "**/build/reports/**"
          if-no-files-found: warn
