name: Format model download module

on:
  push:
    branches:
      - agent/model-catalog-persistence

permissions:
  contents: write

jobs:
  format-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/model-catalog-persistence
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - name: Format and register validation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/validate.yml')
          text = path.read_text()
          marker = '            models:model-catalog\n'
          addition = marker + '            models:model-download\n'
          if '            models:model-download\n' not in text:
              if marker not in text:
                  raise SystemExit('validation module marker not found')
              path.write_text(text.replace(marker, addition, 1))
          PY
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
          git rm .github/workflows/format-model-download.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format secure model downloader"
          git push origin HEAD:agent/model-catalog-persistence
