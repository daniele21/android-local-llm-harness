name: Agent CA-4 proof host refactor
on:
  push:
    branches: [agent/ca4-binder-integration]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ca4-binder-integration
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessRuntimeGraph.kt')
          s=p.read_text()
          for line in [
              'import io.github.daniele21.localllm.contracts.MAX_CONVERSATION_MESSAGES\n',
              'import io.github.daniele21.localllm.contracts.MAX_GENERATION_INPUT_CHARACTERS\n',
              'import io.github.daniele21.localllm.contracts.MAX_JSON_SCHEMA_CHARACTERS\n',
          ]:
              s=s.replace(line,'')
          s=s.replace('maxInputCharacters = MAX_GENERATION_INPUT_CHARACTERS', 'maxInputCharacters = 32_768')
          s=s.replace('maxConversationMessages = MAX_CONVERSATION_MESSAGES', 'maxConversationMessages = 128')
          s=s.replace('maxJsonSchemaCharacters = MAX_JSON_SCHEMA_CHARACTERS', 'maxJsonSchemaCharacters = 32_768')
          s=s.replace('    fun consumerClient(applicationId: ApplicationId): ConsumerLocalLlmClient {', '    val consumerClientFactory: (ApplicationId) -> ConsumerLocalLlmClient = { applicationId ->')
          p.write_text(s)

          p=Path('apps/local-llm-phone-test/src/main/kotlin/io/github/daniele21/localllm/phonetest/HarnessSharedRuntimeService.kt')
          s=p.read_text().replace('consumerClientFactory = runtimeGraph::consumerClient', 'consumerClientFactory = runtimeGraph.consumerClientFactory')
          p.write_text(s)
          PY
          rm -f .github/workflows/agent-ca4-proof-host-refactor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: refactor CA-4 proof host' || true
          git push
