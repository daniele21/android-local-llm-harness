name: Fix Playground presentation formatting

on:
  push:
    branches:
      - agent/playground-presentation-tests
    paths:
      - scripts/fix-playground-presentation-format.py
      - .github/workflows/fix-playground-presentation-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/playground-presentation-tests
          fetch-depth: 0

      - name: Apply deterministic formatting
        run: python3 scripts/fix-playground-presentation-format.py

      - name: Remove one-off assets
        run: |
          rm scripts/fix-playground-presentation-format.py
          rm .github/workflows/fix-playground-presentation-format.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(phone-test): format Playground presentation UI"
          git push origin HEAD:agent/playground-presentation-tests
