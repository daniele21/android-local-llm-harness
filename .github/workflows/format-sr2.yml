name: Temporary SR2 formatting capture

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply repository formatter
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache spotlessApply
      - name: Upload formatted SR2 sources
        uses: actions/upload-artifact@v7
        with:
          name: sr2-formatted-sources
          path: integrations/android-service-host/**
          retention-days: 1
