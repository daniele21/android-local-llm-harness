version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android-build-tooling:
        patterns:
          - "com.android.*"
          - "com.diffplug.*"
          - "io.gitlab.arturbosch.detekt*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
