complexity:
  LongMethod:
    active: true
    threshold: 100
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    active: true
    excludes:
      - '**/ConsumerControlPlaneWireMapping.kt'
      - '**/AidlSharedRuntimeRemoteService.kt'
      - '**/BinderConsumerLocalLlmClient.kt'
      - '**/HarnessRuntimeGraph.kt'
      - '**/HarnessConsumerControlPlaneHost.kt'
      - '**/ConsumerRuntimeBinderStub.kt'
      - '**/ConnectionLedger.kt'
      - '**/ConsumerControlPlaneHostOperations.kt'

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Error
      - Exception
      - RuntimeException

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: true
    max: 4
    excludes:
      - '**/HarnessConsumerControlPlaneHost.kt'
      - '**/ConsumerControlPlaneHostOperations.kt'
  WildcardImport:
    active: true
